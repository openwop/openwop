# openwop spec-corpus publishing workflow.
#
# After the 2026-06 extractions, the spec corpus's only publishable artifact is
# the conformance suite (conformance/ -> @openwop/openwop-conformance). The three
# SDKs moved to openwop/openwop-sdks (TS/Python/Go) and publish from there; the
# CLI publishes from openwop/openwop-cli. The pack registry deploys from
# openwop/openwop-registry.
#
#   Tag pattern                Triggers              Use case
#   -----------------          ----------------      -----------------------
#   v*                         publish-conformance   Corpus-aligned release
#   openwop-conformance/v*     publish-conformance   Scenario addition / suite fix
#
# A coordinated spec release (v*) must also push the matching SDK release tags in
# openwop/openwop-sdks — see PUBLISHING.md §"Versioning alignment".
#
# See PUBLISHING.md for the full pre-publish checklist and rollback procedure.

name: openwop — Publish

on:
  push:
    tags:
      - 'v*'
      - 'openwop-conformance/v*'

jobs:
  validate-tag:
    runs-on: ubuntu-latest
    steps:
      - name: Validate tag format
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          case "$tag" in
            v[0-9]*.[0-9]*.[0-9]*|\
            v[0-9]*.[0-9]*.[0-9]*-*|\
            openwop-conformance/v[0-9]*.[0-9]*.[0-9]*|\
            openwop-conformance/v[0-9]*.[0-9]*.[0-9]*-*)
              echo "tag '$tag' matches expected SemVer pattern"
              ;;
            *)
              echo "::error::tag '$tag' does not match any expected SemVer pattern"
              echo "Expected one of:"
              echo "  vX.Y.Z[-prerelease]                       (corpus-aligned release)"
              echo "  openwop-conformance/vX.Y.Z[-prerelease]       (conformance only)"
              exit 1
              ;;
          esac

  preflight:
    needs: validate-tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Spec corpus consistency check
        run: npm run openwop:check

  publish-conformance:
    needs: preflight
    if: |
      startsWith(github.ref, 'refs/tags/v') ||
      startsWith(github.ref, 'refs/tags/openwop-conformance/v')
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
      # Upgrade npm to 11.5.1+ for OIDC trusted-publisher support. Node 20
      # ships npm 10.8.2.
      - run: npm install -g npm@latest
      - run: cd conformance && npm ci
      - run: cd conformance && npm run build:cli
      # OIDC-authenticated publish — npm 11.5.1+ accepts the OIDC token from
      # `permissions: id-token: write` automatically. No NODE_AUTH_TOKEN needed.
      # Trusted-publisher config: npmjs.com/package/@openwop/openwop-conformance/access.
      # Idempotency guard: conformance has an independent version line bumped via
      # its own `openwop-conformance/v*` tag, so a corpus `v*` tag almost always
      # finds it already published — skip rather than fail.
      - name: Publish to npm (skip if already published)
        run: |
          cd conformance
          PKG=$(node -p "require('./package.json').name")
          VER=$(node -p "require('./package.json').version")
          if npm view "$PKG@$VER" version >/dev/null 2>&1; then
            echo "✓ $PKG@$VER is already on npm — skipping publish (idempotent)."
          else
            npm publish --access public --provenance
          fi
