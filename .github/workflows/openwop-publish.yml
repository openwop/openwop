# openwop spec-corpus publishing workflow.
#
# After the 2026-06 extractions, the spec corpus's only publishable artifact is
# the conformance suite (conformance/ -> @openwop/openwop-conformance). The three
# SDKs moved to openwop/openwop-sdks (TS/Python/Go) and publish from there; the
# CLI publishes from openwop/openwop-cli. The pack registry deploys from
# openwop/openwop-registry.
#
#   Tag pattern                Triggers              Use case
#   -----------------          ----------------      -----------------------
#   v*                         publish-conformance   Corpus-aligned release
#   openwop-conformance/v*     publish-conformance   Scenario addition / suite fix
#
# A coordinated spec release (v*) must also push the matching SDK release tags in
# openwop/openwop-sdks — see PUBLISHING.md §"Versioning alignment".
#
# See PUBLISHING.md for the full pre-publish checklist and rollback procedure.

name: openwop — Publish

on:
  push:
    tags:
      - 'v*'
      - 'openwop-conformance/v*'

jobs:
  validate-tag:
    runs-on: ubuntu-latest
    steps:
      - name: Validate tag format
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          case "$tag" in
            v[0-9]*.[0-9]*.[0-9]*|\
            v[0-9]*.[0-9]*.[0-9]*-*|\
            openwop-conformance/v[0-9]*.[0-9]*.[0-9]*|\
            openwop-conformance/v[0-9]*.[0-9]*.[0-9]*-*)
              echo "tag '$tag' matches expected SemVer pattern"
              ;;
            *)
              echo "::error::tag '$tag' does not match any expected SemVer pattern"
              echo "Expected one of:"
              echo "  vX.Y.Z[-prerelease]                       (corpus-aligned release)"
              echo "  openwop-conformance/vX.Y.Z[-prerelease]       (conformance only)"
              exit 1
              ;;
          esac

  preflight:
    needs: validate-tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Spec corpus consistency check
        run: npm run openwop:check

  # Finding-2 cross-repo release-alignment guard. A coordinated spec release
  # (`v*`) MUST be matched by SDK release tags in openwop/openwop-sdks (the SDKs
  # track the spec major per PUBLISHING.md §"Versioning alignment"). This job
  # makes that step loud + best-effort files a tracking issue in openwop-sdks so
  # the SDKs can't silently fall behind the spec they implement. It only runs on
  # a coordinated `v*` tag, not on `openwop-conformance/v*` (conformance-only).
  remind-sdk-release:
    needs: validate-tag
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Announce required openwop-sdks release
        run: |
          VER="${GITHUB_REF#refs/tags/}"
          echo "::warning::Coordinated spec release ${VER} — push matching SDK tags in openwop/openwop-sdks (openwop/${VER}, openwop-client/${VER}, go/${VER}) per PUBLISHING.md §Versioning alignment."
      - name: Open tracking issue in openwop-sdks (best-effort)
        continue-on-error: true
        env:
          # Optional cross-repo token; the step no-ops cleanly if unset.
          GH_TOKEN: ${{ secrets.SDKS_RELEASE_DISPATCH_TOKEN }}
        run: |
          [ -z "${GH_TOKEN:-}" ] && { echo "No SDKS_RELEASE_DISPATCH_TOKEN set — skipping issue creation."; exit 0; }
          VER="${GITHUB_REF#refs/tags/}"
          gh issue create --repo openwop/openwop-sdks \
            --title "Release SDKs for spec ${VER}" \
            --body "Coordinated spec release \`${VER}\` landed in openwop/openwop. Per PUBLISHING.md §\"Versioning alignment\", push matching SDK tags here: \`openwop/${VER}\`, \`openwop-client/${VER}\`, \`go/${VER}\`." \
            || echo "issue creation failed (non-blocking)"

  publish-conformance:
    needs: preflight
    if: |
      startsWith(github.ref, 'refs/tags/v') ||
      startsWith(github.ref, 'refs/tags/openwop-conformance/v')
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
      # Upgrade npm to 11.5.1+ for OIDC trusted-publisher support. Node 20
      # ships npm 10.8.2.
      - run: npm install -g npm@latest
      - run: cd conformance && npm ci
      - run: cd conformance && npm run build:cli
      # OIDC-authenticated publish — npm 11.5.1+ accepts the OIDC token from
      # `permissions: id-token: write` automatically. No NODE_AUTH_TOKEN needed.
      # Trusted-publisher config: npmjs.com/package/@openwop/openwop-conformance/access.
      # Identity guard, not an existence guard (2026-08-25).
      #
      # This step used to skip whenever `npm view $PKG@$VER` succeeded, i.e.
      # whenever the version EXISTED. That is a version-number comparison
      # standing in for a content comparison, and it failed exactly once it
      # mattered: package.json read 1.138.1 while npm served a DIFFERENT
      # 1.138.1 — fifteen files of drift, including a new globalSetup and seven
      # scenarios. A release tag would have gone green, published NOTHING, and
      # left every claim about "suite 1.138.1" ambiguous. The drift's only
      # symptom was this step printing "already on npm" and exiting 0, which is
      # precisely what a correct no-op prints.
      #
      # The idempotency the comment wanted is still here — a corpus `v*` tag
      # finding an identical, already-published version still skips. What no
      # longer passes is a version that exists with different contents.
      - name: Verify the published version still identifies these contents
        run: node scripts/check-published-suite-identity.mjs --require-network

      - name: Publish to npm (skip only when byte-identical)
        run: |
          cd conformance
          PKG=$(node -p "require('./package.json').name")
          VER=$(node -p "require('./package.json').version")
          if npm view "$PKG@$VER" version >/dev/null 2>&1; then
            # The step above already proved identity, so reaching here means
            # published == this tree. Genuinely nothing to do.
            echo "✓ $PKG@$VER is on npm and byte-identical to this tree — nothing to publish."
          else
            npm publish --access public --provenance
          fi
