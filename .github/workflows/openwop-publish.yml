# openwop spec-corpus publishing workflow.
#
# After the 2026-06 extractions, the spec corpus's only publishable artifact is
# the conformance suite (conformance/ -> @openwop/openwop-conformance). The three
# SDKs moved to openwop/openwop-sdks (TS/Python/Go) and publish from there; the
# CLI publishes from openwop/openwop-cli. The pack registry deploys from
# openwop/openwop-registry.
#
#   Tag pattern                Triggers                        Use case
#   -----------------          ---------------------------     ----------------------
#   v*                         both packages, then verify      Corpus-aligned release
#   openwop-conformance/v*     both packages, then verify      Scenario addition / suite fix
#   openwop-spec-artifacts/v*  spec-artifacts only             Contract-package fix
#
# A conformance tag publishes BOTH because conformance pins
# `peerDependencies['@openwop/spec-artifacts']` to an EXACT version: they are one
# release under two names. While the tag scheme said otherwise, conformance
# shipped rc.20 through rc.28 against a peer that stopped at rc.19 — nine
# published versions no consumer could install. `verify-installable` runs last,
# outside any checkout, because that is the only place the difference shows.
#
# A coordinated spec release (v*) must also push the matching SDK release tags in
# openwop/openwop-sdks — see PUBLISHING.md §"Versioning alignment".
#
# See PUBLISHING.md for the full pre-publish checklist and rollback procedure.

name: openwop — Publish

on:
  push:
    tags:
      - 'v*'
      - 'openwop-conformance/v*'
      - 'openwop-spec-artifacts/v*'

jobs:
  validate-tag:
    runs-on: ubuntu-latest
    steps:
      - name: Validate tag format
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          case "$tag" in
            v[0-9]*.[0-9]*.[0-9]*|\
            v[0-9]*.[0-9]*.[0-9]*-*|\
            openwop-conformance/v[0-9]*.[0-9]*.[0-9]*|\
            openwop-conformance/v[0-9]*.[0-9]*.[0-9]*-*)
              echo "tag '$tag' matches expected SemVer pattern"
              ;;
            openwop-spec-artifacts/v[0-9]*.[0-9]*.[0-9]*|\
            openwop-spec-artifacts/v[0-9]*.[0-9]*.[0-9]*-*)
              echo "tag '$tag' matches expected SemVer pattern (spec-artifacts)"
              ;;
            *)
              echo "::error::tag '$tag' does not match any expected SemVer pattern"
              echo "Expected one of:"
              echo "  vX.Y.Z[-prerelease]                       (corpus-aligned release)"
              echo "  openwop-conformance/vX.Y.Z[-prerelease]       (conformance only)"
              echo "  openwop-spec-artifacts/vX.Y.Z[-prerelease]    (spec-artifacts only)"
              exit 1
              ;;
          esac
      # v2 charter Phase 3 (P3-E): releases come from `main` (2.x) or `release/1.x`
      # (1.x fixes, RFC 0168 §D.3). A tag reachable from neither is refused —
      # the identity check compares the tag's tree to npm, but nothing else
      # proves the tag is on a release line.
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Validate tag ancestry (main or release/1.x)
        run: |
          git fetch --no-tags origin main release/1.x 2>/dev/null || git fetch --no-tags origin main
          ok=0
          for line in origin/main origin/release/1.x; do
            if git rev-parse --verify -q "$line" >/dev/null && git merge-base --is-ancestor "$GITHUB_SHA" "$line"; then ok=1; echo "tag is on $line"; fi
          done
          [ "$ok" = 1 ] || { echo "::error::tag commit $GITHUB_SHA is on neither main nor release/1.x"; exit 1; }

  preflight:
    needs: validate-tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      # v2 charter Phase 3: scripts/derive-v2-api.py (stage 10) reads the v1 API
      # documents with PyYAML — the corpus has no Node YAML parser and the outputs
      # are committed, so a runner without PyYAML must fail loudly, not skip.
      - name: Install PyYAML (stage 10 derive-v2-api --check)
        run: python3 -m pip install --quiet --user pyyaml
      - name: Spec corpus consistency check
        run: npm run openwop:check

  # Finding-2 cross-repo release-alignment guard. A coordinated spec release
  # (`v*`) MUST be matched by SDK release tags in openwop/openwop-sdks (the SDKs
  # track the spec major per PUBLISHING.md §"Versioning alignment"). This job
  # makes that step loud + best-effort files a tracking issue in openwop-sdks so
  # the SDKs can't silently fall behind the spec they implement. It only runs on
  # a coordinated `v*` tag, not on `openwop-conformance/v*` (conformance-only).
  remind-sdk-release:
    needs: validate-tag
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Announce required openwop-sdks release
        run: |
          VER="${GITHUB_REF#refs/tags/}"
          echo "::warning::Coordinated spec release ${VER} — push matching SDK tags in openwop/openwop-sdks (openwop/${VER}, openwop-client/${VER}, go/${VER}) per PUBLISHING.md §Versioning alignment."
      - name: Open tracking issue in openwop-sdks (best-effort)
        continue-on-error: true
        env:
          # Optional cross-repo token; the step no-ops cleanly if unset.
          GH_TOKEN: ${{ secrets.SDKS_RELEASE_DISPATCH_TOKEN }}
        run: |
          [ -z "${GH_TOKEN:-}" ] && { echo "No SDKS_RELEASE_DISPATCH_TOKEN set — skipping issue creation."; exit 0; }
          VER="${GITHUB_REF#refs/tags/}"
          gh issue create --repo openwop/openwop-sdks \
            --title "Release SDKs for spec ${VER}" \
            --body "Coordinated spec release \`${VER}\` landed in openwop/openwop. Per PUBLISHING.md §\"Versioning alignment\", push matching SDK tags here: \`openwop/${VER}\`, \`openwop-client/${VER}\`, \`go/${VER}\`." \
            || echo "issue creation failed (non-blocking)"

  publish-conformance:
    # Ordered AFTER spec-artifacts, not merely alongside it: the peer must exist
    # on the registry before the package that exactly pins it does, or there is a
    # window in which the published suite is uninstallable.
    needs: [preflight, publish-spec-artifacts]
    if: |
      startsWith(github.ref, 'refs/tags/v') ||
      startsWith(github.ref, 'refs/tags/openwop-conformance/v')
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
      # Upgrade npm to 11.5.1+ for OIDC trusted-publisher support. Node 20
      # ships npm 10.8.2.
      - run: npm install -g npm@latest
      - run: cd conformance && npm ci
      - run: cd conformance && npm run build:cli
      # OIDC-authenticated publish — npm 11.5.1+ accepts the OIDC token from
      # `permissions: id-token: write` automatically. No NODE_AUTH_TOKEN needed.
      # Trusted-publisher config: npmjs.com/package/@openwop/openwop-conformance/access.
      # Identity guard, not an existence guard (2026-08-25).
      #
      # This step used to skip whenever `npm view $PKG@$VER` succeeded, i.e.
      # whenever the version EXISTED. That is a version-number comparison
      # standing in for a content comparison, and it failed exactly once it
      # mattered: package.json read 1.138.1 while npm served a DIFFERENT
      # 1.138.1 — fifteen files of drift, including a new globalSetup and seven
      # scenarios. A release tag would have gone green, published NOTHING, and
      # left every claim about "suite 1.138.1" ambiguous. The drift's only
      # symptom was this step printing "already on npm" and exiting 0, which is
      # precisely what a correct no-op prints.
      #
      # The idempotency the comment wanted is still here — a corpus `v*` tag
      # finding an identical, already-published version still skips. What no
      # longer passes is a version that exists with different contents.
      - name: Verify the published version still identifies these contents
        run: node scripts/check-published-suite-identity.mjs --require-network

      - name: Publish to npm (skip only when byte-identical)
        run: |
          cd conformance
          PKG=$(node -p "require('./package.json').name")
          VER=$(node -p "require('./package.json').version")
          if npm view "$PKG@$VER" version >/dev/null 2>&1; then
            # The step above already proved identity, so reaching here means
            # published == this tree. Genuinely nothing to do.
            echo "✓ $PKG@$VER is on npm and byte-identical to this tree — nothing to publish."
          else
            npm publish --access public --provenance $(case "$VER" in *-*) echo "--tag next";; esac)
          fi

  # Suite 2.0.0 (RFC 0168 §D.2): the contract package. Published from the same
  # corpus tag as the suite (a `v*` tag publishes both; `openwop-spec-artifacts/v*`
  # publishes only this). Pre-release versions go to the `next` dist-tag.
  # An `openwop-conformance/v*` tag ALSO publishes this package, and that is not
  # a convenience. `conformance/package.json` pins
  # `peerDependencies['@openwop/spec-artifacts']` to an EXACT version, so the two
  # packages are one release wearing two names. The tag scheme said otherwise,
  # and the gap ran for nine versions: conformance published rc.20 through rc.28
  # while spec-artifacts stopped at rc.19, so every one of those pins a peer that
  # DOES NOT EXIST on npm and fails for any consumer.
  #
  # Nothing caught it because every gate above runs inside a checkout of this
  # repo, where the peer resolves from the monorepo and its absence from the
  # registry is invisible by construction. A tier-1 host found it the only way it
  # can be found: by trying to install the thing we said was ready.
  #
  #   The workspace witnesses what the code does. npm witnesses what a consumer
  #   can obtain. A publish is a claim about the second, and a green run in the
  #   first cannot make it.
  publish-spec-artifacts:
    needs: preflight
    if: startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/tags/openwop-spec-artifacts/v') || startsWith(github.ref, 'refs/tags/openwop-conformance/v')
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: npm install -g npm@latest
      - run: node scripts/generate-spec-artifacts.mjs --check
      - run: node scripts/check-published-suite-identity.mjs --require-network --package spec-artifacts
      - name: Publish @openwop/spec-artifacts
        run: |
          cd spec-artifacts
          PKG=$(node -p "require('./package.json').name"); VER=$(node -p "require('./package.json').version")
          if npm view "$PKG@$VER" version >/dev/null 2>&1; then echo "$PKG@$VER already published and byte-identical (identity step passed)"; exit 0; fi
          npm publish --access public --provenance $(case "$VER" in *-*) echo "--tag next";; esac)

  # The consumer test. Everything above runs inside a checkout of this repo,
  # where `@openwop/spec-artifacts` resolves from the monorepo whether or not it
  # exists on npm. This job installs the PUBLISHED suite into an empty directory
  # with no checkout at all — the only environment that can witness what an
  # outside consumer actually gets.
  #
  # It is the registry-side twin of the lockfile installability gate a tier-1
  # host built (openwop-app#3637) before it had a live case. It has one now, and
  # the case was ours.
  verify-installable:
    needs: [publish-conformance, publish-spec-artifacts]
    if: always() && needs.publish-conformance.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: npm install -g npm@latest
      - name: Install the published suite as an outside consumer
        run: |
          set -uo pipefail
          tag="${GITHUB_REF#refs/tags/}"
          VER="${tag##*/v}"
          echo "verifying @openwop/openwop-conformance@$VER is installable by a consumer"
          work="$(mktemp -d)"
          cd "$work"
          npm init -y >/dev/null
          # A just-published version can 404 briefly while the registry
          # propagates. Retry, because on a single attempt a propagation flake
          # and a real unresolvable peer look identical — which is the failure
          # shape this job exists to stop repeating.
          for i in $(seq 1 12); do
            if npm install "@openwop/openwop-conformance@$VER" --no-audit --no-fund; then
              echo "✓ installed cleanly; peer resolved to $(node -p "require('./node_modules/@openwop/spec-artifacts/package.json').version")"
              exit 0
            fi
            echo "attempt $i failed; waiting for registry propagation"
            sleep 15
          done
          echo "::error::@openwop/openwop-conformance@$VER is NOT installable by a consumer."
          echo "The most likely cause is an exact peerDependency whose version was never published."
          node -e "
            const https=require('https');
            https.get('https://registry.npmjs.org/@openwop%2Fopenwop-conformance',r=>{
              let b='';r.on('data',d=>b+=d);r.on('end',()=>{
                try{
                  const m=JSON.parse(b).versions[process.env.VER];
                  console.log('published peerDependencies:',JSON.stringify(m&&m.peerDependencies));
                }catch(e){console.log('could not read the published manifest');}
              });
            });
          " || true
          exit 1
        env:
          VER: ${{ github.ref_name }}
