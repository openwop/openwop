name: Conformance Soak

# Two independent jobs:
#
#   host-conformance — the regression gate. Boots the SQLite example host
#     (openwop-examples `examples/hosts/sqlite`, a v2-only host since
#     openwop-examples#194) and runs this tree's conformance suite against it
#     at `--target-major 2`, plus the host's own durability test (a SIGKILL
#     mid-run, then the run resumes from the file).
#     **No external network dependencies** — if `packs.openwop.dev` is
#     down, this job still passes or fails on host-only grounds, which is
#     what a regression gate should do.
#
#     The three-language SDK smoke moved to openwop-sdks with the SDKs and
#     does not run here.
#
#   registry-health — separate concern: the hosted node-pack registry at
#     `packs.openwop.dev` is reachable and serves the documented shapes.
#     A registry outage fails THIS job in isolation; the host-conformance
#     job remains a clean signal about the SQLite host.
#
# The RFC 0013 expansion drift guard that used to be a third job compared
# `conformance/src/lib/workflow-chain-expansion.ts` with a byte-mirror in the
# in-memory example host. openwop-examples#194 deleted that host, and no
# remaining host mirrors the algorithm (the v2 reference host implements
# `workflow-chain-packs.md` in its own `chains.ts`), so the guard and its
# script are retired; the live `workflow-chain-*` scenarios still measure
# behaviour.
#
# Both jobs run on the nightly cron + on push to main + on
# workflow_dispatch. They don't depend on each other.

on:
  schedule:
    # 06:00 UTC nightly (off the European/US business-hours peaks).
    - cron: '0 6 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      # The SQLite example host lives in openwop-examples (checked out
      # below). Cross-repo path triggers aren't possible, so host-only changes
      # are exercised by the nightly cron + this repo's conformance/** changes;
      # the openwop-examples repo can also `workflow_dispatch` this gate.
      - 'conformance/**'
      - '.github/workflows/conformance-soak.yml'

# Least privilege: every job here only reads the repo. A job that needs more
# declares it on the job (job-level permissions replace these, not add to them).
permissions:
  contents: read

jobs:
  host-conformance:
    name: SQLite v2 host — conformance at major 2 + durability
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v6

      # Example hosts live in openwop-examples; check them out alongside. The
      # SQLite host imports the v2 reference host's contract modules
      # (`../v2-reference/src/{artifacts,errors,ids,codemap}.ts`), so the whole
      # checkout is needed, but only the SQLite package is installed.
      - name: Check out openwop-examples (example hosts)
        uses: actions/checkout@v6
        with:
          repository: openwop/openwop-examples
          path: examples-ext

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: |
            examples-ext/examples/hosts/sqlite/package-lock.json
            conformance/package-lock.json

      - name: Install SQLite example host
        working-directory: examples-ext/examples/hosts/sqlite
        run: npm ci

      - name: Install conformance suite
        working-directory: conformance
        run: npm ci

      - name: Boot SQLite v2 host (background)
        working-directory: examples-ext/examples/hosts/sqlite
        env:
          OPENWOP_PORT: '3839'
          OPENWOP_API_KEY: openwop-sqlite-dev-key
          # A second key bound to tenant `openwop-sqlite-tenant-b`, so the
          # cross-tenant refusal scenarios run instead of skipping.
          OPENWOP_TENANT2_API_KEY: openwop-sqlite-tenant-b-key
          # Serve THIS tree's fixtures (read before the host's installed
          # suite copy), so the suite under test and the host agree on them.
          OPENWOP_FIXTURES_DIR: ${{ github.workspace }}/conformance/fixtures
          OPENWOP_CLAIM_TTL_MS: '2000'
          OPENWOP_HEARTBEAT_INTERVAL_MS: '500'
        run: |
          rm -rf data
          # node --import tsx (not npm start / npx tsx) so the pid is the host itself.
          nohup node --import tsx src/server.ts > /tmp/host.log 2>&1 &
          echo $! > /tmp/host.pid
          for i in {1..30}; do
            if curl -sf -H 'OpenWOP-Version: 2' "http://127.0.0.1:${OPENWOP_PORT}/.well-known/openwop" > /dev/null; then
              echo "host ready"
              exit 0
            fi
            sleep 1
          done
          echo "host failed to become ready"
          cat /tmp/host.log
          exit 1

      # The host's own durability test: SIGKILLs a host process mid-run and
      # resumes the run from the file, and checks a live claim is respected.
      # It replaces the suite's v1-only multi-process scenarios
      # (`restart-during-run`, `staleClaim`, major 1 in scenario-majors.json),
      # which a v2-only host cannot answer. Its hosts bind their own ports.
      - name: Host durability test (kill mid-run, resume from the file)
        working-directory: examples-ext/examples/hosts/sqlite
        run: npm test
        timeout-minutes: 3

      # The major-2 scenario set, exactly as `openwop-conformance --target-major 2`
      # selects it (scenario-majors.json), minus KNOWN_FAILING. Not strict mode:
      # the host's published measurement (examples/hosts/sqlite/conformance.md) is
      # the default mode, and the strict opt-out lists this job used to carry
      # named v1 profiles. An advertised behaviour that soft-skips is recorded as
      # such in the run's dispositions.
      #
      # KNOWN_FAILING is exact file names, each with its reason in conformance.md:
      #   - v2-effect-seam-manifest.test.ts — the host advertises `replay` but its
      #     node runtime reaches no outbound effect seam yet, so it publishes an
      #     empty `GET /host/effect-seams` list. Remove the entry when the first
      #     seam (webhooks) lands; any other failure reds the gate.
      - name: Conformance suite at major 2
        if: '!cancelled()'
        working-directory: conformance
        env:
          OPENWOP_BASE_URL: http://127.0.0.1:3839
          OPENWOP_API_KEY: openwop-sqlite-dev-key
          OPENWOP_TEST_TENANT_B_API_KEY: openwop-sqlite-tenant-b-key
          OPENWOP_TARGET_MAJOR: '2'
          KNOWN_FAILING: 'v2-effect-seam-manifest.test.ts'
          # OPENWOP_TEST_PUBLIC_REGISTRY deliberately NOT set here — it
          # would mix `packs.openwop.dev` reachability into the host
          # regression signal. Registry health is the next job's
          # responsibility.
        run: |
          set -euo pipefail
          mapfile -t FILES < <(node -e '
            const m = require("./scenario-majors.json").majors;
            const skip = new Set(process.env.KNOWN_FAILING.split(",").filter(Boolean));
            for (const [f, majors] of Object.entries(m)) if (majors.includes(2) && !skip.has(f)) console.log("src/scenarios/" + f);
          ')
          echo "${#FILES[@]} major-2 scenario file(s); known failing: ${KNOWN_FAILING}"
          npx vitest run --config vitest.config.ts --maxWorkers 2 "${FILES[@]}"

      - name: Tear down host
        if: always()
        run: |
          if [ -f /tmp/host.pid ]; then
            kill "$(cat /tmp/host.pid)" 2>/dev/null || true
          fi

      - name: Upload host log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: openwop-host.log
          path: /tmp/host.log
          if-no-files-found: ignore

  registry-health:
    name: Public registry — packs.openwop.dev reachability + shape
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Does NOT depend on host-conformance. A registry outage and a host
    # regression are independent failure signals.

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: conformance/package-lock.json

      - name: Install conformance suite
        working-directory: conformance
        run: npm ci

      - name: Probe packs.openwop.dev discovery + index
        run: |
          set -euo pipefail
          # Standalone curl smoke so the failure-mode separation between
          # "registry unreachable" and "registry shape regressed" is
          # immediate in the GH log.
          curl -fsS https://packs.openwop.dev/.well-known/openwop-registry > /dev/null
          curl -fsS https://packs.openwop.dev/v1/index.json > /dev/null

      - name: Run registry-public conformance scenario
        working-directory: conformance
        env:
          # The scenario doesn't actually hit the OPENWOP_BASE_URL host
          # (it targets `packs.openwop.dev` directly via fetch). The
          # env vars are required by the suite's driver layer even
          # though no host is reached for this file.
          OPENWOP_BASE_URL: https://invalid.example
          OPENWOP_API_KEY: unused
          OPENWOP_TEST_PUBLIC_REGISTRY: 'true'
        run: npx vitest run src/scenarios/registry-public.test.ts
