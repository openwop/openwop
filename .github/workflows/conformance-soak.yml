name: Conformance Soak

# Two independent jobs:
#
#   host-conformance — the actual regression gate. Runs the FULL
#     conformance suite under strict mode against the SQLite reference
#     host. Multi-process scenarios (restart-during-run + staleClaim).
#     Three-language SDK smoke. **No external network dependencies** —
#     if `packs.openwop.dev` is down, this job still passes or fails on
#     host-only grounds, which is what a regression gate should do.
#
#   registry-health — separate concern: the hosted node-pack registry at
#     `packs.openwop.dev` is reachable and serves the documented shapes.
#     A registry outage fails THIS job in isolation; the host-conformance
#     job remains a clean signal about the SQLite host.
#
# Both jobs run on the nightly cron + on push to main + on
# workflow_dispatch. They don't depend on each other.

on:
  schedule:
    # 06:00 UTC nightly (off the European/US business-hours peaks).
    - cron: '0 6 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      # The SQLite reference host now lives in openwop-examples (checked out
      # below). Cross-repo path triggers aren't possible, so host-only changes
      # are exercised by the nightly cron + this repo's conformance/** changes;
      # the openwop-examples repo can also `workflow_dispatch` this gate.
      - 'conformance/**'
      - 'scripts/check-workflow-chain-expansion-sync.mjs'
      - '.github/workflows/conformance-soak.yml'

jobs:
  # SP-01 (2026-08-18): the RFC 0013 expansion drift guard runs in its OWN job.
  # It used to be step 4 of `host-conformance`, and because a failing step aborts
  # the remaining steps of its job, a drift in the reference host's mirrored
  # algorithm MASKED everything after it — the full strict-mode conformance suite
  # and the multi-process durability scenarios (`restart-during-run`,
  # `staleClaim`) never ran. That is not hypothetical: the mirror was missing
  # #819's whole-value raw-typed rule from 2026-07-05, so this workflow was red on
  # every push to `main` from 2026-06-13 until openwop-examples#19, and nobody
  # could see what the suite would have said. Separate jobs mean a mirror drift
  # reds exactly one job and the host lane still reports.
  expansion-drift-guard:
    name: RFC 0013 expansion-algorithm drift guard (conformance vs in-memory host)
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v6

      - name: Check out openwop-examples (reference hosts)
        uses: actions/checkout@v6
        with:
          repository: openwop/openwop-examples
          path: examples-ext

      - uses: actions/setup-node@v6
        with:
          node-version: '24'

      # Plain node reading two files — no npm install, no host boot.
      - name: Workflow-chain expansion drift guard (vs openwop-examples host)
        env:
          OPENWOP_EXAMPLES_DIR: examples-ext
        run: node scripts/check-workflow-chain-expansion-sync.mjs

  host-conformance:
    name: SQLite host — full conformance + multi-process + SDK smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v6

      # Reference hosts moved to openwop-examples; check them out alongside.
      - name: Check out openwop-examples (reference hosts)
        uses: actions/checkout@v6
        with:
          repository: openwop/openwop-examples
          path: examples-ext

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: |
            examples-ext/examples/hosts/sqlite/package-lock.json
            conformance/package-lock.json

      - name: Install SQLite reference host
        working-directory: examples-ext/examples/hosts/sqlite
        run: npm ci

      - name: Install conformance suite
        working-directory: conformance
        run: npm ci

      # The SDKs moved to openwop-sdks. The conformance spec-corpus-validity
      # SDK-helper block self-skips when sdk/typescript/dist is absent (its
      # describe.skipIf guard), so the suite no longer needs the SDK built here.
      - name: Pre-allocate ports for host + OTel collector
        run: |
          echo "OPENWOP_PORT=3838" >> $GITHUB_ENV
          echo "OPENWOP_OTEL_COLLECTOR_PORT=14328" >> $GITHUB_ENV

      - name: Boot SQLite host (background)
        working-directory: examples-ext/examples/hosts/sqlite
        env:
          OPENWOP_PORT: ${{ env.OPENWOP_PORT }}
          OPENWOP_WEBHOOK_ALLOW_PRIVATE: 'true'
          OTEL_EXPORTER_OTLP_ENDPOINT: http://127.0.0.1:${{ env.OPENWOP_OTEL_COLLECTOR_PORT }}
          OPENWOP_OTEL_METRIC_INTERVAL_MS: '500'
          OPENWOP_CLAIM_TTL_MS: '2000'
          OPENWOP_HEARTBEAT_INTERVAL_MS: '500'
        run: |
          rm -rf data
          nohup npx tsx src/server.ts > /tmp/host.log 2>&1 &
          echo $! > /tmp/host.pid
          for i in {1..30}; do
            if curl -sf "http://127.0.0.1:${OPENWOP_PORT}/.well-known/openwop" > /dev/null; then
              echo "host ready"
              exit 0
            fi
            sleep 1
          done
          echo "host failed to become ready"
          cat /tmp/host.log
          exit 1

      - name: Run host-internal audit-tamper test
        working-directory: examples-ext/examples/hosts/sqlite
        run: npm test

      - name: Full conformance suite (strict mode, no file parallelism)
        working-directory: conformance
        env:
          OPENWOP_BASE_URL: http://127.0.0.1:${{ env.OPENWOP_PORT }}
          OPENWOP_API_KEY: openwop-sqlite-dev-key
          OPENWOP_REQUIRE_BEHAVIOR: 'true'
          OPENWOP_OTEL_COLLECTOR: 'true'
          OPENWOP_OTEL_COLLECTOR_PORT: ${{ env.OPENWOP_OTEL_COLLECTOR_PORT }}
          # Profiles + capabilities the SQLite reference host honestly
          # does NOT claim per INTEROP-MATRIX.md (verified against the
          # host's `/.well-known/openwop` advertisement). Per
          # `conformance/src/lib/env.ts` §OPENWOP_OPTED_OUT_PROFILES,
          # listing them here flips strict-mode failure → PASS-by-opt-
          # out for the matching `behaviorGate(<name>, …)` call sites.
          # Distinguishes "host doesn't claim this surface" (good) from
          # "host claims but doesn't deliver" (bug). Without this, the
          # soak gate fails on every push even when no regression
          # occurred — the suite has more capability-gated scenarios
          # than this reference host claims.
          #
          # RFC 0027/0028/0029 `prompts-*` profiles (5 entries) — the
          # SQLite reference host has no prompts implementation
          # (`examples/hosts/sqlite/src/` ships audit/interrupts/
          # observability/server/webhooks only — no `promptStore.ts` or
          # `promptCompose.ts`). The reference workflow-engine host is
          # the only one that wires the RFC 0027/0028/0029 surface end-
          # to-end; SQLite honestly doesn't advertise it. Listed here so
          # strict-mode skip messages cite the right spec section
          # rather than firing a false-positive failure under
          # OPENWOP_REQUIRE_BEHAVIOR.
          #
          # Agent-platform cohort (RFCs 0078–0089, suite v1.11–v1.18) — 18
          # capability-gated profiles the minimal SQLite reference host does NOT
          # implement (verified against its `/.well-known/openwop`: it advertises
          # core/host-sqlite/stream-poll/stream-sse/interrupt-*/auth-api-key-
          # rotation/audit-log-integrity/byok only). These scenarios landed in the
          # suite without a matching opt-out here, turning the strict-mode soak red
          # since ~v1.11 (pre-dating the 2026-06 repo split). The reference
          # workflow-engine/postgres hosts carry these surfaces; SQLite honestly
          # doesn't. Opting out keeps the soak a clean regression signal for the
          # profiles SQLite DOES claim ("0 deterministic failures").
          #
          # RFC 0090/0091/0092 cohort (suite v1.21) — 3 always-on shape probes
          # (verifier-gating, callai-multimodal, agent-capability-degraded) that
          # landed in @openwop/openwop-conformance@1.21.0 without a matching
          # opt-out here. The minimal SQLite host does NOT advertise these
          # profiles (verified: they soft-skip in non-strict mode), so under
          # OPENWOP_REQUIRE_BEHAVIOR=true they turn the soak red. Opting out
          # keeps the strict gate a clean signal for what SQLite DOES claim.
          # 2026-09-01 cohort (13 profiles) — the strict run demanded these
          # and the SQLite host advertises none of them. Verified the honest
          # way rather than by pattern: booted the host and read its live
          # `/.well-known/openwop`, then probed each name at the document
          # root, under `capabilities.`, and in `profiles[]`. All 13 came
          # back `undefined` — the host declares no `profiles` array at all,
          # and its capability keys are memory/feedback/limits/discovery/
          # auth/secrets/modelCapabilities/webhooks/orchestrator/dispatch/
          # agents/subWorkflow. `dispatch.perItemInput` is the one worth
          # naming: `dispatch` IS advertised, the `perItemInput` sub-key is
          # not, so it is opted out at the sub-key and the rest of the
          # dispatch surface stays under strict enforcement.
          #
          # This distinction is the whole point of the list: opting out must
          # mean "the host does not claim this surface", never "the host
          # claims it and fails". A profile that IS advertised must stay out
          # of this list so a real regression can still red the gate.
          #
          # These accounted for ~40 of the failures in the 2026-09-01 run.
          # The other ~200 were a dead host, not a suite problem
          # (better-sqlite3 v11 SIGABRTing on Node 24) — fixed in
          # openwop-examples#26. Both had to land for the soak to report.
          OPENWOP_OPTED_OUT_PROFILES: 'openwop-production,openwop-auth-oauth2-client-credentials,openwop-auth-oidc-user-bearer,openwop-auth-mtls,openwop-replay-fork,workflowChainPacks,prompts-supported,prompts-endpoints,prompts-mutable,prompts-agent-bindings,prompts-observability-full,openwop-agent-platform,openwop-budget-enforcement,openwop-deployment-channel-dispatch,openwop-deployment-lifecycle,openwop-egress-audience-binding,openwop-egress-decision-content-free,openwop-eval-run,openwop-live-allowlist-enforced,openwop-live-invocation-bracket,openwop-live-structured-output,openwop-memory-degraded,openwop-org-chart-scoping,openwop-org-position-no-authority,openwop-roster-attribution,openwop-safefetch-live-audit,openwop-tool-catalog,openwop-tool-session-lifecycle,openwop-trigger-bridge,openwop-verifier-gating,openwop-callai-multimodal,openwop-agent-capability-degraded,openwop-grpc-transport,openwop-i18n,connections.packsSupported,a2a.durableTasks,a2a.pushNotifications,dispatch.perItemInput,mcp-2026-07-28,mcp.mrtr.client,openwop-compensation,openwop-content,openwop-context-budget,openwop-self-hosted-runner,triggerBridge.ingestion,uiPlugins.supported,workflowChainPacks.deferredParameters.supported,workflowChainPacks.hostExpansionSeam'
          # Fixture-id opt-outs — the SQLite host auto-loads every
          # `conformance-*.json` fixture on disk (so the fixture IS
          # advertised in `/.well-known/openwop`) but does not implement
          # the underlying feature for the entries below:
          #   - conformance-dispatch-{input-mapping,output-mapping,
          #     cross-worker-handoff}*  → RFC 0022 §A / §D variable
          #     projection between parent and dispatched child runs is
          #     not implemented in the reference SQLite executor.
          #   - conformance-subworkflow-input-mapping*                  → RFC 0022 §B input
          #     seeding into a `core.subWorkflow` child is not
          #     implemented in the reference SQLite executor.
          #   - openwop-smoke-cost-emit                                 → the SQLite host loads
          #     the fixture workflow but doesn't implement the
          #     `conformance.cost.emit` fixture node, so runs terminate
          #     `failed` instead of `completed`. Cost-emission lives in
          #     the workflow-engine reference; SQLite hasn't picked up
          #     the G6 / O4 cost-attribution path.
          #   - conformance-model-capability-insufficient               → fixture references the
          #     `core.ai.*` node family with RFC 0031
          #     `requiredModelCapabilities` declarations. SQLite's
          #     executor doesn't register these node types so runs fail
          #     with `unsupported_node_type` rather than
          #     `capability_not_provided`. Model-capability gating
          #     lives in the workflow-engine reference.
          # Per `conformance/src/lib/fixtures.ts`, these ids are
          # subtracted from the advertised-fixture cache at suite init
          # so `isFixtureAdvertised(...)` skips the gated scenarios.
          # NOTE: `conformance-subworkflow-parent` stays advertised
          # because the non-OTel `subworkflow.test.ts` passes on SQLite;
          # the OTel-specific opt-out is below.
          OPENWOP_OPTED_OUT_FIXTURES: 'conformance-dispatch-input-mapping*,conformance-dispatch-output-mapping*,conformance-dispatch-cross-worker-handoff*,conformance-subworkflow-input-mapping*,openwop-smoke-cost-emit,conformance-model-capability-insufficient'
          # Scenario-id opt-outs — finer-grained than fixture or
          # profile opt-out. Used when the host correctly advertises
          # the prerequisite fixture + capability, but the specific
          # scenario depends on a feature the host doesn't implement:
          #   - otel-trace-propagation-subworkflow → SQLite advertises
          #     `conformance-subworkflow-parent` AND
          #     `capabilities.observability` (for audit-log integrity),
          #     but doesn't propagate `traceparent` across the
          #     `core.subWorkflow` dispatch boundary.
          # Per `conformance/src/lib/env.ts §isScenarioOptedOut`,
          # individual tests consult this set inside their skip
          # predicate.
          OPENWOP_OPTED_OUT_SCENARIOS: 'otel-trace-propagation-subworkflow'
          # OPENWOP_TEST_PUBLIC_REGISTRY deliberately NOT set here — it
          # would mix `packs.openwop.dev` reachability into the host
          # regression signal. Registry health is the next job's
          # responsibility.
        run: npx vitest run --no-file-parallelism

      # SP-01 follow-up (2026-08-18): run even when the strict suite above
      # reds. Moving the drift guard to its own job un-masked the strict
      # suite — and immediately showed that the strict suite was in turn
      # masking THIS step, which is the durability signal (`restart-during-run`,
      # `staleClaim`) and the one nothing else covers. A step that only runs
      # when everything upstream is green reports nothing on exactly the days
      # you need it. The job still fails when either step fails; both now say
      # what they found.
      - name: Multi-process scenarios (restart-during-run + staleClaim)
        if: '!cancelled()'
        working-directory: conformance
        env:
          OPENWOP_BASE_URL: http://127.0.0.1:${{ env.OPENWOP_PORT }}
          OPENWOP_API_KEY: openwop-sqlite-dev-key
          OPENWOP_RUN_RESTART_DURING_RUN: '1'
          OPENWOP_RUN_STALE_CLAIM: '1'
          # These scenarios spawn their own host child processes (spawnHost →
          # `npx tsx src/server.ts` in repoRoot/<HOST_DIR>). The host moved to
          # openwop-examples (checked out at examples-ext/), so the default
          # 'examples/hosts/sqlite' no longer exists under the spec-repo root that
          # findRepoRoot() resolves to, and spawn fails with `spawn npx ENOENT`
          # (invalid cwd). Point both scenarios at the checked-out host dir.
          OPENWOP_RESTART_DURING_RUN_HOST_DIR: examples-ext/examples/hosts/sqlite
          OPENWOP_STALE_CLAIM_HOST_DIR: examples-ext/examples/hosts/sqlite
        run: |
          npx vitest run src/scenarios/restart-during-run.test.ts src/scenarios/staleClaim.test.ts

      # The three-language SDK smoke (sdk/smoke/all.sh) moved to openwop-sdks with
      # the SDKs; it runs there against a booted host in that repo's CI.

      - name: Tear down host
        if: always()
        run: |
          if [ -f /tmp/host.pid ]; then
            kill "$(cat /tmp/host.pid)" 2>/dev/null || true
          fi

      - name: Upload host log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: openwop-host.log
          path: /tmp/host.log
          if-no-files-found: ignore

  registry-health:
    name: Public registry — packs.openwop.dev reachability + shape
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Does NOT depend on host-conformance. A registry outage and a host
    # regression are independent failure signals.

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: conformance/package-lock.json

      - name: Install conformance suite
        working-directory: conformance
        run: npm ci

      - name: Probe packs.openwop.dev discovery + index
        run: |
          set -euo pipefail
          # Standalone curl smoke so the failure-mode separation between
          # "registry unreachable" and "registry shape regressed" is
          # immediate in the GH log.
          curl -fsS https://packs.openwop.dev/.well-known/openwop-registry > /dev/null
          curl -fsS https://packs.openwop.dev/v1/index.json > /dev/null

      - name: Run registry-public conformance scenario
        working-directory: conformance
        env:
          # The scenario doesn't actually hit the OPENWOP_BASE_URL host
          # (it targets `packs.openwop.dev` directly via fetch). The
          # env vars are required by the suite's driver layer even
          # though no host is reached for this file.
          OPENWOP_BASE_URL: https://invalid.example
          OPENWOP_API_KEY: unused
          OPENWOP_TEST_PUBLIC_REGISTRY: 'true'
        run: npx vitest run src/scenarios/registry-public.test.ts
