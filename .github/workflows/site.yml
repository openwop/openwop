name: Site (build + deploy to Pages)

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'spec/**'
      - 'INTEROP-MATRIX.md'
      - 'README.md'
      - 'examples/hosts/**/conformance.md'
      - '.github/workflows/site.yml'
  pull_request:
    branches: [main]
    paths:
      - 'site/**'
      - 'spec/**'
      - 'INTEROP-MATRIX.md'
      - 'README.md'
      - 'examples/hosts/**/conformance.md'
      - '.github/workflows/site.yml'
  workflow_dispatch:

# Allow only one concurrent deployment, skipping queued runs in between.
# But do NOT cancel in-progress runs (we want every push to publish at
# least once for traceability).
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    name: Build static site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # SITE_DOMAIN drives canonical URLs, OG/Twitter URLs, and the sitemap.xml
      # <loc> entries. When the deploy gate is open (`vars.ALLOW_DEPLOY == '1'`),
      # we also set OPENWOP_REQUIRE_REAL_DOMAIN=1 so build.mjs hard-fails if the
      # operator forgot to provision a domain — better to fail the build than
      # publish a sitemap pointing at an unset domain.
      #
      # Optional vars / secrets:
      #   vars.SITE_DOMAIN          — e.g. "openwop.dev" (no scheme; build.mjs adds https://)
      #   vars.OPENWOP_REPO_URL         — overrides default github.com/openwop/openwop link
      #   vars.OPENWOP_ANALYTICS_DOMAIN — Plausible domain (omit to ship zero JS)
      #   secrets.OPENWOP_GSC_TOKEN     — Google Search Console verification token
      - name: Build site
        env:
          SITE_DOMAIN: ${{ vars.SITE_DOMAIN }}
          OPENWOP_REPO_URL: ${{ vars.OPENWOP_REPO_URL }}
          OPENWOP_REQUIRE_REAL_DOMAIN: ${{ vars.ALLOW_DEPLOY == '1' && '1' || '' }}
          OPENWOP_ANALYTICS_DOMAIN: ${{ vars.OPENWOP_ANALYTICS_DOMAIN }}
          OPENWOP_GSC_TOKEN: ${{ secrets.OPENWOP_GSC_TOKEN }}
        run: |
          cd site
          node src/build.mjs

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  # Public DNS deploy is gated on the release manager setting ALLOW_DEPLOY=1
  # after the OpenWOP v1.0 production-release checklist is complete. Until
  # then, the build job runs (verifying the generator + template render
  # correctly) but deploy is skipped via the `if:` condition below.
  #
  # When the gate closes, change the condition to:
  #   if: github.ref == 'refs/heads/main'
  # Until then, deploys must be run manually via workflow_dispatch with
  # ALLOW_DEPLOY=1 secret/var set.
  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && vars.ALLOW_DEPLOY == '1'
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
