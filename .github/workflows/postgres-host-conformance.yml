name: Postgres host — conformance regression gate

# The regression gate for the Postgres example host (openwop-examples
# `examples/hosts/postgres`), a v2-only host since openwop-examples#197:
# several host processes on one Postgres, claims held as session-level
# advisory locks, and the `auditLogIntegrity` family.
#
# Two jobs:
#
#   in-host — the host's own tests against a real Postgres service:
#     `npm test` (the durability test, whose multi-process cases run because
#     OPENWOP_PG_DSN is set: two host processes on one database, one
#     SIGKILLed mid-run and its run taken over through the released advisory
#     lock; a live lock keeping the other process off a run; plus the
#     audit-tamper test that `conformance/coverage.md` cites), then
#     `npm run test:siblings` (the audit-checkpoint export against this repo's
#     `scripts/verify-audit-checkpoints.mjs`, and the pack consumer against
#     openwop-registry's signed example pack).
#
#   external-suite — boots the host on PGlite (`npm run start:pglite`) and
#     runs the PUBLISHED suite the host pins, `@openwop/openwop-conformance@2.49.15`,
#     at `--target-major 2`. The suite version is pinned, so the totals are
#     fixed and the gate can be exact rather than a percentage:
#
#       Measured 2026-11-25 (two full runs, identical; host conformance.md):
#         Test files  1 failed | 238 passed (239)
#         Tests       1 failed | 956 passed (957)
#         Dispositions executed-pass 480 · executed-fail 2 · inapplicable 771
#
#     MIN_PASSED is the measured 956, MAX_EXECUTED_FAIL the measured 2, and
#     the failing files must be exactly KNOWN_FAILING:
#       - v2-effect-seam-manifest.test.ts — the host advertises `replay` but
#         its node runtime reaches no outbound effect seam yet, so it publishes
#         an empty `GET /host/effect-seams` list (the same gap as the SQLite
#         host). Remove it, and raise MIN_PASSED, when webhooks land.
#     Bump SUITE_VERSION together with the host's own pin, and re-measure.
#
# The v1 lane this workflow used to run (the in-tree suite's major-1 files
# against the v1 host, a 92% pass-rate floor) ended with the host's v1 wire.

on:
  workflow_dispatch:
  schedule:
    # 06:30 UTC nightly: the host lives in another repo, so its own changes
    # reach this gate on the cron (or a dispatch), not on a path trigger.
    - cron: '30 6 * * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/postgres-host-conformance.yml'
      - 'scripts/verify-audit-checkpoints.mjs'
  pull_request:
    paths:
      - '.github/workflows/postgres-host-conformance.yml'
      - 'scripts/verify-audit-checkpoints.mjs'

# Least privilege: every job here only reads the repo.
permissions:
  contents: read

env:
  SUITE_VERSION: '2.49.15'

jobs:
  in-host:
    name: Postgres host — in-host tests (real Postgres, two processes)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: openwop
          POSTGRES_DB: openwop
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 20

    steps:
      - uses: actions/checkout@v6

      # The host imports the v2 reference host's contract modules
      # (`../v2-reference/src/{artifacts,errors,ids,codemap}.ts`), so the whole
      # checkout is needed, but only the Postgres package is installed.
      - name: Check out openwop-examples (example hosts)
        uses: actions/checkout@v6
        with:
          repository: openwop/openwop-examples
          path: examples-ext

      - name: Check out the signed example pack (openwop-registry)
        uses: actions/checkout@v6
        with:
          repository: openwop/openwop-registry
          path: registry-ext
          sparse-checkout: |
            registry/keys
            registry/v1/packs/core.openwop.examples
          sparse-checkout-cone-mode: false

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: examples-ext/examples/hosts/postgres/package-lock.json

      - name: Install Postgres host
        working-directory: examples-ext/examples/hosts/postgres
        run: npm ci --legacy-peer-deps

      - name: Typecheck
        working-directory: examples-ext/examples/hosts/postgres
        run: npm run typecheck

      - name: Durability + audit-tamper tests
        working-directory: examples-ext/examples/hosts/postgres
        env:
          OPENWOP_PG_DSN: postgres://postgres:openwop@127.0.0.1:5432/openwop
        run: npm test
        timeout-minutes: 5

      - name: Audit-checkpoint export + pack consumer tests
        working-directory: examples-ext/examples/hosts/postgres
        env:
          OPENWOP_SPEC_REPO: ${{ github.workspace }}
          OPENWOP_REGISTRY_REPO: ${{ github.workspace }}/registry-ext
        run: npm run test:siblings
        timeout-minutes: 2

  external-suite:
    name: Postgres host — published suite at major 2 (exact floor)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out openwop-examples (example hosts)
        uses: actions/checkout@v6
        with:
          repository: openwop/openwop-examples
          path: examples-ext

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: examples-ext/examples/hosts/postgres/package-lock.json

      - name: Install Postgres host
        working-directory: examples-ext/examples/hosts/postgres
        run: npm ci --legacy-peer-deps

      - name: Boot Postgres host on PGlite (background)
        working-directory: examples-ext/examples/hosts/postgres
        env:
          OPENWOP_PORT: '3841'
          OPENWOP_API_KEY: openwop-postgres-dev-key
          # A second key bound to tenant `openwop-postgres-tenant-b`, so the
          # cross-tenant refusal scenarios run instead of skipping.
          OPENWOP_TENANT2_API_KEY: openwop-postgres-tenant-b-key
          OPENWOP_PG_DSN: ''
        run: |
          # node --import tsx (not npm run / npx tsx) so the pid is the host itself.
          nohup node --import tsx src/server.ts > /tmp/postgres-host.log 2>&1 &
          echo $! > /tmp/postgres-host.pid
          for i in {1..30}; do
            if curl -sf -H 'OpenWOP-Version: 2' "http://127.0.0.1:${OPENWOP_PORT}/.well-known/openwop" > /dev/null; then
              echo "host ready"
              exit 0
            fi
            sleep 1
          done
          echo "host failed to become ready"
          cat /tmp/postgres-host.log
          exit 1

      - name: Published conformance suite at major 2
        working-directory: examples-ext/examples/hosts/postgres
        env:
          OPENWOP_TEST_TENANT_B_API_KEY: openwop-postgres-tenant-b-key
          KNOWN_FAILING: 'v2-effect-seam-manifest.test.ts'
          MIN_PASSED: '956'
          MAX_EXECUTED_FAIL: '2'
        run: |
          set -uo pipefail
          npx -y "@openwop/openwop-conformance@${SUITE_VERSION}" \
            --base-url http://127.0.0.1:3841 --api-key openwop-postgres-dev-key \
            --target-major 2 --max-workers 2 2>&1 | tee /tmp/conformance.out
          sed -r 's/\x1b\[[0-9;]*[A-Za-z]//g' /tmp/conformance.out > /tmp/conformance.plain

          PASSED=$(grep -E '^[[:space:]]*Tests[[:space:]]' /tmp/conformance.plain | tail -1 | grep -oE '[0-9]+ passed' | awk '{print $1}')
          FAILED=$(grep -E '^[[:space:]]*Tests[[:space:]]' /tmp/conformance.plain | tail -1 | grep -oE '[0-9]+ failed' | awk '{print $1}')
          FAILED=${FAILED:-0}
          XFAIL=$(grep -oE 'executed-fail [0-9]+' /tmp/conformance.plain | tail -1 | awk '{print $2}')
          if [ -z "$PASSED" ] || [ -z "$XFAIL" ]; then
            echo "::error::could not parse the suite summary (Tests line or RFC 0148 dispositions)"
            tail -30 /tmp/conformance.plain
            exit 1
          fi

          # The failing files, by name, against the recorded set.
          FILES=$(grep -oE 'FAIL +src/scenarios/[^ ]+\.test\.ts' /tmp/conformance.plain | awk '{print $2}' | sed 's|src/scenarios/||' | sort -u | paste -sd, -)
          EXPECTED=$(printf '%s' "$KNOWN_FAILING" | tr ',' '\n' | sort -u | paste -sd, -)
          echo "passed=$PASSED failed=$FAILED executed-fail=$XFAIL failing-files=${FILES:-none} (known: $EXPECTED)"

          STATUS=0
          if [ "$PASSED" -lt "$MIN_PASSED" ]; then
            echo "::error::$PASSED tests passed, the floor is $MIN_PASSED (measured on suite $SUITE_VERSION)."; STATUS=1
          fi
          if [ "$XFAIL" -gt "$MAX_EXECUTED_FAIL" ]; then
            echo "::error::$XFAIL requirements executed-fail, at most $MAX_EXECUTED_FAIL were measured."; STATUS=1
          fi
          if [ "${FILES:-}" != "$EXPECTED" ]; then
            echo "::error::failing files [${FILES:-none}] differ from the recorded set [$EXPECTED]. Fix the new failure, or, when a known one is fixed, remove it from KNOWN_FAILING and raise MIN_PASSED."; STATUS=1
          fi
          exit $STATUS

      - name: Tear down host
        if: always()
        run: |
          if [ -f /tmp/postgres-host.pid ]; then
            kill "$(cat /tmp/postgres-host.pid)" 2>/dev/null || true
          fi

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: postgres-host-conformance.log
          path: |
            /tmp/postgres-host.log
            /tmp/conformance.out
          if-no-files-found: ignore
