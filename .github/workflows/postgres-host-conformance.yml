name: Postgres host — conformance regression gate

# The Postgres reference host advertises production-profile.md as of
# 2026-05-11. This workflow is the regression gate that catches drift
# against that claim: every push to the host's code or to the
# conformance suite re-runs the suite against a freshly-booted host.
#
# Two distinct passes:
#
#   in-host-smoke — runs the host's full in-process test suite via
#     `npm test` in `examples/hosts/postgres/`. The script chains every
#     file under `test/*.test.ts` plus `npm run test:auth-rotation`
#     for the env-dependent auth-rotation-scoped test (which needs
#     three keys: primary + secondary + tenant2). The authoritative
#     count of tests + their names live in `package.json`'s `test`
#     script — this comment intentionally does NOT enumerate them so a
#     new test landing only requires the script edit, not a workflow
#     edit too.
#
#   external-suite — boots the host via `npm run start:pglite` (the
#     pglite-backed entry point) and runs the FULL conformance suite
#     against it via `npx vitest run` in `conformance/`. Asserts pass-
#     rate ≥85% — the Postgres host's empirical baseline as of
#     2026-05-11 was 86.2% (588/682), matching the SQLite host's 87%.
#
# A drop below 85% means a genuine regression slipped in; the gate
# fires and the merge is blocked.
#
# @see examples/hosts/postgres/conformance-full.md — the public-result
#   evidence this workflow renews on every push.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'conformance/**'
      - 'spec/v1/production-profile.md'
      - '.github/workflows/postgres-host-conformance.yml'
  pull_request:
    paths:
      - 'conformance/**'
      - '.github/workflows/postgres-host-conformance.yml'

jobs:
  in-host-smoke:
    name: Postgres host — in-host smoke suite
    runs-on: ubuntu-latest
    # 25, not 10: the sibling-reconstruction step installs the conformance
    # suite, and vitest 4.1.x (a RUNTIME dependency) declares optional peers on
    # the 5.0.0 tooling packages, each of which requires vitest 5.0.0. npm 12
    # spends ~7 minutes resolving that contradiction. Same cause as the
    # pr-checks.yml budgets; measured 2026-09-04 when this job was cancelled
    # mid-reconstruction, not by a failing test.
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v6

      # Reference hosts moved to openwop-examples; check them out alongside.
      - name: Check out openwop-examples (reference hosts)
        uses: actions/checkout@v6
        with:
          repository: openwop/openwop-examples
          path: examples-ext

      # The postgres host's in-host test suite assumes the old monorepo layout —
      # pack-consumer.test.ts reads <root>/registry/v1/packs + <root>/registry/keys
      # (now in openwop-registry). Check that out too.
      - name: Check out openwop-registry (pack fixtures for pack-consumer test)
        uses: actions/checkout@v6
        with:
          repository: openwop/openwop-registry
          path: registry-ext

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: examples-ext/examples/hosts/postgres/package-lock.json

      - name: Install Postgres host
        working-directory: examples-ext/examples/hosts/postgres
        run: npm ci

      # The host test suite expects spec-corpus + registry siblings at its REPO_ROOT
      # (examples-ext/), via relative imports + join(REPO_ROOT, ...). Reconstruct
      # that layout from the checked-out repos so the in-host smoke runs unchanged:
      #   - conformance/src/lib/*           (spec corpus, stays here)  → mcp-client, oauth2-oidc, reasoning-event tests
      #   - scripts/verify-audit-checkpoints.mjs (spec corpus)         → audit-checkpoint-export test
      #   - registry/v1/packs + registry/keys (openwop-registry)       → pack-consumer test
      - name: Reconstruct spec-corpus + registry siblings for host tests
        run: |
          npm --prefix conformance ci
          ln -s "$GITHUB_WORKSPACE/conformance" examples-ext/conformance
          ln -s "$GITHUB_WORKSPACE/scripts/verify-audit-checkpoints.mjs" \
                examples-ext/scripts/verify-audit-checkpoints.mjs
          ln -s "$GITHUB_WORKSPACE/registry-ext/registry" examples-ext/registry

      - name: Run in-host smoke suite
        working-directory: examples-ext/examples/hosts/postgres
        env:
          OPENWOP_WEBHOOK_ALLOW_PRIVATE: 'true'
        run: npm test

  external-suite:
    name: Postgres host — full conformance suite (pass-rate ≥85%)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v6

      # Reference hosts moved to openwop-examples; check them out alongside.
      - name: Check out openwop-examples (reference hosts)
        uses: actions/checkout@v6
        with:
          repository: openwop/openwop-examples
          path: examples-ext

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: |
            examples-ext/examples/hosts/postgres/package-lock.json
            conformance/package-lock.json

      - name: Install Postgres host
        working-directory: examples-ext/examples/hosts/postgres
        run: npm ci

      - name: Install conformance suite
        working-directory: conformance
        run: npm ci

      - name: Boot Postgres host via pglite (background)
        working-directory: examples-ext/examples/hosts/postgres
        env:
          OPENWOP_WEBHOOK_ALLOW_PRIVATE: 'true'
          OPENWOP_PORT: '3839'
        run: |
          nohup npm run start:pglite > /tmp/postgres-host.log 2>&1 &
          echo $! > /tmp/postgres-host.pid
          for i in {1..30}; do
            if curl -sf "http://127.0.0.1:3839/.well-known/openwop" > /dev/null; then
              echo "host ready"
              exit 0
            fi
            sleep 1
          done
          echo "host failed to become ready"
          cat /tmp/postgres-host.log
          exit 1

      - name: Run full conformance suite
        working-directory: conformance
        env:
          OPENWOP_BASE_URL: http://127.0.0.1:3839
          OPENWOP_API_KEY: openwop-postgres-dev-key
          OPENWOP_WEBHOOK_ALLOW_PRIVATE: 'true'
        run: |
          # Capture exit + stats; allow non-zero exit because the suite
          # has known feature gaps (registry, stream-modes-buffer,
          # cap-breach). Assert on pass-rate floor instead.
          set +e
          npx vitest run --reporter=default 2>&1 | tee /tmp/conformance.out
          set -e

          # Extract `N passed | N failed | N skipped` from the summary.
          # NOTE: the example line that used to sit here as a comment was read
          # out of THIS LOG on 2026-08-25 and quoted as if it were a measurement
          # (Actions echoes the run: script, so a comment is typographically
          # identical to output). Illustrative shape only, deliberately not
          # number-bearing: `Tests  <n> failed | <n> passed | ... (<total>)`.
          PASSED=$(grep -oE '[0-9]+ passed' /tmp/conformance.out | tail -1 | awk '{print $1}')
          TOTAL=$(grep -oE '\([0-9]+\)' /tmp/conformance.out | tail -1 | tr -d '()')
          if [ -z "$PASSED" ] || [ -z "$TOTAL" ] || [ "$TOTAL" -eq 0 ]; then
            echo "Failed to parse vitest summary" >&2
            tail -20 /tmp/conformance.out
            exit 1
          fi

          # Name every failing scenario before reducing them to a fraction.
          # A pass-rate floor converts a specific, named, reproducible failure
          # into an anonymous number: `webhook-signed-delivery` was red here on
          # every run from 2026-08-09 to 2026-08-25 — a reference host
          # contradicting webhooks.md — and the job reported success each time
          # because the rate sat ~10 points above the floor. Nobody reads
          # "N failed" as "one of these is a spec-conformance defect". This
          # does not gate; it makes the fraction attributable.
          # Strip ANSI first. vitest colourises the marker glyph itself, so the
          # raw line is " <ESC>[31m❯<ESC>[39m src/scenarios/x.test.ts ...": an
          # anchored ^\s*❯ never matches, and the FIRST version of this block
          # printed EMPTY while a scenario was genuinely failing — a report
          # that read "all clear" having matched nothing, which is the exact
          # defect the block was added to prevent. Match on content, not glyphs.
          echo "--- failing scenarios (not a gate; the floor below decides) ---"
          sed -r 's/\x1b\[[0-9;]*[A-Za-z]//g' /tmp/conformance.out > /tmp/conformance.plain
          NAMED=$(grep -E '(^|[[:space:]])(FAIL|❯|×)[[:space:]]|\.test\.ts.*[0-9]+ failed' /tmp/conformance.plain \
                  | grep -E '\.test\.ts' | sed 's/^[[:space:]]*/  /' | sort -u)
          [ -n "$NAMED" ] && printf '%s\n' "$NAMED"
          # Self-check: an empty list is only credible when the summary agrees.
          # Without this, a broken matcher and a clean run are indistinguishable
          # — the same "silent on empty" ambiguity that let the header defect
          # ride for 16 days.
          FAILED=$(grep -oE '[0-9]+ failed' /tmp/conformance.plain | tail -1 | awk '{print $1}')
          FAILED=${FAILED:-0}
          NAMED_N=$(printf '%s' "$NAMED" | grep -c . || true)
          if [ "$FAILED" -gt 0 ] && [ "$NAMED_N" -eq 0 ]; then
            echo "::warning::vitest reports ${FAILED} failing test(s) but this step named none — the matcher is broken, not the run clean."
          elif [ "$FAILED" -eq 0 ]; then
            echo "  (none — vitest summary reports 0 failed)"
          fi
          echo "--- end failing scenarios ---"

          # Floor: 85% pass rate. Drop below = regression.
          RATE=$((PASSED * 100 / TOTAL))
          echo "passed=$PASSED total=$TOTAL pass-rate=${RATE}%"
          if [ "$RATE" -lt 85 ]; then
            echo "::error::Postgres host conformance pass-rate dropped below 85% floor: ${RATE}%"
            exit 1
          fi

      - name: Tear down host
        if: always()
        run: |
          if [ -f /tmp/postgres-host.pid ]; then
            kill "$(cat /tmp/postgres-host.pid)" 2>/dev/null || true
          fi

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: postgres-host-conformance.log
          path: |
            /tmp/postgres-host.log
            /tmp/conformance.out
          if-no-files-found: ignore
