name: openwop Spec

on:
  push:
    branches: [main]
    paths-ignore:
      - 'CODE_OF_CONDUCT.md'
      - 'GOVERNANCE.md'
      - 'ROADMAP.md'
      - 'NOTICE'
      - 'LICENSE'
      - 'LICENSE-DOCS'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/PULL_REQUEST_TEMPLATE.md'
  pull_request:
    branches: [main]
    paths-ignore:
      - 'CODE_OF_CONDUCT.md'
      - 'GOVERNANCE.md'
      - 'ROADMAP.md'
      - 'NOTICE'
      - 'LICENSE'
      - 'LICENSE-DOCS'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/PULL_REQUEST_TEMPLATE.md'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '24'

jobs:
  # Validates the spec corpus is internally consistent: schemas compile,
  # OpenAPI/AsyncAPI lint, fixtures validate, prose docs carry status tags.
  # Server-free — runs without any deployed openwop server.
  validate:
    name: Validate spec corpus (server-free)
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.22'

      # v2 charter Phase 3: scripts/derive-v2-api.py (stage 10) reads the v1 API
      # documents with PyYAML — the corpus has no Node YAML parser and the outputs
      # are committed, so a runner without PyYAML must fail loudly, not skip.
      - name: Install PyYAML (stage 10 derive-v2-api --check)
        run: python3 -m pip install --quiet --user pyyaml
      - name: Full server-free release gate
        run: npm run openwop:check

      # Spec-prose pack claims (README/ROADMAP/RFCS/CHANGELOG) must match real
      # registry state. Validated against the live registry at packs.openwop.dev
      # (the catalog lives in openwop-registry now). Kept out of openwop:check
      # itself because it needs network; this step previously lived in the
      # examples.yml workflow that moved to the openwop-examples repo.
      - name: Spec-prose pack claims (live registry)
        run: node scripts/check-doc-pack-claims.mjs --registry https://packs.openwop.dev
