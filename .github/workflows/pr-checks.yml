# Public-CI checks — run on every external PR.
#
# PR CI scope:
#   * `openwop-spec.yml` handles full spec-corpus validation.
#   * This workflow handles changed-path SDK and conformance checks.
#   * `openwop-publish.yml` is tag-only and never runs on PRs.
#   * Triggered on `pull_request` (not `pull_request_target`), so secrets
#     are not available to forked PRs by design.
#
# Path filters keep the matrix lean: a TS-only PR doesn't run the Python
# or Go jobs, and vice-versa.

name: PR Checks

on:
  pull_request:
    branches: [main, 'release/**']

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    # The SDK lint jobs (TS/Python/Go) moved to openwop-sdks with sdk/.
    outputs:
      conformance: ${{ steps.filter.outputs.conformance }}
    steps:
      - uses: actions/checkout@v6
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            conformance:
              - 'conformance/**'

  lint-conformance:
    name: Lint (conformance)
    needs: changes
    if: needs.changes.outputs.conformance == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Lint conformance
        run: |
          cd conformance
          npm ci
          npm run lint --if-present || (echo "::warning::lint script is not configured for this package" && true)

  # The reference app (frontend build + css-token gate + Playwright/axe e2e
  # gate) moved to the openwop-app repo (apps/workflow-engine extracted 2026-06;
  # gated by that repo's own .github/workflows/ci.yml).

  # SDK lint jobs (Python ruff, Go vet+gofmt) moved to openwop-sdks with sdk/.

  # Regression guard: the suite must keep runtime dependencies in dependencies,
  # vitest/ajv/ajv-formats only in devDependencies, so consumers running
  # `npx -y @openwop/openwop-conformance@<version> --base-url ... --api-key ...`
  # got UNRESOLVED_IMPORT errors at vitest config load. The fix promoted them
  # to runtime dependencies. This job packs the suite and installs the tarball
  # into a clean tmp dir — i.e. simulates exactly what a downstream `npm install`
  # of the published package does, dropping devDependencies on the floor.
  # If a future PR moves any of vitest/ajv/ajv-formats back to devDependencies,
  # this gate fails fast on the PR rather than silently shipping a broken release.
  verify-conformance-install:
    name: Verify conformance install path (npx -y guardrail)
    needs: changes
    if: needs.changes.outputs.conformance == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Pack the conformance suite
        run: |
          cd conformance
          npm ci
          npm run build:cli
          npm pack
      - name: Verify runtime deps resolve from packed tarball (consumer's-eye view)
        run: |
          TARBALL=$(ls "$GITHUB_WORKSPACE/conformance/openwop-openwop-conformance-"*.tgz)
          mkdir -p /tmp/install-verify
          cd /tmp/install-verify
          echo '{"name":"install-verify","private":true}' > package.json
          # Suite 2.0.0: the contract is the @openwop/spec-artifacts peer (RFC 0168 §D.2).
          # Before it is published, install it from the tree's own tarball beside the
          # suite — the consumer's-eye view of the exact pin.
          SA_TARBALL="$(cd "$GITHUB_WORKSPACE/spec-artifacts" && npm pack --silent --pack-destination /tmp/install-verify | tail -1)"
          npm install --no-save "/tmp/install-verify/$SA_TARBALL" "$TARBALL"
          node -e "require.resolve('@openwop/spec-artifacts/package.json')" \
            || (echo "::error::@openwop/spec-artifacts peer not resolvable from the installed suite (RFC 0168 §D.2)." && exit 1)
          SUITE="$PWD/node_modules/@openwop/openwop-conformance"
          # vitest is invoked by the suite's bin (dist/cli.js) via `npx vitest`;
          # if not in deps, npx falls through to a registry download (slow + flaky)
          # or fails entirely under restricted networks.
          test -x node_modules/.bin/vitest \
            || (echo "::error::vitest binary not present in installed package — likely back in devDependencies. F-2026-05-06-C regression." && exit 1)
          # ajv + ajv-formats are imported directly by the offline-subset scenarios
          # (fixtures-valid, spec-corpus-validity).
          node -e "require.resolve('ajv/dist/2020.js', { paths: ['$SUITE'] })" \
            || (echo "::error::ajv not resolvable from installed package — likely back in devDependencies. F-2026-05-06-C regression." && exit 1)
          node -e "require.resolve('ajv-formats', { paths: ['$SUITE'] })" \
            || (echo "::error::ajv-formats not resolvable from installed package — likely back in devDependencies. F-2026-05-06-C regression." && exit 1)
          echo "PASS: vitest + ajv + ajv-formats all resolve from packed tarball."
          echo "      Bare 'npx -y @openwop/openwop-conformance@<latest> --base-url ... --api-key ...' install path is intact."
      # Path-resolution guard: the offline subset's REPO_ROOT computation
      # has to resolve schemas/api/fixtures.md against the VENDORED layout
      # of the published tarball, not the repo checkout's parent directory.
      # Earlier tests walked `__dirname/../../..` and landed in
      # `node_modules/@openwop/` — clean on a git clone, ENOENT under
      # npx-style install. Run the offline subset against the packed
      # tarball to catch any future drift.
      - name: Run offline subset against packed tarball (path-resolution guardrail)
        run: |
          cd /tmp/install-verify
          npx -y @openwop/openwop-conformance --offline 2>&1 | tee offline-result.txt
          # `--offline` exits non-zero on any failed scenario; the script
          # has `set -e` semantics by default, so the previous line
          # already aborts on red. We additionally scan the output to
          # guard against silent vacuous passes.
          if grep -q "Test Files .* failed" offline-result.txt; then
            echo "::error::Offline subset reported a failure under the npx-installed tarball. Likely regression in lib/paths.ts layout detection."
            exit 1
          fi
          if ! grep -q "Test Files .* passed" offline-result.txt; then
            echo "::error::Offline subset produced no passing test files — runtime crashed before vitest reported."
            exit 1
          fi
          echo "PASS: offline subset runs cleanly under the npx-installed tarball."
