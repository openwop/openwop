# openwop — post-publish lockfile bump
#
# Fires after `openwop-publish.yml` ("openwop — Publish") completes, checks
# whether @openwop/openwop's latest npm dist-tag drifted from the in-repo
# consumer lockfiles, and (if it did) opens a PR bumping every consumer.
#
# Why: every TS SDK publish historically required a manual lockfile bump in
# `apps/workflow-engine/backend/typescript/` + `apps/workflow-engine/frontend/react/`
# before the demo Cloud Run + Firebase Hosting deploys could pull the new SDK.
# Automating it shaves ~30 min of toil per release window.
#
# Trigger: workflow_run on successful completion of openwop-publish.yml, plus
# workflow_dispatch for manual recovery / validation.
#
# Requires (one-time): Settings → Actions → General → Workflow permissions →
# "Allow GitHub Actions to create and approve pull requests" — both at org level
# (openwop org) and repo level. Plus contents: write + pull-requests: write
# granted below.

name: openwop — Post-publish lockfile bump

on:
  workflow_run:
    workflows: ["openwop — Publish"]
    types: [completed]
  workflow_dispatch: {}

jobs:
  bump-consumers:
    # workflow_run only fires when the upstream workflow succeeded.
    # workflow_dispatch always carries no conclusion field; fall through.
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Discover latest @openwop/openwop on npm
        id: sdk
        run: |
          LATEST=$(npm view @openwop/openwop version)
          echo "latest=$LATEST" >> "$GITHUB_OUTPUT"
          echo "Latest @openwop/openwop on npm: $LATEST"

      - name: Diff lockfiles against latest
        id: diff
        run: |
          BACKEND_LOCK="apps/workflow-engine/backend/typescript/package-lock.json"
          FRONTEND_LOCK="apps/workflow-engine/frontend/react/package-lock.json"
          BACKEND_CURRENT=$(node -e "console.log(require('./$BACKEND_LOCK').packages['node_modules/@openwop/openwop']?.version || 'absent')")
          FRONTEND_CURRENT=$(node -e "console.log(require('./$FRONTEND_LOCK').packages['node_modules/@openwop/openwop']?.version || 'absent')")
          echo "Backend lockfile:  $BACKEND_CURRENT"
          echo "Frontend lockfile: $FRONTEND_CURRENT"
          NEEDS_BUMP="false"
          if [ "$BACKEND_CURRENT" != "${{ steps.sdk.outputs.latest }}" ] && [ "$BACKEND_CURRENT" != "absent" ]; then
            NEEDS_BUMP="true"
          fi
          if [ "$FRONTEND_CURRENT" != "${{ steps.sdk.outputs.latest }}" ] && [ "$FRONTEND_CURRENT" != "absent" ]; then
            NEEDS_BUMP="true"
          fi
          echo "needs_bump=$NEEDS_BUMP" >> "$GITHUB_OUTPUT"
          echo "backend_current=$BACKEND_CURRENT" >> "$GITHUB_OUTPUT"
          echo "frontend_current=$FRONTEND_CURRENT" >> "$GITHUB_OUTPUT"

      - name: Bump backend lockfile
        if: ${{ steps.diff.outputs.needs_bump == 'true' }}
        run: |
          cd apps/workflow-engine/backend/typescript
          npm install "@openwop/openwop@^${{ steps.sdk.outputs.latest }}" --save --ignore-scripts

      - name: Bump frontend lockfile
        if: ${{ steps.diff.outputs.needs_bump == 'true' }}
        run: |
          cd apps/workflow-engine/frontend/react
          npm install "@openwop/openwop@^${{ steps.sdk.outputs.latest }}" --save --ignore-scripts

      - name: Open PR
        if: ${{ steps.diff.outputs.needs_bump == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SDK_VERSION: ${{ steps.sdk.outputs.latest }}
          BACKEND_FROM: ${{ steps.diff.outputs.backend_current }}
          FRONTEND_FROM: ${{ steps.diff.outputs.frontend_current }}
        run: |
          BRANCH="chore/post-publish-bump-openwop-${SDK_VERSION}"
          git config user.name "openwop-bot"
          git config user.email "noreply@openwop.dev"

          # Idempotency guard — if a prior run on the same tag already opened
          # this PR, close out gracefully.
          if git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null 2>&1; then
            echo "Branch $BRANCH already exists on origin; assuming prior run opened the PR."
            exit 0
          fi

          git checkout -b "$BRANCH"
          git add \
            apps/workflow-engine/backend/typescript/package.json \
            apps/workflow-engine/backend/typescript/package-lock.json \
            apps/workflow-engine/frontend/react/package.json \
            apps/workflow-engine/frontend/react/package-lock.json

          if git diff --cached --quiet; then
            echo "Nothing to commit — both lockfiles were already at ${SDK_VERSION}."
            exit 0
          fi

          # Build commit message in a temp file to avoid YAML indentation pitfalls
          # with multi-line strings inside `run: |` blocks.
          cat > /tmp/commit-msg.txt <<EOF
          chore(host): bump @openwop/openwop to ^${SDK_VERSION} post-publish

          Auto-generated by .github/workflows/openwop-post-publish-bump.yml after
          @openwop/openwop@${SDK_VERSION} published successfully via
          openwop-publish.yml.

          Backend was at ${BACKEND_FROM}; frontend at ${FRONTEND_FROM}. Both
          lockfiles now resolve to ${SDK_VERSION}.

          Merge before the next demo deploy; the backend Cloud Run image won't
          pick up the new SDK until \`gcloud run deploy openwop-app-backend
          --source apps/workflow-engine\` (or the equivalent firebase deploy
          for the frontend) runs against this branch.

          Co-Authored-By: openwop-bot <noreply@openwop.dev>
          EOF

          git commit -s -F /tmp/commit-msg.txt
          git push -u origin "$BRANCH"

          # PR body via temp file — same indentation-pitfall avoidance.
          cat > /tmp/pr-body.md <<EOF
          Auto-opened after \`@openwop/openwop@${SDK_VERSION}\` published successfully via \`.github/workflows/openwop-publish.yml\`.

          ## Bumps
          - \`apps/workflow-engine/backend/typescript\` (backend Cloud Run image): \`${BACKEND_FROM}\` → \`${SDK_VERSION}\`
          - \`apps/workflow-engine/frontend/react\` (frontend Firebase Hosting bundle): \`${FRONTEND_FROM}\` → \`${SDK_VERSION}\`

          ## Why this exists
          Cloud Run's \`npm ci\` runs in isolation; without an updated lockfile, the backend container resolves the old SDK version even though npm has a newer one. Every prior SDK release required a manual bump before deploys could pull the new code. This PR closes that loop automatically.

          ## To merge + deploy
          1. Review the lockfile diff (mostly mechanical version-string changes).
          2. Merge to main.
          3. Run \`gcloud run deploy openwop-app-backend --source apps/workflow-engine --region us-central1 --project openwop-dev\` (or \`firebase deploy --only hosting:app --project openwop-dev\` for the frontend) to pick up the new SDK in production.

          Generated by \`.github/workflows/openwop-post-publish-bump.yml\`.
          EOF

          gh pr create \
            --base main \
            --head "$BRANCH" \
            --title "chore: bump @openwop/openwop to ^${SDK_VERSION} (post-publish)" \
            --body-file /tmp/pr-body.md \
            --label "chore" \
            --label "post-publish-bump"
