# Readable text for the description / summary / title strings that api/v2/openapi.yaml,
# api/v2/asyncapi.yaml and api/seams-v2.yaml inherit from the frozen v1 documents
# (api/openapi.yaml, api/asyncapi.yaml). scripts/derive-v2-api.py applies it to the
# derived documents; the v1 documents are never edited.
#
# Each row replaces every inherited string equal to `was` (as it reads in the generated
# v2 file) with `now`. A row may also carry `description`: used only on a `summary` row,
# it moves a paragraph-long summary into the operation's description, which must be absent.
# Text only: a row never changes a schema, a path, a parameter, a status code or a header.
# derive-v2-api.py fails when a row matches nothing, so a stale row cannot linger.
