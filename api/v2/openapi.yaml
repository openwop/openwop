  /prompts:render:
    post:
      tags:
      - prompts
      summary: Render a prompt template with supplied variable bindings.
      description: Returns the composed body, its sha256 hash, and per-variable hashes. Does not dispatch an LLM call. The
        response's `hash` MUST equal the `hash` a matching `prompt.composed` event would carry at dispatch time for the same
        `(ref, variables, contentTrust)` inputs, so rendering is deterministic and replay-safe. Secret-source variable values
        MUST be supplied as `[REDACTED:<credentialRef>]` markers; the host resolves the plaintext internally and never echoes
        it in the `composed` response field (SR-1).
      operationId: renderPromptTemplate
      security:
      - ApiKeyAuth:
        - prompts:read
      - OAuth2:
        - prompts:read
      - OpenIdConnect:
        - prompts:read
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - ref
              - variables
              properties:
                ref:
                  $ref: ../../schemas/v2/prompt-ref.schema.json
                variables:
                  type: object
                  description: Variable bindings keyed by `PromptVariable.name`. Secret-source bindings carry `[REDACTED:<credentialRef>]`
                    markers; the host resolves the real value internally.
                  additionalProperties: true
                contentTrust:
                  type: string
                  enum:
                  - trusted
                  - untrusted
                  description: Aggregate trust marker for the supplied bindings, propagated through composition.
      responses:
        '200':
          description: Composed result.
          content:
            application/json:
              schema:
                type: object
                required:
                - hash
                - refs
                - variableHashes
                properties:
                  composed:
                    type: string
                    description: Full composed body. Present only when observability is `full`.
                  hash:
                    type: string
                    pattern: ^sha256:[0-9a-f]{64}$
                  refs:
                    type: array
                    items:
                      type: string
                  variableHashes:
                    type: object
                    additionalProperties:
                      type: string
                      pattern: ^sha256:[0-9a-f]{64}$
                  contentTrust:
                    type: string
                    enum:
                    - trusted
                    - untrusted
          headers:
            OpenWOP-Version:
              $ref: '#/components/headers/OpenWOPVersion'
        '400':
          description: '`validation_error`: a required variable is missing, a bound type differs from its declared type, or
            the PromptRef is malformed.'
          content:
            application/json:
              schema:
                $ref: ../../schemas/v2/error-envelope.schema.json
          headers:
            OpenWOP-Version:
              $ref: '#/components/headers/OpenWOPVersion'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Referenced template does not exist.
          content:
            application/json:
              schema:
                $ref: ../../schemas/v2/error-envelope.schema.json
          headers:
            OpenWOP-Version:
              $ref: '#/components/headers/OpenWOPVersion'
      parameters:
      - $ref: '#/components/parameters/OpenWOPVersion'
      - $ref: '#/components/parameters/OpenWOPClientVersion'
