          $ref: ../../schemas/v2/ids.schema.json#/$defs/subscriptionId
        description: 'Tenant-bound `<tenantId>/<opaque>` (`identity.md` §5), carried as one path segment: `~`-projected or
          percent-encoded.'
      - $ref: '#/components/parameters/OpenWOPVersion'
      - $ref: '#/components/parameters/OpenWOPClientVersion'
      responses:
        '204':
          description: Unregistered.
          headers:
            OpenWOP-Version:
              $ref: '#/components/headers/OpenWOPVersion'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /webhooks/{webhookId}/rotate-secret:
    post:
      tags:
      - webhooks
      operationId: rotateWebhookSecret
      summary: Rotate a Standard Webhooks subscription's secret with an overlap
      description: 'Rotates the secret of a subscription that opted into `standard-webhooks-1`. Gated on `webhooks.secretRotation`:
        a host that does not advertise it MUST answer `404 not_found`. Any other subscription gets `400 validation_error`,
        because its single `v1` signature cannot overlap. Tenant checks are those of `unregisterWebhook`: `403 id_tenant_mismatch`
        when the id''s tenant segment is not the caller''s, checked before the lookup (`identity.md` §5); `404` when unknown.


        For `overlapSeconds` after `rotatedAt`, `webhook-signature` carries one entry under the new secret and one under the
        previous one, and `OpenWOP-Signature` stays on the previous secret. At `previousSecretExpiresAt` only the new secret
        signs. A second rotation inside an overlap retires the oldest secret immediately. Rotation does not re-verify the
        endpoint. The response carries no secret.'
      parameters:
      - name: webhookId
        in: path
        required: true
        schema:
          $ref: ../../schemas/v2/ids.schema.json#/$defs/subscriptionId
        description: 'Tenant-bound `<tenantId>/<opaque>` (`identity.md` §5), carried as one path segment: `~`-projected or
          percent-encoded.'
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/OpenWOPVersion'
      - $ref: '#/components/parameters/OpenWOPClientVersion'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - secret
              additionalProperties: false
              properties:
                secret:
                  type: string
                  pattern: ^whsec_[A-Za-z0-9+/]+={0,2}$
                  description: 'The new secret: `whsec_<base64>`, decoding to 24–64 bytes.'
      responses:
        '200':
          description: Rotated. No secret is returned.
          content:
            application/json:
              schema:
                type: object
                required:
                - rotatedAt
                - previousSecretExpiresAt
                additionalProperties: false
                properties:
                  rotatedAt:
                    type: string
                    format: date-time
                  previousSecretExpiresAt:
                    type: string
                    format: date-time
                    description: '`rotatedAt + overlapSeconds`.'
          headers:
            OpenWOP-Version:
              $ref: '#/components/headers/OpenWOPVersion'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
      security:
      - ApiKeyAuth:
        - webhooks:manage
      - OAuth2:
        - webhooks:manage
      - OpenIdConnect:
        - webhooks:manage
  /audit/verify:
    get:
      tags:
      - audit
      summary: Verify the audit-log hash chain over [fromSeq, toSeq].
      description: Re-walks the audit-log entries in the requested range, recomputes each entry's `prevHash` from the canonical
        RFC 8785 JCS serialization of the prior entry, verifies signed checkpoints against the host's advertised `auditLogIntegrity.checkpointPublicKey`,
        and returns `chainValid` with any anomalies. Hosts MUST require the `audit:read` scope. Served by a host that advertises
        the `auditLogIntegrity` family, which MUST list every checkpoint whose `atSequence` is in the range, ascending; a
        host that does not advertise it MAY omit this endpoint entirely, and clients SHOULD check `/.well-known/openwop` first.
        See `spec/v2/core/security-defaults.md` §Audit-log integrity.
      operationId: verifyAuditLog
      security:
      - ApiKeyAuth:
        - audit:read
      - OAuth2:
        - audit:read
      - OpenIdConnect:
        - audit:read
      parameters:
      - in: query
        name: fromSeq
        required: true
        schema:
          type: integer
          minimum: 0
        description: First audit-log sequence to include (inclusive).
      - in: query
        name: toSeq
        required: true
        schema:
          type: integer
          minimum: 0
        description: Last audit-log sequence to include (inclusive). MUST be >= fromSeq.
      - $ref: '#/components/parameters/OpenWOPVersion'
      - $ref: '#/components/parameters/OpenWOPClientVersion'
      responses:
        '200':
          description: Verification result.
          content:
            application/json:
              schema:
                $ref: ../../schemas/v2/audit-verify-result.schema.json
          headers:
            OpenWOP-Version:
              $ref: '#/components/headers/OpenWOPVersion'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Host does not advertise the audit-log-integrity profile.
          content:
            application/json:
              schema:
                $ref: ../../schemas/v2/error-envelope.schema.json
          headers:
            OpenWOP-Version:
              $ref: '#/components/headers/OpenWOPVersion'
