  /webhooks/{webhookId}/dead-letters:
    get:
      tags:
      - webhooks
      operationId: listWebhookDeadLetters
      summary: List a subscription's dead-lettered deliveries
      description: 'Lists deliveries that were dead-lettered, making `webhooks.md` §Durability observable. A delivery whose
        retries are exhausted, or a `payload_unprojectable` delivery dead-lettered on its first attempt, appears here until
        `retentionDays` elapse. Gated on the `webhooks.deadLetter` facet: a host that does not advertise it answers `404 not_found`.


        The record is content-free: it names a delivery and never carries the delivered bytes, the request headers, or the
        subscription secret.'
      parameters:
      - name: webhookId
        in: path
        required: true
        schema:
          $ref: ../../schemas/v2/ids.schema.json#/$defs/subscriptionId
        description: 'The subscription, tenant-bound (`identity.md` §5) and carried as one path segment: `~`-projected or
          percent-encoded.'
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
        description: Page size; clamped to `webhooks.deadLetter.maxPageSize`.
      - name: cursor
        in: query
        required: false
        schema:
          type: string
          minLength: 1
          maxLength: 2048
        description: Opaque cursor from a previous page's `nextCursor`. A cursor minted for another subscription MUST be refused
          `400 validation_error`.
      - $ref: '#/components/parameters/OpenWOPVersion'
      - $ref: '#/components/parameters/OpenWOPClientVersion'
      responses:
        '200':
          description: One page of dead-lettered deliveries, newest first.
          content:
            application/json:
              schema:
                $ref: ../../schemas/v2/webhook-dead-letter-page.schema.json
          headers:
            OpenWOP-Version:
              $ref: '#/components/headers/OpenWOPVersion'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
      security:
      - ApiKeyAuth:
        - webhooks:manage
      - OAuth2:
        - webhooks:manage
      - OpenIdConnect:
        - webhooks:manage
  /host/events:
    get:
      tags:
      - host
      operationId: streamHostEvents
      summary: Stream host-scoped events (`heartbeat.*`) as SSE
      description: The default `hostEvents` address; a host MAY declare another under `heartbeat.deliveryChannel`. Carries
        no run data.
      responses:
        '200':
          description: '`text/event-stream` of `hostEvents` messages.'
          content:
            text/event-stream:
              schema:
                type: string
          headers:
            OpenWOP-Version:
              $ref: '#/components/headers/OpenWOPVersion'
        '401':
          $ref: '#/components/responses/Unauthenticated'
      parameters:
      - $ref: '#/components/parameters/OpenWOPVersion'
      - $ref: '#/components/parameters/OpenWOPClientVersion'
      security:
      - ApiKeyAuth:
        - runs:read
      - OAuth2:
        - runs:read
      - OpenIdConnect:
        - runs:read
components:
  securitySchemes:
    ApiKeyAuth:
      type: http
      scheme: bearer
      bearerFormat: API key
      description: OpenWOP API key. The format is implementation-defined; the reference implementation uses `hk_`/`hk_test_`
        prefixes. Each key carries one or more scopes from the canonical vocabulary (`manifest:read`, `runs:create`, `runs:read`,
        `runs:cancel`, `artifacts:read`, `webhooks:manage`, `approvals:respond`, `audit:read`). Scope matching is in `spec/v2/core/identity.md`
        §2.1.
    OAuth2:
      type: oauth2
      description: 'The OAuth 2.0 lane (`auth.lanes[].lane: "oauth2"`). Discovery is RFC 9728 Protected Resource Metadata
        at the path-inserted well-known URI (`identity.md` §2.5). The URLs are placeholders.'
      flows:
        clientCredentials:
          tokenUrl: https://issuer.example/oauth2/token
          scopes:
            manifest:read: Read workflow / canvas-type / endpoint manifests
            runs:create: Create new runs
            runs:read: Read run state and event stream
            runs:cancel: Cancel an in-flight run
            runs:annotate: Record a quality annotation on a run
            artifacts:read: Read artifacts produced by runs
            webhooks:manage: Register/unregister webhook subscriptions
            approvals:respond: Respond to HITL approval gates
            packs:publish: Publish node-pack versions
            packs:read: Fetch a published node-pack tarball or signature
            packs:yank: Yank a node-pack version
            packs:yank-revert: Reinstate a yanked node-pack version
            audit:read: Verify audit-log integrity
            workspace:read: Read agent-workspace files
            workspace:write: Write agent-workspace files
            prompts:read: Read and render prompt templates
            prompts:write: Create, update and delete prompt templates
            content:read: Read authored content pages and locale settings
            content:write: Create, publish and translate authored content pages
            deploy:*: Drive an agent deployment state transition
        authorizationCode:
          authorizationUrl: https://issuer.example/oauth2/authorize
          tokenUrl: https://issuer.example/oauth2/token
          scopes:
            manifest:read: Read workflow / canvas-type / endpoint manifests
            runs:create: Create new runs
            runs:read: Read run state and event stream
            runs:cancel: Cancel an in-flight run
            runs:annotate: Record a quality annotation on a run
            artifacts:read: Read artifacts produced by runs
            webhooks:manage: Register/unregister webhook subscriptions
            approvals:respond: Respond to HITL approval gates
            packs:publish: Publish node-pack versions
            packs:read: Fetch a published node-pack tarball or signature
            packs:yank: Yank a node-pack version
            packs:yank-revert: Reinstate a yanked node-pack version
            audit:read: Verify audit-log integrity
            workspace:read: Read agent-workspace files
            workspace:write: Write agent-workspace files
            prompts:read: Read and render prompt templates
            prompts:write: Create, update and delete prompt templates
            content:read: Read authored content pages and locale settings
            content:write: Create, publish and translate authored content pages
            deploy:*: Drive an agent deployment state transition
    OpenIdConnect:
      type: openIdConnect
      openIdConnectUrl: https://issuer.example/.well-known/openid-configuration
      description: 'The OpenID Connect lane (`auth.lanes[].lane: "oidc"`). An ID token MAY be the bearer only when its `aud`
        equals the host''s configured audience (`identity.md` §2.1); any other `aud` is `audience_mismatch`. The URL is a
        placeholder.'
    MutualTLS:
      type: mutualTLS
      description: 'The mTLS lane (`auth.lanes[].lane: "mtls"`). mTLS is required *in addition to* a bearer, never instead
        of one, so it appears in no canonical requirement below. A host that requires it adds `MutualTLS: []` inside each
        requirement object (AND).'
  parameters:
    WorkflowId:
      in: path
      name: workflowId
      required: true
      schema:
        $ref: ../../schemas/v2/ids.schema.json#/$defs/workflowId
    RunId:
      in: path
      name: runId
      required: true
      schema:
        $ref: ../../schemas/v2/ids.schema.json#/$defs/runId
      description: Tenant-bound `<tenantId>/<opaque>` (`identity.md` §5). The `/` is part of the identifier and MUST be percent-encoded
        as `%2F` in the path segment.
    IdempotencyKey:
      in: header
      name: Idempotency-Key
      required: false
      schema:
        type: string
        maxLength: 255
      description: 'Per-mutation idempotency token (`idempotency.md` Layer 1). The server caches `(tenantId, endpoint, key)`
        → response for ≥24h. A duplicate request returns the cached response with `OpenWOP-Idempotent-Replay: true`.'
    OpenWOPVersion:
      name: OpenWOP-Version
      in: header
      required: false
      schema:
        type: string
        pattern: ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$
      description: Selects one of the host's listed major.minor versions. Absent, `/.well-known/openwop` uses `preferredVersion`
        and every other unversioned path is v2; an unlisted value is 406 protocol_version_unsupported.
    OpenWOPClientVersion:
      name: OpenWOP-Client-Version
      in: header
      required: false
      schema:
        type: string
      description: The protocol version the client implements (versioning.md §1.5). Compared with `minClientVersion` on major.minor.
        A malformed value is treated as absent and MUST NOT produce a 400. Never selects a contract.
  responses:
    Unauthenticated:
      description: Missing or invalid credential.
      headers:
        WWW-Authenticate:
          description: A `Bearer` challenge. On a host with an oauth2 or oidc lane it carries `resource_metadata` and `error="invalid_token"`.
            Never sent on a non-disclosure 404.
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: Credential valid but lacks required scope or fails resource binding.
      headers:
        WWW-Authenticate:
          description: On a scope refusal, `error="insufficient_scope"` with every required `scope`. Absent on a resource-binding
            403.
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Resource doesn't exist or caller can't see it (do not leak existence).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ValidationError:
      description: Request body or parameters malformed.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    RateLimited:
      description: Too many requests.
      headers:
        Retry-After:
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    Error:
      $ref: ../../schemas/v2/error-envelope.schema.json
    Capabilities:
      $ref: ../../schemas/v2/capabilities.schema.json
    RunSnapshot:
      $ref: ../../schemas/v2/run-snapshot.schema.json
    RunClaimConflict:
      $ref: ../../schemas/v2/error-envelope.schema.json
      description: '`RunClaimConflict` is the canonical error envelope; `error` carries the code.'
    UnsupportedStreamMode:
      $ref: ../../schemas/v2/error-envelope.schema.json
      description: '`UnsupportedStreamMode` is the canonical error envelope; `error` carries the code.'
  headers:
    OpenWOPVersion:
      schema:
        type: string
      description: The contract that produced this response. It MUST equal the one used.
      required: true
