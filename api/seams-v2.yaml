openapi: 3.1.0
info:
  title: OpenWOP conformance seams profile (openwop-conformance-seams-v2)
  version: 2.42.7
  description: 'The OpenWOP conformance seams profile (`openwop-conformance-seams-v2`): test-only operations in their own
    path space, `/conformance/seams/…`. The profile is versioned and validated against the canonical v2 schemas with no tolerance
    path. It is not a capability: a host advertises the profile, never a `testSeams` flag.


    Generated from `api/openapi.yaml` by `scripts/derive-v2-api.py`; do not edit.'
servers:
- url: https://{host}
  description: An OpenWOP server.
  variables:
    host:
      default: api.example.com
      description: Replace with your server's hostname.
paths:
  /conformance/seams/sample/a2a/tasks/{taskId}:
    get:
      tags:
      - host
      summary: Read the persisted durable A2A task projection (host extension).
      description: 'Returns the persisted `A2ATaskState` for `taskId` (equal to the backing `runId`): a host-extension convenience
        read of the durable projection, which survives caller disconnect. The normative A2A read surface remains the A2A `tasks/get`
        JSON-RPC method. Hosts that do not advertise `capabilities.a2a.durableTasks` return `501`.'
      operationId: getA2ATaskState
      security:
      - ApiKeyAuth:
        - runs:read
      - OAuth2:
        - runs:read
      - OpenIdConnect:
        - runs:read
      parameters:
      - name: taskId
        in: path
        required: true
        schema:
          type: string
          minLength: 1
        description: The A2A Task.id (equals the backing OpenWOP runId).
      responses:
        '200':
          description: The persisted durable A2A task projection.
          content:
            application/json:
              schema:
                $ref: ../schemas/v2/a2a-task-state.schema.json
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '501':
          description: Host does not advertise `capabilities.a2a.durableTasks`.
          content:
            application/json:
              schema:
                $ref: ../schemas/v2/error-envelope.schema.json
  /conformance/seams/workspace/files:
    get:
      tags:
      - host
      summary: List workspace file metadata for the caller's tenant·workspace.
      description: Returns file metadata, without bodies, for the caller's `{tenant, workspace}`. An optional `?prefix=` filters
        the flat `path` namespace to entries starting with that prefix.
      operationId: listWorkspaceFiles
      security:
      - ApiKeyAuth:
        - workspace:read
      - OAuth2:
        - workspace:read
      - OpenIdConnect:
        - workspace:read
      parameters:
      - $ref: '#/components/parameters/WorkspacePrefix'
      responses:
        '200':
          description: Workspace file metadata (tenant·workspace-scoped; bodies omitted).
          content:
            application/json:
              schema:
                type: object
                required:
                - files
                properties:
                  files:
                    type: array
                    items:
                      $ref: ../schemas/v2/workspace-file.schema.json
                additionalProperties: false
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '501':
          description: Host does not advertise `capabilities.workspace.supported`.
          content:
            application/json:
              schema:
                $ref: ../schemas/v2/error-envelope.schema.json
  /conformance/seams/workspace/files/{path}:
    get:
      tags:
      - host
      summary: Read one workspace file.
      description: 'Returns the `WorkspaceFile` at `path` for the caller''s `{tenant, workspace}`. When `capabilities.workspace.versioned:
        true`, an optional `?version=N` returns the historical snapshot at version N.'
      operationId: getWorkspaceFile
      security:
      - ApiKeyAuth:
        - workspace:read
      - OAuth2:
        - workspace:read
      - OpenIdConnect:
        - workspace:read
      parameters:
      - $ref: '#/components/parameters/WorkspacePath'
      - $ref: '#/components/parameters/WorkspaceVersion'
      responses:
        '200':
          description: The workspace file (current version, or `?version=N` when versioned).
          content:
            application/json:
              schema:
                $ref: ../schemas/v2/workspace-file.schema.json
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '501':
          description: Host does not advertise `capabilities.workspace.supported`.
          content:
            application/json:
              schema:
                $ref: ../schemas/v2/error-envelope.schema.json
    put:
      tags:
      - host
      summary: Atomically create or replace a workspace file.
      description: 'Atomically creates or replaces the file at `path`. MUST honor `If-Match: <etag>`: a stale token returns
        `409 workspace_conflict`, with `details.currentVersion` carrying the live version. On success the host bumps `version`,
        recomputes `etag`, and emits a `workspace.updated` event. A `content` exceeding `capabilities.workspace.maxFileBytes`
        returns `workspace_too_large`.'
      operationId: putWorkspaceFile
      security:
      - ApiKeyAuth:
        - workspace:write
      - OAuth2:
        - workspace:write
      - OpenIdConnect:
        - workspace:write
      parameters:
      - $ref: '#/components/parameters/WorkspacePath'
      - $ref: '#/components/parameters/IfMatch'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../schemas/v2/workspace-file-create.schema.json
      responses:
        '200':
          description: File created or replaced. Returns the persisted WorkspaceFile.
          content:
            application/json:
              schema:
                $ref: ../schemas/v2/workspace-file.schema.json
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: Stale `If-Match` — the file changed since the supplied etag (`workspace_conflict`).
          content:
            application/json:
              schema:
                $ref: ../schemas/v2/error-envelope.schema.json
        '413':
          description: Content exceeds `capabilities.workspace.maxFileBytes` (`workspace_too_large`).
          content:
            application/json:
              schema:
                $ref: ../schemas/v2/error-envelope.schema.json
        '501':
          description: Host does not advertise `capabilities.workspace.supported`.
          content:
            application/json:
              schema:
                $ref: ../schemas/v2/error-envelope.schema.json
    delete:
      tags:
      - host
      summary: Delete a workspace file.
      description: 'Removes the file at `path` (and, when `versioned: true`, writes a tombstone). Emits a `workspace.updated`
        event on success.'
      operationId: deleteWorkspaceFile
      security:
      - ApiKeyAuth:
        - workspace:write
      - OAuth2:
        - workspace:write
      - OpenIdConnect:
        - workspace:write
      parameters:
      - $ref: '#/components/parameters/WorkspacePath'
      - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '204':
          description: File deleted.
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '501':
          description: Host does not advertise `capabilities.workspace.supported`.
          content:
            application/json:
              schema:
                $ref: ../schemas/v2/error-envelope.schema.json
  /conformance/seams/packs-test/{name}/-/{version}.tgz:
    parameters:
    - $ref: '#/components/parameters/PackName'
    - $ref: '#/components/parameters/PackVersion'
    put:
      tags:
      - packs-test
      summary: Publish a pack tarball to the isolated test catalog.
      description: 'Mirrors the registry''s `PUT /v1/packs/{name}/-/{version}.tgz` (`spec/v1/node-packs.md`). The request
        shape, response shape, status codes, and publish error catalog MUST be served verbatim: `invalid_pack_scope`, `invalid_pack_name`,
        `invalid_version`, `invalid_body`, eight `tarball_*` codes, `invalid_manifest`, `manifest_mismatch` (or the granular
        `manifest_name_mismatch` / `manifest_version_mismatch` pair), `pack_integrity_failure`, `unsupported_runtime`, `forbidden`,
        `conflict`/`version_conflict`.


        The test catalog MUST be isolated: a pack PUT here MUST NOT appear in `GET /v1/packs/{name}` listings. The mirrored
        production path is registry-service surface (`registry-operations.md`), not defined in this document.'
      operationId: putTestPackTarball
      security:
      - ApiKeyAuth:
        - packs:publish
      - OAuth2:
        - packs:publish
      - OpenIdConnect:
        - packs:publish
      parameters:
      - in: header
        name: OpenWOP-Pack-Signing-Method
        required: false
        schema:
          type: string
          enum:
          - sigstore
          - manual
          - none
      - in: header
        name: OpenWOP-Pack-Sha256
        required: false
        schema:
          type: string
          pattern: ^sha256-[A-Za-z0-9+/=]+$
        description: Caller-asserted SHA-256 (server verifies; mismatch surfaces `pack_integrity_failure`).
      requestBody:
        required: true
        description: Gzipped tarball bytes (`application/tar+gzip`, `application/gzip`, `application/x-gzip`, or `application/octet-stream`).
        content:
          application/gzip:
            schema:
              type: string
              format: binary
          application/x-gzip:
            schema:
              type: string
              format: binary
          application/tar+gzip:
            schema:
              type: string
              format: binary
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        '200':
          description: Idempotent re-publish — identical sha256 content already published; existing record returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TestPackPublishRecord'
        '201':
          description: New version published to the test catalog.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TestPackPublishRecord'
        '400':
          description: 'One of the documented 400-class publish error codes: URL or scope (`invalid_pack_scope`, `invalid_pack_name`,
            `invalid_version`), body shape (`invalid_body`), tarball extraction (`tarball_gunzip_failed`, `tarball_too_large`,
            `tarball_manifest_missing`, `tarball_manifest_too_large`, `tarball_manifest_not_json`, `tarball_entry_missing`,
            `tarball_entry_too_large`, `tarball_path_traversal`, `tarball_tar_parse_failed`), or manifest contents (`invalid_manifest`,
            `manifest_mismatch` or the granular `manifest_name_mismatch` / `manifest_version_mismatch` pair, `pack_integrity_failure`,
            `unsupported_runtime`).'
          content:
            application/json:
              schema:
                $ref: ../schemas/v2/error-envelope.schema.json
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          description: '`forbidden` — caller lacks `packs:publish` scope or the namespace claim.'
          content:
            application/json:
              schema:
                $ref: ../schemas/v2/error-envelope.schema.json
        '404':
          description: 'Host does not advertise `capabilities.packs.testMode.supported: true`, or the test-mode env-gate is
            unset.'
          content:
            application/json:
              schema:
                $ref: ../schemas/v2/error-envelope.schema.json
        '409':
          description: '`conflict` (or `version_conflict`) — `(name, version)` already published with different content.'
          content:
            application/json:
              schema:
                $ref: ../schemas/v2/error-envelope.schema.json
    get:
      tags:
      - packs-test
      summary: Fetch a published test-catalog tarball.
      description: 'Mirrors the registry''s `GET /v1/packs/{name}/-/{version}.tgz`. Returns the gzipped tarball bytes with
        `Content-Type: application/tar+gzip` and an `ETag: "sha256-..."` matching the manifest''s `tarballSha256`. The mirrored
        production path is registry-service surface (`registry-operations.md`), not defined in this document.'
      operationId: getTestPackTarball
      security:
      - ApiKeyAuth:
        - packs:read
      - OAuth2:
        - packs:read
      - OpenIdConnect:
        - packs:read
      responses:
        '200':
          description: Tarball bytes.
          content:
            application/tar+gzip:
              schema:
                type: string
                format: binary
        '400':
          description: '`invalid_pack_name` or `invalid_version` — URL params malformed.'
          content:
            application/json:
              schema:
                $ref: ../schemas/v2/error-envelope.schema.json
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          description: '`forbidden` — caller lacks `packs:read` scope.'
          content:
            application/json:
              schema:
                $ref: ../schemas/v2/error-envelope.schema.json
        '404':
          description: 'Pack version not found in the test catalog (or host does not advertise `capabilities.packs.testMode.supported:
            true`).'
          content:
            application/json:
              schema:
                $ref: ../schemas/v2/error-envelope.schema.json
  /conformance/seams/packs-test/{name}/-/{version}:
    parameters:
    - $ref: '#/components/parameters/PackName'
    - $ref: '#/components/parameters/PackVersion'
    delete:
      tags:
      - packs-test
      summary: Unpublish a test-catalog version (same unpublish-window semantics as the registry).
      description: Mirrors the registry's `DELETE /v1/packs/{name}/-/{version}` (`spec/v1/node-packs.md`). Returns `400 unpublish_window_expired`
        for versions older than the registry's unpublish window (default 72h). Test-mode implementations MAY shorten the window
        for tractable conformance fixtures but MUST surface the same error code. The mirrored production path is registry-service
        surface (`registry-operations.md`), not defined in this document.
      operationId: deleteTestPackVersion
      security:
      - ApiKeyAuth:
        - packs:publish
      - OAuth2:
        - packs:publish
      - OpenIdConnect:
        - packs:publish
      responses:
        '204':
          description: Version successfully unpublished from the test catalog.
        '400':
          description: '`unpublish_window_expired`, `invalid_pack_name`, or `invalid_version`.'
          content:
            application/json:
              schema:
                $ref: ../schemas/v2/error-envelope.schema.json
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          description: '`forbidden` — caller lacks `packs:publish` scope.'
          content:
            application/json:
              schema:
                $ref: ../schemas/v2/error-envelope.schema.json
        '404':
          description: Version doesn't exist in the test catalog, or host does not advertise the test-mode capability.
          content:
            application/json:
              schema:
                $ref: ../schemas/v2/error-envelope.schema.json
  /conformance/seams/packs-test/{name}/-/{version}.sig:
    parameters:
    - $ref: '#/components/parameters/PackName'
    - $ref: '#/components/parameters/PackVersion'
    get:
      tags:
      - packs-test
      summary: Fetch the detached Ed25519 signature for a test-catalog pack.
      description: Mirrors the registry's `GET /v1/packs/{name}/-/{version}.sig`. Returns the signature blob over `pack.json`
        for this version. MAY 302-redirect to a storage-backend signed URL. The mirrored production path is registry-service
        surface (`registry-operations.md`), not defined in this document.
      operationId: getTestPackSignature
      security:
      - ApiKeyAuth:
        - packs:read
      - OAuth2:
        - packs:read
      - OpenIdConnect:
        - packs:read
      responses:
        '200':
          description: Signature blob.
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '302':
          description: Redirect to a storage-backend signed URL (clients SHOULD follow).
          headers:
            Location:
              schema:
                type: string
                format: uri
        '400':
          description: '`invalid_pack_name` or `invalid_version` — URL params malformed.'
          content:
            application/json:
              schema:
                $ref: ../schemas/v2/error-envelope.schema.json
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          description: '`forbidden` — caller lacks `packs:read` scope.'
          content:
            application/json:
              schema:
                $ref: ../schemas/v2/error-envelope.schema.json
        '404':
          description: '`signature_not_available`: the version is missing, yanked, or unsigned at publish time, or the registry''s
            storage backend is unwired. The four cases are intentionally indistinguishable (spec/v1/node-packs.md). Also returned
            when the host does not advertise `capabilities.packs.testMode.supported: true`.'
          content:
            application/json:
              schema:
                $ref: ../schemas/v2/error-envelope.schema.json
  /conformance/seams/sample/event-log/seed:
    post:
      tags:
      - Seams
      operationId: seedEra2EventLog
      summary: Persist a run whose event log uses v1 vocabulary (era 2)
      description: 'Seeds a run whose stored event log is in v1 vocabulary. The host MUST persist the rows verbatim: v1 `type`
        strings, the given `sequence` space, and no era stamp, so the run reads as era `2` by the absent-⇒-`2` rule of persistence.md.
        The host MUST NOT translate at write time. The scenarios `v2-v1-events-translated`, `v2-unmapped-type-refused`, `v2-fork-a-v1-run`
        and `v2-pinned-run-disposition` witness the read projection. `status` is the snapshot status the seeded run holds.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
              - eventLogSchemaVersion
              - status
              - events
              properties:
                eventLogSchemaVersion:
                  const: 2
                status:
                  type: string
                  enum:
                  - running
                  - completed
                  - failed
                  - cancelled
                events:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    additionalProperties: false
                    required:
                    - type
                    - sequence
                    - payload
                    properties:
                      type:
                        type: string
                      sequence:
                        type: integer
                        minimum: 0
                      payload:
                        type: object
                      timestamp:
                        type: string
                        format: date-time
                      causationId:
                        type: string
      responses:
        '201':
          description: The seeded run.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                - runId
                properties:
                  runId:
                    $ref: ../schemas/v2/ids.schema.json#/$defs/runId
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthenticated'
  /conformance/seams/sample/event-log/append:
    post:
      tags:
      - Seams
      operationId: appendEra2Event
      summary: Append a v2-named event to a seeded era-2 run through the host's production writer
      description: 'The host MUST append the event through the same writer its own code uses for that run (the storage boundary
        that applies the writer rule, persistence.md §The writer rule) and MUST NOT branch on the seam. An era-2 run stores
        the event under its v1 spelling (the codemap''s v1 side), so the production read returns the v2 `type` given here.


        The seam MUST refuse a `runId` that `seedEra2EventLog` did not create with `404`, exactly as for an unknown run, so
        it cannot inject into a real run. A terminal run answers `409 run_terminal`; a `type` that is not a v2 registry name
        answers `400`. Used by `v2-era-2-append-vocabulary`.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
              - runId
              - type
              - payload
              properties:
                runId:
                  $ref: ../schemas/v2/ids.schema.json#/$defs/runId
                type:
                  type: string
                  description: A v2 event type name (schemas/v2/run-event.schema.json `type` enum).
                payload:
                  type: object
      responses:
        '202':
          description: The event was appended.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                - runId
                - sequence
                properties:
                  runId:
                    $ref: ../schemas/v2/ids.schema.json#/$defs/runId
                  sequence:
                    type: integer
                    minimum: 0
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: The run is terminal (`run_terminal`).
  /conformance/seams/sample/effect-seams/fire:
    post:
      tags:
      - Seams
      operationId: fireEffectSeam
      summary: Fire one named effect seam inside a run
      description: 'The host runs a workflow that drives the named seam once. The scenario then forks the run in `replay`
        mode and reads `GET /runs/{runId}/effects` on the fork. A guarded seam MUST NOT produce a new effect attempt there:
        replay suppression is unconditional (`replay.md` §Suppression rule 1) and does not depend on `branchReFires`, which
        states only what a `branch` re-fires by design (§Branch: a host "MUST NOT report that as replay suppression"). The
        witness is the host''s own Layer-2 ledger, so the leg needs no externally reachable receiver.


        The scenario fires the first `GET /host/effect-seams` row with `guarded: true`, not every row. When no row is guarded
        it records `inapplicable` without calling this operation.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
              - seam
              properties:
                seam:
                  type: string
                  minLength: 1
                  description: The `seam` value of a row in `GET /host/effect-seams`.
                receiverUrl:
                  type: string
                  format: uri
                  description: Optional destination, for seams whose kind needs one. Omitted, the host uses its own unreachable
                    fixture destination; the witness is the effect ledger, not delivery.
      responses:
        '201':
          description: The run that fired the seam.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                - runId
                properties:
                  runId:
                    $ref: ../schemas/v2/ids.schema.json#/$defs/runId
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
  /conformance/seams/sample/test/idempotency/effect-retry:
    post:
      tags:
      - Seams
      operationId: forceEffectTransportRetry
      summary: Drive one effect through the suite's fixture provider with a forced transport retry
      description: The host issues one outbound effect to `providerUrl` and retries it at the transport layer. The fixture
        provider records the idempotency key of each attempt. A Layer-2 host MUST present the same business-identity key on
        both attempts; a provider that sees a changed key fails the leg.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
              - providerUrl
              properties:
                providerUrl:
                  type: string
                  format: uri
                  description: The suite's fixture provider; it records each attempt's idempotency key.
      responses:
        '201':
          description: The run and effect that were retried.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                - runId
                - effectId
                properties:
                  runId:
                    $ref: ../schemas/v2/ids.schema.json#/$defs/runId
                  effectId:
                    type: string
                    minLength: 1
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthenticated'
  /conformance/seams/sample/test/idempotency/hold:
    post:
      tags:
      - Seams
      operationId: armIdempotencyHold
      summary: Hold the caller's next same-key create in flight
      description: 'Arms a single-use hold: the caller tenant''s next real `POST /runs` carrying `key` as its Idempotency-Key
        keeps its Layer-1 claim in flight for `holdMs` after claiming, then completes normally. The seam MUST NOT answer a
        create or emit a 409: the refusal a concurrent same-key create receives while the claim is held comes from the host''s
        production in-flight branch (idempotency.md §Concurrency). Keyed by (tenant, key); an unarmed key is never delayed.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
              - key
              - holdMs
              properties:
                key:
                  type: string
                  pattern: ^[A-Za-z0-9._~-]{22,128}$
                holdMs:
                  type: integer
                  minimum: 1
                  maximum: 10000
      responses:
        '201':
          description: The hold is armed.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                - key
                - holdMs
                properties:
                  key:
                    type: string
                  holdMs:
                    type: integer
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthenticated'
  /conformance/seams/sample/webhooks/receive:
    post:
      tags:
      - Seams
      operationId: receiveWebhookDelivery
      summary: Run a webhook delivery through the host's inbound receiver
      description: Exercises the host as a webhook subscriber. The host verifies `headers` and `body` with its production
        verifier, using `secret` as the subscription secret, and reports the verdict. A scheme-`v1` delivery carrying only
        `X-openwop-*` headers, signed over `{timestamp}.{rawBody}`, MUST be accepted (`v2-v1-signed-webhook-accepted`); a
        tampered signature MUST be refused.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
              - secret
              - headers
              - body
              properties:
                secret:
                  type: string
                  minLength: 1
                headers:
                  type: object
                  additionalProperties:
                    type: string
                body:
                  type: string
      responses:
        '200':
          description: The verifier verdict.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                - accepted
                properties:
                  accepted:
                    type: boolean
                  reason:
                    type: string
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthenticated'
  /conformance/seams/sample/a2ui/emit-surface:
    post:
      tags:
      - Seams
      operationId: emitA2uiSurface
      summary: Admit one `ui.a2ui-surface` envelope into a run through the production admission path
      description: 'Supplies one `ui.a2ui-surface` envelope for the host to admit. A real one is emitted by a model inside
        a node turn, so the suite cannot choose one from the canonical wire; this seam supplies the envelope only.


        The host MUST admit it through its production envelope-admission path and MUST record it exactly as production would.
        That path covers the envelope-kind catalog (`supportedEnvelopes`, `schemaVersions`, `envelopeStrictness`; events.md
        §"The envelope-kind catalog"), validation against the one per-kind branch the schema version selects (never the `anyOf`
        union), the cross-field rules (every message `surfaceId` equals the payload `surfaceId`; a `createSurface.catalogId`
        equals the payload `catalogId`), the surface-fold guard (spec/v2/ext/a2uiSurface/README.md §"The fold"), trust propagation,
        and SR-1 redaction. It MUST NOT be a mock that records without those rules. `envelope.nodeId`, when present, binds
        the surface to that node, so a surface emitted at a node suspended on an `approval` interrupt is the surface whose
        `resume` action would resolve it (§"Trust": a tainted fold blocks that interrupt).


        Refusals use the canonical error envelope: `422 unknown_schema_version` above the floor, or below it under `strict`;
        `422 envelope_invalid` for a payload that fails its branch, a cross-field rule, or the fold guard; `422 unknown_envelope_kind`
        when the host does not list the kind. `details` SHOULD name the rule. A host that has not wired the seam answers `404`/`405`,
        and the scenario records `inapplicable`.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
              - runId
              - envelope
              properties:
                runId:
                  $ref: ../schemas/v2/ids.schema.json#/$defs/runId
                envelope:
                  $ref: ../schemas/v2/ai-envelope.schema.json
                  description: A complete AI envelope whose `type` is `ui.a2ui-surface`; `schemaVersion` selects the payload
                    branch.
      responses:
        '201':
          description: Admitted and recorded; `sequence` is the run event that records the envelope.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                - sequence
                properties:
                  sequence:
                    type: integer
                    minimum: 0
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          description: Refused by envelope admission (`unknown_schema_version`, `envelope_invalid`, `unknown_envelope_kind`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /conformance/seams/sample/oauth/authorize-start:
    post:
      tags:
      - Seams
      operationId: startOAuthAuthorization
      summary: Begin an authorization-code grant through the production authorization-URL builder
      description: 'Points `provider` at the given endpoints (the suite''s authorization-server double), then begins an authorization-code
        grant for the authenticated caller by calling the host''s production authorization-URL builder, and returns the URL
        a user agent would be redirected to. The provider is a test-only provider definition or, with `connection`, the connection
        pack''s provider registered through the host''s production registration path, which runs discovery and pins its tuple.


        The builder MUST be the one production uses: PKCE S256, a fresh `state` bound to the caller''s Subject and the provider,
        the provider''s fixed redirect URI, `iss` expectations, and `resource` for an MCP reach. A seam that assembles its
        own URL measures a stub, and a bundle citing it MUST say which. The grant completes on the host''s production callback
        route, which the suite calls as the user agent. `redirectUri` is a probe: the host MUST ignore it (the redirect URI
        is fixed per provider, oauth.md rule 5).


        A refused grant (an MCP-reach provider with no `issuer`, `pkce: "unsupported"`, or discovered metadata that disagrees
        with the manifest or the pinned tuple) is `422 connection_auth_metadata_mismatch`, and no authorization URL is issued.
        A host that has not wired the seam answers `404`, and the scenarios record `blocked`.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
              - provider
              properties:
                provider:
                  type: string
                  minLength: 1
                  description: An advertised `oauth.providers[].id`, or the `provider.id` of `connection`.
                authUrl:
                  type: string
                  format: uri
                tokenUrl:
                  type: string
                  format: uri
                issuer:
                  type: string
                  format: uri
                  description: The provider's issuer identifier; absent ⇒ an issuer-less provider (provider-unique redirect
                    URI).
                pkce:
                  type: string
                  enum:
                  - S256
                  - unsupported
                scopes:
                  type: array
                  items:
                    type: string
                    minLength: 1
                connection:
                  $ref: ../schemas/v2/connection-pack-manifest.schema.json
                  description: A connection pack whose provider is reached as an MCP server; registered through the production
                    path.
                redirectUri:
                  type: string
                  description: A probe the host MUST ignore.
      responses:
        '201':
          description: The authorization URL the user agent would be sent to.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                - authorizationUrl
                properties:
                  authorizationUrl:
                    type: string
                    format: uri
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          description: The grant is refused (`connection_auth_metadata_mismatch`, `oauth_provider_unsupported`); no authorization
            URL is issued.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /conformance/seams/sample/oauth/expire-refresh:
    post:
      tags:
      - Seams
      operationId: expireOAuthAccessToken
      summary: Expire the caller's stored access token for a provider so its next use refreshes
      description: 'Marks the access token of the caller''s stored credential for `provider` expired, and nothing else. The
        next node that uses it refreshes through the host''s production refresh path against the provider''s token endpoint
        (the suite''s double, which decides whether the refresh token is still good). A terminal refresh failure then follows
        oauth.md §Token lifecycle: `connector.auth-expired`, and either the node fails `connector_auth_expired` or, under
        `oauth.credentialInterrupt`, it suspends on a `credential` interrupt with `reason: "expired"`. `404` when the caller
        holds no credential for the provider.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
              - provider
              properties:
                provider:
                  type: string
                  minLength: 1
      responses:
        '204':
          description: The access token is expired.
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
  /conformance/seams/sample/auth/credential/mint:
    post:
      tags:
      - Seams
      operationId: mintLaneCredential
      summary: Mint a fresh credential on an advertised lane for the caller's tenant
      description: 'Issues a new credential on `lane` (an advertised `auth.lanes[].lane` whose `revocation` is `next-request`;
        absent ⇒ `api-key`) for the authenticated caller''s tenant, through the host''s production issuance path, so the credential
        it returns authenticates on the canonical API exactly as an ordinary one does. The suite uses it only to hold a credential
        it can then revoke: the revocation, and the refusal on the next request (`401 credential_revoked`), are production
        behaviour the seam does not simulate. A host that has not wired the seam answers `404`, and the scenario records the
        requirement unobserved.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                lane:
                  type: string
                  minLength: 1
                  description: An advertised `auth.lanes[].lane`; absent ⇒ `api-key`.
      responses:
        '201':
          description: The minted credential.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                - lane
                - credential
                properties:
                  lane:
                    type: string
                  credential:
                    type: string
                    minLength: 1
                    description: 'The credential. Presented as `Authorization: Bearer <credential>` unless `presentation`
                      says otherwise.'
                  presentation:
                    type: object
                    additionalProperties: false
                    required:
                    - kind
                    description: 'How the suite presents `credential` on the canonical API. Absent ⇒ bearer. A lane whose
                      production credential is cookie-borne (a `session` lane) answers `{ kind: "cookie", name }`, and the
                      suite sends `Cookie: <name>=<credential>`.'
                    properties:
                      kind:
                        type: string
                        enum:
                        - bearer
                        - cookie
                      name:
                        type: string
                        pattern: ^[!#$%&'*+.^_`|~0-9A-Za-z-]+$
                        description: The cookie name (an RFC 6265 token). Required when `kind` is `cookie`.
                    if:
                      properties:
                        kind:
                          const: cookie
                    then:
                      required:
                      - kind
                      - name
                  subjectId:
                    type: string
                    description: The Subject the credential authenticates as, when the host names one.
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
  /conformance/seams/sample/auth/credential/revoke:
    post:
      tags:
      - Seams
      operationId: revokeLaneCredential
      summary: Revoke a credential the mint seam issued
      description: Revokes `credential` through the host's production revocation path. On a `next-request` lane the very next
        request presenting it MUST be refused `401 credential_revoked` (identity.md §2.2); the suite observes that on the
        canonical API, not through this seam. `404` when no active credential matches.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
              - credential
              properties:
                lane:
                  type: string
                  minLength: 1
                credential:
                  type: string
                  minLength: 1
      responses:
        '200':
          description: The credential is revoked.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                - revoked
                properties:
                  revoked:
                    type: boolean
                    const: true
                  lane:
                    type: string
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
  /conformance/seams/sample/agent/transcript-window:
    get:
      tags:
      - Seams
      operationId: getTranscriptWindow
      summary: Read the host's accounting of what it fed the model on one orchestrator turn
      description: 'Returns what the host fed the model on turn `iteration` of `runId`. The orchestrator transcript a host
        assembles each iteration is host-internal and never crosses the wire, so this seam reports the host''s own accounting:


        - `tokenCount`, in the advertised `contextBudget.tokenCounter` unit. MUST be ≤ `transcriptTokenBudget`.

        - `eventIds`: the verbatim recent tail, in event-log order.

        - `summarizedRanges`.

        - `entries[] { eventId, rendered }`: the exact text fed per item. REQUIRED when `tokenCounter` is `chars`, so the
        suite can sum the rendered Unicode code points and require the sum to equal `tokenCount`. A summary substitution''s
        entry names its `context.summarized` event and renders the summary text.


        Served in test mode only; `rendered` MUST NOT carry secret material (SR-1). The ceiling is advertise-and-attest: the
        seam proves the declared accounting is consistent and bounded, not that nothing else reached the model. A turn past
        the run''s last answers `400`/`422`; an unwired seam answers `404`/`405`.'
      parameters:
      - name: runId
        in: query
        required: true
        schema:
          $ref: ../schemas/v2/ids.schema.json#/$defs/runId
      - name: iteration
        in: query
        required: true
        description: The 1-based `runOrchestrator.decided.iteration` of the turn.
        schema:
          type: integer
          minimum: 1
      responses:
        '200':
          description: The host's accounting for that turn.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                - tokenCounter
                - tokenCount
                - eventIds
                - summarizedRanges
                properties:
                  tokenCounter:
                    type: string
                    enum:
                    - o200k_base
                    - cl100k_base
                    - chars
                    - host-defined
                  tokenCount:
                    type: integer
                    minimum: 0
                  eventIds:
                    type: array
                    items:
                      type: string
                      minLength: 1
                  summarizedRanges:
                    type: array
                    items:
                      type: object
                      additionalProperties: false
                      required:
                      - summaryRef
                      - replacedTurns
                      properties:
                        summaryRef:
                          type: string
                          minLength: 1
                        replacedTurns:
                          type: array
                          items:
                            type: string
                            minLength: 1
                  entries:
                    type: array
                    items:
                      type: object
                      additionalProperties: false
                      required:
                      - eventId
                      - rendered
                      properties:
                        eventId:
                          type: string
                          minLength: 1
                        rendered:
                          type: string
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
components:
  securitySchemes:
    ApiKeyAuth:
      type: http
      scheme: bearer
      bearerFormat: API key
      description: OpenWOP API key. The format is implementation-defined; the reference implementation uses `hk_`/`hk_test_`
        prefixes. Each key carries one or more scopes from the canonical vocabulary (`manifest:read`, `runs:create`, `runs:read`,
        `runs:cancel`, `artifacts:read`, `webhooks:manage`, `approvals:respond`, `audit:read`). See `auth.md`.
    OAuth2:
      type: oauth2
      description: 'The OAuth 2.0 lane (`auth.lanes[].lane: "oauth2"`). Discovery is RFC 9728 Protected Resource Metadata
        at the path-inserted well-known URI (`identity.md` §2.5). The URLs are placeholders.'
      flows:
        clientCredentials:
          tokenUrl: https://issuer.example/oauth2/token
          scopes:
            manifest:read: Read workflow / canvas-type / endpoint manifests
            runs:create: Create new runs
            runs:read: Read run state and event stream
            runs:cancel: Cancel an in-flight run
            runs:annotate: Record a quality annotation on a run
            artifacts:read: Read artifacts produced by runs
            webhooks:manage: Register/unregister webhook subscriptions
            approvals:respond: Respond to HITL approval gates
            packs:publish: Publish node-pack versions
            packs:read: Fetch a published node-pack tarball or signature
            packs:yank: Yank a node-pack version
            packs:yank-revert: Reinstate a yanked node-pack version
            audit:read: Verify audit-log integrity
            workspace:read: Read agent-workspace files
            workspace:write: Write agent-workspace files
            prompts:read: Read and render prompt templates
            prompts:write: Create, update and delete prompt templates
            content:read: Read authored content pages and locale settings
            content:write: Create, publish and translate authored content pages
            deploy:*: Drive an agent deployment state transition
        authorizationCode:
          authorizationUrl: https://issuer.example/oauth2/authorize
          tokenUrl: https://issuer.example/oauth2/token
          scopes:
            manifest:read: Read workflow / canvas-type / endpoint manifests
            runs:create: Create new runs
            runs:read: Read run state and event stream
            runs:cancel: Cancel an in-flight run
            runs:annotate: Record a quality annotation on a run
            artifacts:read: Read artifacts produced by runs
            webhooks:manage: Register/unregister webhook subscriptions
            approvals:respond: Respond to HITL approval gates
            packs:publish: Publish node-pack versions
            packs:read: Fetch a published node-pack tarball or signature
            packs:yank: Yank a node-pack version
            packs:yank-revert: Reinstate a yanked node-pack version
            audit:read: Verify audit-log integrity
            workspace:read: Read agent-workspace files
            workspace:write: Write agent-workspace files
            prompts:read: Read and render prompt templates
            prompts:write: Create, update and delete prompt templates
            content:read: Read authored content pages and locale settings
            content:write: Create, publish and translate authored content pages
            deploy:*: Drive an agent deployment state transition
    OpenIdConnect:
      type: openIdConnect
      openIdConnectUrl: https://issuer.example/.well-known/openid-configuration
      description: 'The OpenID Connect lane (`auth.lanes[].lane: "oidc"`). An ID token MAY be the bearer only when its `aud`
        equals the host''s configured audience (`identity.md` §2.1); any other `aud` is `audience_mismatch`. The URL is a
        placeholder.'
    MutualTLS:
      type: mutualTLS
      description: 'The mTLS lane (`auth.lanes[].lane: "mtls"`). mTLS is required *in addition to* a bearer, never instead
        of one, so it appears in no canonical requirement below. A host that requires it adds `MutualTLS: []` inside each
        requirement object (AND).'
  parameters:
    IdempotencyKey:
      in: header
      name: Idempotency-Key
      required: false
      schema:
        type: string
        maxLength: 255
      description: 'Per-mutation idempotency token (`idempotency.md` Layer 1). The server caches `(tenantId, endpoint, key)`
        → response for ≥24h. A duplicate request returns the cached response with `OpenWOP-Idempotent-Replay: true`.'
    WorkspacePath:
      in: path
      name: path
      required: true
      schema:
        type: string
        pattern: ^[A-Za-z0-9][A-Za-z0-9._/-]{0,255}$
      description: Workspace-relative file path in a flat namespace that allows `/` in names; no `..` and no leading `/`.
        Matches `workspace-file.schema.json#path`.
    WorkspacePrefix:
      in: query
      name: prefix
      required: false
      schema:
        type: string
        maxLength: 256
      description: Optional prefix filter over the flat `path` namespace for `listWorkspaceFiles`.
    WorkspaceVersion:
      in: query
      name: version
      required: false
      schema:
        type: integer
        minimum: 1
      description: 'When `capabilities.workspace.versioned: true`, requests the historical snapshot at this version. Absent
        means latest.'
    IfMatch:
      in: header
      name: If-Match
      required: false
      schema:
        type: string
        maxLength: 255
      description: 'Optimistic-concurrency token: the file''s current `etag`. A `PUT` carrying a stale `If-Match` returns
        `409 workspace_conflict`.'
    PackName:
      in: path
      name: name
      required: true
      schema:
        type: string
        minLength: 3
        maxLength: 214
      description: Reverse-DNS pack name per `spec/v1/node-packs.md` §Naming (e.g. `vendor.acme.salesforce-tools`).
    PackVersion:
      in: path
      name: version
      required: true
      schema:
        type: string
        pattern: ^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(?:-[\w.-]+)?(?:\+[\w.-]+)?$
      description: SemVer 2.0.0 version of the pack.
  responses:
    Unauthenticated:
      description: Missing or invalid credential.
      headers:
        WWW-Authenticate:
          description: A `Bearer` challenge. On a host with an oauth2 or oidc lane it carries `resource_metadata` and `error="invalid_token"`.
            Never sent on a non-disclosure 404.
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: Credential valid but lacks required scope or fails resource binding.
      headers:
        WWW-Authenticate:
          description: On a scope refusal, `error="insufficient_scope"` with every required `scope`. Absent on a resource-binding
            403.
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Resource doesn't exist or caller can't see it (do not leak existence).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ValidationError:
      description: Request body or parameters malformed.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    Error:
      $ref: ../schemas/v2/error-envelope.schema.json
    TestPackPublishRecord:
      description: Response body for a successful publish to the test-mode registry namespace. Mirrors the production publish
        record returned by `PUT /v1/packs/{name}/-/{version}.tgz`.
      type: object
      required:
      - name
      - version
      - tarballSha256
      - publishedAt
      properties:
        name:
          type: string
          description: Reverse-DNS pack name as PUT'd.
        version:
          type: string
          description: SemVer 2.0.0 version as PUT'd.
        tarballSha256:
          type: string
          pattern: ^sha256-[A-Za-z0-9+/=]+$
          description: Server-computed SHA-256 over the uploaded tarball bytes.
        publishedAt:
          type: string
          format: date-time
        signed:
          type: boolean
          description: Whether a sibling `.sig` signature blob was persisted.
        signingMethod:
          type: string
          enum:
          - sigstore
          - manual
          - none
security:
- ApiKeyAuth: []
