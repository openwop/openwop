  - id: secret-leakage-otel-attribute
    tier: protocol
    severity: high
    threat_model: SECURITY/threat-model-secret-leakage.md
    tests:
      - conformance/src/scenarios/envelope-reasoning-secret-redaction.test.ts
    note: |
      Graduated reference-impl → protocol on 2026-05-21 via RFC 0034 §C:
      conformance gates on capabilities.observability.testSeams.otelScrape;
      advertising hosts MUST serve POST /v1/host/sample/test/otel/spans
      returning span attributes that do not echo the BYOK canary. The
      Postgres reference host's byok-roundtrip.test.ts continues to cover
      the host-internal allowlist; this row now also has cross-host
      conformance coverage on hosts that advertise the test seam.

  - id: secret-leakage-error-envelope
    tier: protocol
    severity: critical
    threat_model: SECURITY/threat-model-secret-leakage.md
    tests:
      - conformance/src/scenarios/redaction.test.ts
      - conformance/src/scenarios/auth.test.ts
