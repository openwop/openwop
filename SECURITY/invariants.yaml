  # SEC-4 close-out note (2026-05-15): the node-pack-sandbox-* group
  # is non-testable in the public repo until the first reference host
  # executes pack-loaded typeIds in a sandbox. The Postgres reference
  # host's pack-consumer.ts (PACK-1/PACK-2) verifies install-time
  # security (SRI + Ed25519 + version drift + lockfile parse) but
  # does NOT mount loaded packs into a runtime sandbox. Runtime
  # invariants gate on the first host that does so.
  # See plans/openwop-protocol-gap-closure-plan.md Workstream 5 PACK-1
  # and Workstream 4 SEC-4 for the policy.

  - id: node-pack-sandbox-no-process
    tier: protocol
    severity: critical
    threat_model: SECURITY/threat-model-node-packs.md
    tests:
      - conformance/src/scenarios/sandbox-wasm-isolation.test.ts
      - conformance/src/scenarios/sandbox-no-host-process-escape.test.ts
    note: |
      RFC 0035 §A invariant 4. Sandboxed code MUST NOT spawn host
      processes, fork, or call exec-family syscalls. GRADUATED
      reference-impl → protocol 2026-05-31: the WASM-isolation reference
      (`openwop-examples:examples/hosts/wasm-sandbox/`) makes this hold
      by construction —
      a process syscall can only be a declared import, refused before
      instantiation. The portable server-free `sandbox-wasm-isolation
      .test.ts` asserts `misbehaving-process` → sandbox_escape_attempt
      (host-process-escape) non-vacuously. The legacy seam scenario
      remains for the host-driven path.

  - id: node-pack-sandbox-no-eval
    tier: reference-impl
    severity: high
    threat_model: SECURITY/threat-model-node-packs.md
    tests: []
    non_testability_rationale: |
      Stays at reference-impl tier — the 8-row RFC 0035 §A invariant
      list addresses "no dynamic code execution inside the sandbox,"
      which is a JS-runtime-specific concern (no `eval()`, no `new
      Function()`). The wider RFC 0035 invariant set covers the
      cross-runtime concerns (fs-gated, network-gated, no-env, etc.);
      no-eval has no direct cross-runtime conformance assertion
      because non-JS runtimes (wasmtime, nsjail) don't expose
      `eval()` semantics. Graduates if + when a JS-pack-loading host
      ships with a corresponding `sandbox-no-eval.test.ts`.

  - id: node-pack-sandbox-network-gated
    tier: protocol
    severity: critical
    threat_model: SECURITY/threat-model-node-packs.md
    tests:
      - conformance/src/scenarios/sandbox-wasm-isolation.test.ts
      - conformance/src/scenarios/sandbox-no-network-escape.test.ts
    note: |
      RFC 0035 §A invariant 3. Sandboxed code MUST NOT initiate
      network requests unless host.fetch (or equivalent) is in
      allowedHostCalls. GRADUATED reference-impl → protocol 2026-05-31:
      a WASM module's only path to the network is a declared import; the
      portable `sandbox-wasm-isolation.test.ts` asserts an un-granted
      socket import (`misbehaving-network`) → sandbox_escape_attempt
      (network-escape) non-vacuously, and a granted `openwop.fetch` is
      callable only when in allowedHostCalls.

  - id: node-pack-sandbox-fs-gated
    tier: protocol
    severity: critical
    threat_model: SECURITY/threat-model-node-packs.md
    tests:
      - conformance/src/scenarios/sandbox-wasm-isolation.test.ts
      - conformance/src/scenarios/sandbox-no-host-fs-escape.test.ts
    note: |
      RFC 0035 §A invariant 1. Sandboxed code MUST NOT read or write
      files outside the host-advertised sandbox root. GRADUATED
      reference-impl → protocol 2026-05-31: a WASM module has no
      filesystem syscalls — an out-of-root access can only be a declared
      import the host refuses before instantiation. The portable
      `sandbox-wasm-isolation.test.ts` asserts `misbehaving-fs` →
      sandbox_escape_attempt (host-fs-escape) non-vacuously.

  - id: node-pack-sandbox-no-env
    tier: protocol
    severity: critical
    threat_model: SECURITY/threat-model-node-packs.md
    tests:
      - conformance/src/scenarios/sandbox-wasm-isolation.test.ts
      - conformance/src/scenarios/sandbox-no-host-env-leak.test.ts
    note: |
      RFC 0035 §A invariant 2. Host environment variables MUST NOT
      be visible to sandbox code unless the host has explicitly
      forwarded them via an allowedHostCalls entry. GRADUATED
