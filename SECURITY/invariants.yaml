  - id: prompt-injection-envelope-typecheck
    tier: protocol
    severity: high
    threat_model: SECURITY/threat-model-prompt-injection.md
    tests:
      - conformance/src/scenarios/runtime-capabilities.test.ts
      - conformance/src/scenarios/discovery.test.ts
