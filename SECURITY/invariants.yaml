      at registration by the membership gate in `webhooks.md` §Endpoints.
      Cross-tenant delivery is a protocol violation regardless of
      subscription filter breadth (`events` / `tags`). Mirrors
      `agent-memory-cti-1` / `kv-cross-tenant-isolation` /
      `queue-cross-tenant-isolation` for the delivery direction: every
      other tenant-scoped surface already carried an explicit
      cross-tenant-isolation invariant; webhook delivery was the omission.
    witness: seam-gated
    witnessReview: initial-mechanical-2026-09-02

  - id: webhook-delivery-egress-revalidation
    tier: reference-impl
    severity: critical
    threat_model: SECURITY/threat-model-secret-leakage.md
    tests: []
    # enforcement pending — tracked gap: black-box conformance cannot
    # observe a host's resolver behavior. Enforcement lands in the
    # reference host's webhook delivery client
    # (openwop-app:backend/typescript/src/host/webhookDeliveryWorker.ts)
    # per RFC 0093's open reference-host acceptance criterion; that repo's
    # CI carries the verifying tests once wired.
    note: |
      RFC 0093 §A: hosts MUST re-resolve a webhook delivery URL's hostname
      at delivery time and validate EVERY resolved address against the
      same denied ranges as registration (`webhooks.md` §"SSRF protection"
      plus any host-configured denylist). The connection MUST be made to
      the validated address (pinned resolution); the dispatcher MUST NOT
      re-resolve between validation and connect; and delivery MUST NOT
      follow redirects — a `3xx` is a delivery failure retried per the
      existing policy. Closes the DNS-rebinding / redirect-following
      TOCTOU left open by registration-time-only validation (a registered
      public hostname later re-pointed at `169.254.169.254`, or a `302`
      to a metadata endpoint).
    non_testability_rationale: |
      Classified unwitnessable by the RFC 0166 §C.2 backfill (initial-mechanical-2026-09-02): no public test names
      this invariant (tests: []). The obligation is stated in note: above and is verified,
      if at all, by the reference implementation's own tests at its tier. Review may re-tier
      it or attach a scenario; until then it counts against the unwitnessable ratchet.
    witness: unwitnessable
    witnessReview: initial-mechanical-2026-09-02

  - id: connection-pack-no-credential-material
    tier: protocol
    severity: critical
    threat_model: SECURITY/threat-model-secret-leakage.md
    tests:
      - conformance/src/scenarios/connection-pack-no-credential-material.test.ts
    note: |
      RFC 0095 / connection-packs.md §Manifest clause 2. A connection-pack
      manifest (kind: "connection") is PUBLIC provider metadata and MUST NOT
      contain credential material in any field — no client secret, no
      access/refresh token, no API key, no password. A host MUST reject a
      manifest carrying a property whose name matches the normative minimum
      blocklist (clientSecret, client_secret, apiKey, api_key, token,
      accessToken, refreshToken, password, privateKey, secret — matched
      case-insensitively at any depth) with
      connection_pack_credential_material; the single exemption is the
      property named `token` at exactly provider.auth.endpoints.token (the
      OAuth token-endpoint URL). The scan runs BEFORE generic schema
      validation so the specific code wins over a generic shape error. The
      OAuth client credential is a host concern (RFC 0047), supplied out of
      band by the operator — never shipped in the pack. Public test: the
      always-on schema probe (additionalProperties:false rejects every
      blocklisted name at the schema layer) + the capability-gated
      behavioral leg asserting the specific error code on a live host.
    witness: seam-gated
    witnessReview: initial-mechanical-2026-09-02

  - id: connection-pack-api-host-shape
    tier: protocol
    severity: critical
    threat_model: SECURITY/threat-model-secret-leakage.md
    tests:
      - conformance/src/scenarios/connection-pack-apihosts.test.ts
    note: |
      RFC 0120 / connection-packs.md §Manifest items 11 + 13. A connection-pack
      `provider.apiHosts` entry governs WHERE a resolved credential may be sent
      for connector egress (RFC 0045), so its shape MUST be tight: each entry is
      a bare, lowercase, registrable hostname of two-or-more dot-separated labels
      whose final (TLD) label begins with an ASCII letter, and MUST NOT carry a
      scheme, userinfo, port, path, query, fragment, wildcard (`*`), or IP literal
      (v4 or v6). A host MUST reject a non-conforming entry with
      connection_pack_invalid_api_host. The TLD-must-be-alphabetic rule is what
      makes the schema `pattern` reject IPv4 literals such as 127.0.0.1 — JSON
      Schema `format:"hostname"` is advisory and admits all-numeric hosts, so the
      allow-list MUST NOT rely on it for IP rejection. Conditional MUST: when
      `provider.reach` is `openapi` (a credentialed REST/OpenAPI egress surface)
      `apiHosts` is REQUIRED (the provider-level `allOf`); an `mcp`/metadata
      provider MAY omit it. Public test: the always-on, server-free schema legs of
      connection-pack-apihosts.test.ts (positive apiHosts fixture; openapi-without-
      apiHosts rejected; IP/wildcard/port/single-label/uppercase entries rejected;
      mcp-omission valid).
    witness: seam-gated
    witnessReview: initial-mechanical-2026-09-02

  - id: connection-pack-egress-host-bound
    tier: protocol
    severity: critical
    threat_model: SECURITY/threat-model-secret-leakage.md
    tests:
      - conformance/src/scenarios/connection-pack-apihosts.test.ts
    note: |
      RFC 0120 / connection-packs.md §Manifest items 10 + 15. A host performing
      credential-bearing connector egress (an RFC 0045 action / brokered fetch)
      for a pack-delivered provider MUST restrict the destination to a host that
      MATCHES an `apiHosts` entry and MUST fail closed (no credential sent)
      otherwise — the confused-deputy guard for pack providers. Matching is
      dot-anchored suffix containment: a request host matches an entry IFF it
      equals the entry OR ends with `"." + entry` — never a bare substring, so
      `notexample.com` / `evil.com` / `example.com.evil.com` MUST NOT match
      `example.com`. eTLD+1 is the floor (an entry admits its subdomains); a pack
      MAY declare a tighter exact host to narrow egress. `apiHosts` is
      AND-composed with — and never widens past — the RFC 0079
      `egress-credential-audience-bound` guard (item 15): where both apply an
      egress MUST satisfy both, and an `apiHosts` match MUST NOT be treated as an
      escape hatch that bypasses RFC 0079. Public test: the always-on, server-free
      matching-rule legs of connection-pack-apihosts.test.ts (dot-anchored
      containment + no-substring/suffix/prefix escape + tighter-exact-host) plus
      the capability-gated behavioral egress-allow-list leg (permit an apiHosts
      match; fail closed otherwise) driven through the
      POST /v1/host/sample/connection-packs/egress-check seam.
    witness: seam-gated
    witnessReview: initial-mechanical-2026-09-02

  - id: proposal-inert-until-applied
    tier: protocol
    severity: critical
    threat_model: SECURITY/threat-model-prompt-injection.md
    tests:
      - conformance/src/scenarios/proposal-reviewable-learning.test.ts
    note: |
      RFC 0096 / agent-memory.md §"Reviewable learning" clause 1. A Proposal
      in any state other than `applied` MUST NOT influence the resolution,
      planning, or execution of any run (the inertness invariant). A host
      advertising `agents.proposals` MUST keep a synthesized draft/revised
      proposal inert: a workflow-chain-pack proposal in `draft` does not alter
      a run that would match it; only after an authorized `apply` does the
      behavior appear. This is the safety guarantee that an agent cannot
      silently mutate its own production behavior — a synthesized reusable
      behavior is reviewable-first. Public test: the always-on schema leg
      (the `state` enum + open-`artifact` shape) + the capability-gated
      behavioral leg asserting a draft proposal leaves a matching run
      unchanged until applied.
    witness: seam-gated
    witnessReview: initial-mechanical-2026-09-02

  - id: proposal-no-resynthesis
    tier: protocol
    severity: high
    threat_model: SECURITY/threat-model-prompt-injection.md
    tests:
      - conformance/src/scenarios/proposal-reviewable-learning.test.ts
    note: |
      RFC 0096 / agent-memory.md §"Reviewable learning" clause 3. On `apply`,
      the installed artifact MUST be the exact `artifact` payload last
      persisted on the proposal — no silent re-synthesis at activation. A
      host MUST NOT regenerate or mutate the artifact between the last human
      revision and installation; the byte image a reviewer approved is the
      byte image installed. Closes the "the agent changed what I approved at
      the moment I approved it" trust gap. Public test: the capability-gated
      behavioral leg asserting the installed artifact byte-matches the
      last-persisted `artifact`.
    witness: seam-gated
    witnessReview: initial-mechanical-2026-09-02

  - id: goal-continuation-bounded
    tier: protocol
    severity: critical
    threat_model: SECURITY/threat-model-prompt-injection.md
    tests:
      - conformance/src/scenarios/goal-standing-continuation.test.ts
    note: |
      RFC 0097 / agent-runtime.md §"Standing goals" clause 2. A standing
      goal's continuation MUST be bounded: when `agents.goals.requiresBounds`
      is advertised, an `active` goal without RFC 0058 `bounds` is invalid
      (`POST /goals` ⇒ 422). The host MUST stop continuation and set
      `state: bound-exceeded` (emitting `goal.closed`) when any declared
      bound is crossed — iteration count, accumulated cost (RFC 0084), or
      wall-clock deadline. This is the termination guarantee an operator
      running unattended goals depends on: the loop cannot run forever.
      Public test: the always-on schema leg (bounds object) + the
      capability-gated behavioral leg asserting a never-satisfied goal halts
      exactly at `maxLoopIterations` with no further runs.
    witness: seam-gated
    witnessReview: initial-mechanical-2026-09-02

  - id: goal-completion-judge-only
    tier: protocol
    severity: high
    threat_model: SECURITY/threat-model-prompt-injection.md
    tests:
      - conformance/src/scenarios/goal-standing-continuation.test.ts
    note: |
      RFC 0097 / agent-runtime.md §"Standing goals" clause 1. A goal's
      completion MUST be determined by the judge declared in
      `completion.check` (an RFC 0090 verifier verdict or the host
      evaluator). A client MUST NOT be able to set `state: satisfied`
      directly — a write attempting it is rejected. Closes the "mark my own
      homework" gap where a caller declares a goal done without the judge
      agreeing. Public test: the capability-gated behavioral leg asserting a
      client-supplied `state: satisfied` is refused and only a judge verdict
      transitions the goal to satisfied.
    witness: seam-gated
    witnessReview: initial-mechanical-2026-09-02

  - id: export-bundle-no-credential-material
    tier: protocol
    severity: critical
    threat_model: SECURITY/threat-model-secret-leakage.md
    tests:
      - conformance/src/scenarios/export-bundle-portability.test.ts
    note: |
      RFC 0098 / portability.md §Invariants clause 1. An export bundle MUST
      NOT contain credential VALUES. `connection-ref` items carry only
      refs/provider ids (RFC 0046/0079); the importer MUST report unbound
      refs in `secretsToRebind` and MUST NOT invent or transfer secret
      material. A host MUST reject an imported bundle whose `connection-ref`
      payload carries a literal credential value (client secret, access/
      refresh token, API key, password, private key — matched
      case-insensitively at any depth) with a secret-value rejection (422).
      Mirrors `connection-pack-no-credential-material`: credentials are
      host-side and re-bound at the destination, never carried on the wire.
      Public test: the always-on schema leg (no credential fields in the
      bundle shape) + the capability-gated behavioral leg asserting a bundle
      with an embedded literal key is rejected and export emits refs only.

  # ===== RFC 0099 external-event trigger ingestion =====
    witness: seam-gated
    witnessReview: initial-mechanical-2026-09-02

  - id: trigger-ingestion-ssrf
    tier: protocol
    severity: critical
    threat_model: SECURITY/threat-model-secret-leakage.md
    tests:
      - conformance/src/scenarios/trigger-ingestion.test.ts
    note: |
      RFC 0099 §F.4 / trigger-bridge.md §F.4. ANY host-side fetch the
      external-event ingestion path performs (webhook verification callback,
      email-attachment resolution, form file-upload retrieval) MUST go through
      the RFC 0076 §B SSRF guard (`assertPublicUrl` / `httpClient.safeFetch`):
      no fetch to a private/link-local/loopback address, with the
      `maxResponseBodyBytes` cap. The host MUST NOT hand the run an external
      URL to fetch itself — `TriggerEvent.AttachmentRef.ref` is a host-internal
      opaque handle, never a raw external URL. An attachment whose resolution
      would hit a private address (e.g. `http://169.254.169.254/...`) MUST be
      refused (the attachment dropped, the run still starting on the rest of
      the event). Public test: the always-on schema leg asserts `AttachmentRef`
      requires `ref` and rejects a raw `url` field (the schema structurally
      forbids handing the run a fetchable URL); the capability-gated behavioral
      leg (`triggerBridge.ingestion`) asserts an ingestion-path fetch to a
      private address is refused, reusing the `http-client-ssrf-guard` posture.
    witness: seam-gated
    witnessReview: initial-mechanical-2026-09-02

  - id: trigger-ingestion-content-redaction
    tier: protocol
    severity: critical
    threat_model: SECURITY/threat-model-secret-leakage.md
    tests:
      - conformance/src/scenarios/trigger-ingestion.test.ts
    note: |
      RFC 0099 §F.4 / trigger-bridge.md §F.4. The inbound external-event body,
      headers, email content, and form fields MUST NOT appear on any `run.*` /
      `trigger.*` durable event payload (RFC 0083 §C content-freeness,
      generalized to external sources). The content lives ONLY in
      `ctx.triggerData` (the in-run `TriggerEvent`, never event-logged) and the
      run's own variables (SR-1 redaction applies). `webhook.headers` MUST be a
      host-curated allowlist — the host MUST NOT pass through `Authorization`,
      `Cookie`, or `Proxy-Authorization`; `dedupKey` MUST be host-opaque.
      Public test: the always-on schema leg asserts the in-run `TriggerEvent`
      is the ONLY carrier of inbound content (the per-source one-of rule holds;
      `AttachmentRef` requires a host-internal `ref` and rejects a raw `url`;
      `contentTrust` is the const `"untrusted"`) and that the durable
      `trigger.delivery.attempted` payload schema carries only the content-free
      `{subscriptionId,dedupKey,attempt,outcome,runId?}` fields (RFC 0083 §C —
      the inbound body never appears on it); the capability-gated behavioral leg
      (`triggerBridge.ingestion`) asserts a delivered event's
      `trigger.delivery.attempted` carries no inbound body/header content and
      that `webhook.headers` is a host-curated allowlist (no `Authorization`).

  # ===== RFC 0100 async / durable A2A tasks =====
    witness: seam-gated
    witnessReview: initial-mechanical-2026-09-02

  - id: a2a-push-egress-ssrf
    tier: protocol
    severity: critical
    threat_model: SECURITY/threat-model-secret-leakage.md
    tests:
      - conformance/src/scenarios/a2a-task-roundtrip.test.ts
    note: |
      RFC 0100 §4 / a2a-integration.md §"Async / durable Tasks". A
      caller-registered A2A push-notification `pushConfig.url` MUST be validated
      through the RFC 0093 webhook-egress SSRF guard IN FULL before any push — a
      caller-supplied push URL is an SSRF surface identical to a webhook, and
      "identical" means BOTH arms of the `webhooks.md` §"SSRF protection" list:
      the SCHEME arm (non-`https://` protocols MUST be refused) and the ADDRESS
      arm (no private/loopback/link-local/ULA/metadata target).
      Clarified 2026-08-25: this note, the RFC, and the spec cell all previously
      abbreviated the guard to its address arm, so a host refusing
      `http://10.0.0.5/push` while accepting `http://push.example.com/` read as
      conforming. It never was — `COMPATIBILITY.md` §3 records the Class 3
      classification. Reported by a tier-1 host that found the same structural
      defect in its own A2A path after fixing it on the webhook path, and
      correctly declined to fix it while the obligation was inference-only. A push MUST NOT carry run-internal
      content beyond the projected `A2ATaskState` + A2A artifact references;
      `pushConfig.tokenFingerprint` MUST be a truncated/salted digest
      (`maxLength: 32`), never the raw push-auth token (SR-1, mirroring RFC
      0083's `secretFingerprint`). Public test: the always-on schema leg in
      `a2a-task-roundtrip.test.ts` asserts `PushConfig` requires `url`, that the
      `tokenFingerprint` ceiling structurally rejects a full-length raw token,
      and that an `A2ATaskState` carrying run inputs/artifacts inline fails
      `additionalProperties:false`; the capability-gated behavioral leg
      (`a2a.pushNotifications`) is TWO-SIDED: a `pushConfig.url` at a private
      address over `https` is refused (address arm) and one at a public host
      over `http` is refused (scheme arm). Two legs, because the previous single
      `http://10.0.0.5` probe is refused by EITHER arm alone and so witnessed
      neither — an assertion that passes on half an implementation.

  # ===== RFC 0102 — A2UI agent-authored interface surfaces =====
    witness: seam-gated
    witnessReview: initial-mechanical-2026-09-02

  - id: a2ui-action-confinement
    tier: protocol
    severity: critical
    threat_model: SECURITY/threat-model-prompt-injection.md
    tests:
