  - id: voice-streamref-tenant-bound
    tier: reference-impl
    severity: critical
    threat_model: SECURITY/threat-model-prompt-injection.md
    tests:
      - conformance/src/scenarios/voice-streamref-tenant-bound.test.ts
    note: |
      RFC 0106 §F INV-4. A `streamRef` MUST be bound to exactly one tenant +
      session for its lifetime; no buffered audio or interim transcript may be
      readable via another handle; and the session MUST enforce a max-duration /
      max-uncommitted-audio budget so a never-finalizing stream is bounded
      (TDoS-analog). Detect: (a) two concurrent streams under different tenants —
      tenant B presenting A's `streamRef` is rejected; (b) a stream that never
      finalizes is terminated at the configured budget. Reuses the
      `media-asset-url-tenant-scoped` (RFC 0055) tenant-scoping precedent.
      STAYS reference-impl: live `streamRef` transport is host-internal per §E and
      unsupported on the stateless openwop-app host (honest `transcription_unsupported`
      for a live `streamRef`), so there is no live conduit to exhibit cross-tenant
      binding; the gated leg `voice-streamref-tenant-bound.test.ts` soft-skips until
      a host with live `streamRef` transport proves it, then graduates to protocol.

  # ===== RFC 0117 front-end plugin packs (sandboxed UI extensions) =====
    witness: seam-gated
    witnessReview: initial-mechanical-2026-09-02

  - id: frontend-plugin-isolation
    tier: protocol
    severity: critical
    threat_model: SECURITY/threat-model-prompt-injection.md
    tests:
      - conformance/src/scenarios/frontend-plugin-packs.test.ts
    note: |
      `frontend-plugin-packs.md` §Isolation (amended by RFC 0119): a host
      advertising `capabilities.uiPlugins.supported: true` MUST execute every
      plugin `entry` in an ORIGIN/EXECUTION-ISOLATED sandbox — the plugin has no
      access to the host's execution context, host DOM, host-origin storage, or
      host credentials. A cross-origin sandboxed iframe (distinct origin + an HTML
      `sandbox` attribute withholding same-origin privileges) is the canonical
      browser mechanism; an equivalent WASM/process/container/VM sandbox enforcing
      the SAME property is equally conformant (the advertised
      `capabilities.uiPlugins.isolation` value names the mechanism). In-process
      loading, same-origin iframes, and module federation (the federated remote
      executing with the host's full privileges) are a protocol-tier MUST NOT —
      REGARDLESS of the advertised mechanism — because registry-distributed
      third-party code must never run with host authority. For `isolation:"wasm"`
      this MUST NOT additionally means the host binds NO host import to the plugin
      module beyond the single `ui-plugin/1` RPC entrypoint (no ambient host
      functions — an extra import is a silent side channel), mirroring the closed
      `openwop` import namespace RFC 0008 §C mandates for backend WASM packs (RFC
      0119 §Host-RPC). The always-on shape leg
      of `frontend-plugin-packs.test.ts` asserts `uiPlugins.isolation` is a member
      of the conformant model set (RFC 0119 enum / `x-host-*`); the gated
      behavioral leg drives a host advertising `uiPlugins.supported` and asserts
      the plugin runs out of the host's execution context. Graduates reference-impl
      → protocol when the openwop-app reference host (ADR 0153) serves the live
      sandboxed frame.
    witness: seam-gated
    witnessReview: initial-mechanical-2026-09-02

  - id: frontend-plugin-egress
    tier: protocol
    severity: high
    threat_model: SECURITY/threat-model-prompt-injection.md
    tests:
      - conformance/src/scenarios/frontend-plugin-packs.test.ts
    note: |
      `frontend-plugin-packs.md` §Security: absent declared `connectSrc`
      exceptions in the manifest, the host MUST serve the plugin under a
      DENY-EGRESS Content-Security-Policy — no network egress beyond the
      `ui-plugin/1` host-RPC channel. This confines a malicious or compromised
      plugin bundle to the host-mediated, authz-checked RPC seam and prevents
      exfiltration of any data the surface renders. Any `connectSrc` exception is
      part of the registry front-end-review checkpoint (`registry-operations.md`)
      and a host MAY refuse a pack whose exceptions it will not grant. The gated
      leg asserts the served CSP denies egress for a plugin with no declared
      `connectSrc`.
    witness: seam-gated
    witnessReview: initial-mechanical-2026-09-02

  - id: frontend-plugin-rpc-allowlist
    tier: protocol
    severity: critical
    threat_model: SECURITY/threat-model-prompt-injection.md
    tests:
      - conformance/src/scenarios/frontend-plugin-packs.test.ts
    note: |
      `frontend-plugin-packs.md` §Host-RPC: the host MUST reject any `ui-plugin/1`
      `request` whose `method` is not in BOTH the plugin's declared manifest
      `hostApi` allowlist AND the host's advertised `capabilities.uiPlugins.hostApi`
      set — returning a `response` `{ ok:false, error:{ code:"method_not_allowed" } }`,
      NEVER silently executing it. The plugin holds no credentials; every method
      is host-mediated and authz-checked, so an undeclared/unknown method is the
      privilege-escalation surface this invariant closes. The always-on shape leg
      validates the `ui-plugin-message.schema.json` allowlist `enum` + the
      `method_not_allowed` error code; the gated leg drives an undeclared-method
      `request` against a live host and asserts the `method_not_allowed` refusal.
    witness: seam-gated
    witnessReview: initial-mechanical-2026-09-02

  - id: frontend-plugin-no-byok
    tier: protocol
    severity: critical
    threat_model: SECURITY/threat-model-secret-leakage.md
    tests:
      - conformance/src/scenarios/frontend-plugin-packs.test.ts
    note: |
      `frontend-plugin-packs.md` §Security: no BYOK credential material EVER
      crosses the `ui-plugin/1` boundary into the sandbox. A plugin operates
      purely through host-mediated, authz-checked RPC and holds no credentials;
      the `ui-plugin-message.schema.json` envelope carries no credential field,
      and the `error.message` field MUST NOT carry secret material. Reuses the
      SR-1 secret-redaction precedent (the sandbox is an untrusted boundary like
      RFC 0091 untrusted media). The always-on shape leg asserts the message
      schema exposes no credential-bearing field and that `additionalProperties`
      is closed on the envelope; the gated leg asserts an `artifact.read` result
      crossing the boundary carries no resolved BYOK plaintext.
    witness: seam-gated
    witnessReview: initial-mechanical-2026-09-02

  - id: test-seam-authenticated-when-enabled
    tier: protocol
    severity: high
    threat_model: SECURITY/threat-model-auth-profiles.md
    tests:
      - conformance/src/scenarios/test-seam-unauthenticated.test.ts
    note: |
      `host-sample-test-seams.md` §"Production safety (normative)": an ENABLED
      seam MUST apply the same authentication and tenant resolution as the
      canonical surface — STRENGTHENED 2026-08-15 to require an AUTHENTICATED,
      NON-ANONYMOUS principal. The first wording was trivially satisfiable: RFC
      0132 sanctions anonymous actors on the canonical surface, so a host minting
      `anon:<sid>` for credential-less callers applied exactly the canonical
      treatment and stayed wide open. The conformance leg red that host either
      way because it asserts the observable property — the prose and its own leg
      disagreed, and the leg was right. The env-gate governs whether a seam
      EXISTS; it does not govern who may call it.
      Found on a live tier-1 deployment (2026-08-15): the seam env-gate was
      enabled in production and a seam answered an UNAUTHENTICATED request from
      the public internet with real seam JSON, while the registration path
      logged "test seam ENABLED — NEVER enable in production". Staging is keyed
      on `nodeId`, which is not a secret — node ids ship inside chain packs.
      (An earlier account said the route performed no tenant resolution at all;
      the reporter retracted that within the hour. Auth RUNS and SUCCEEDS,
      minting an anonymous session — which is precisely why the requirement is
      non-anonymous rather than "same as canonical".)
      The replay consequence is what makes this protocol-tier rather than
      operational: a staged mock program makes a replay diverge deliberately, so
      an unauthenticated caller could switch off the byte-equivalence
      `replay.md` §C.2 requires — and any host advertising
      `replay.sideEffectSuppression: "recorded-outcome"` would be claiming a
      guarantee a stranger can revoke.
      The companion clause forbids counting two controls that read the same
      switch as two layers: an env-gate on registration plus an in-code guard on
      the same variable is ONE control with two call sites.
      The scenario probes the canonical seam prefix unauthenticated and asserts
      the shape of the answer — never a 200. A host with no seams enabled
      answers 404 and passes correctly. It carries a non-zero-probe guard so it
      cannot pass by having issued no requests.

  # ── RFC 0152 / 0153 named invariants, registered 2026-08-16 once a genuine
