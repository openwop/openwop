# openwop Security Invariants Index
#
# Each entry maps a security invariant from the threat models to one or
# more test files that verify it. The CI gate at
# `scripts/check-security-invariants.sh` reads this file and ensures
# every protocol-tier invariant has at least one matching test.
#
# Each entry has:
#   id:           unique invariant ID (matches the threat-model entry)
#   tier:         "protocol" (verifiable via conformance suite, must
#                 have a public-repo test) or "reference-impl"
#                 (verifiable only via the reference impl's own CI)
#   severity:     "critical" / "high" / "medium" / "low"
#   threat_model: which threat model file documents the invariant
#   tests:        list of file globs (relative to repo root). At least
#                 one matching file MUST exist in the public repo for
#                 protocol-tier invariants. For reference-impl-tier
#                 invariants, this may be [] when the implementation-specific
#                 tests live outside the public OpenWOP protocol repository.
#                 Pointer convention (2026-06 monorepo split): a test or
#                 source pointer that lives in a sibling repository is
#                 written repo-qualified as `<repo>:<path>`, where `<repo>`
#                 is a repository under https://github.com/openwop — e.g.
#                 `openwop-examples:examples/hosts/postgres/test/byok-roundtrip.test.ts`,
#                 `openwop-app:backend/typescript/test/untrusted-marker.test.ts`,
#                 `openwop-registry:registry/scripts/verify-signatures.mjs`.
#                 The same convention applies to paths cited in `note:` prose.
#                 Repo-qualified pointers document the sibling repo's own CI
#                 surface; the CI gate here only resolves bare in-repo globs,
#                 and only for protocol-tier invariants.
#   note:         optional human-readable annotation
#
# Adding an invariant:
#   1. Add the invariant to its threat model with a unique ID.
#   2. Add an entry here.
#   3. If protocol-tier, ensure at least one test glob resolves.
#   4. The CI gate verifies on every push.
#
# Removing an invariant requires an RFC per RFCS/0001-rfc-process.md
# because invariants are part of the security commitment.
---

invariants:
  # ===== Secret Leakage =====

  - id: secret-leakage-eventlog-payload
    tier: protocol
    severity: critical
    threat_model: SECURITY/threat-model-secret-leakage.md
    tests:
      - conformance/src/scenarios/redaction.test.ts
    note: |
      Persisted event payloads MUST NOT contain raw key material.
      Applies to ALL `RunEventType` kinds — most notably the two
      free-form-reasoning event types `agent.reasoned` (RFC 0002 §B)
      and `agent.reasoning.delta` (RFC 0024 streaming sibling), where
      a model can echo a host-resolved credential it saw during
      tool-using or prompt-handling. The host's `ctx.emit` plumbing MUST
      route every payload through the host-internal redaction layer
      before persistence (reference impl: `stripSecretsFromPersisted`
      in `openwop-app:backend/typescript/src/byok/ephemeralRunSecrets.ts`,
      wrapped at `executor.ts:emit`). Conformance scenario drives canaries
      through every persistence surface and asserts no leak.

  - id: prompt-composed-secret-redaction
    tier: protocol
    severity: critical
    threat_model: SECURITY/threat-model-secret-leakage.md
    tests:
      - conformance/src/scenarios/prompt-composed-secret-redaction.test.ts
    note: |
      RFC 0027 §E. When a host advertises
      `capabilities.prompts.supported: true` AND
      `capabilities.prompts.observability: "full"`, any variable whose
      declared `source` is `secret` MUST appear as
      `[REDACTED:<credentialRef>]` in the emitted `prompt.composed`
      event's `systemPrompt`, `userPrompt`, and `variableBindings`
      fields — never as the plaintext secret value. The reference impl
      enforces this in
      `openwop-app:backend/typescript/src/host/promptCompose.ts`
      `resolveBinding()`: for secret-source bindings, the resolver
      asserts the secret exists in the BYOK store (via `resolveSecret`)
      but emits ONLY the `[REDACTED:<id>]` marker into the
      observability projection. The plaintext value MAY be inlined
      into the dispatched body at LLM-call time, but MUST NOT appear
      in any `prompt.composed` event-log entry.

  - id: prompt-composed-trust-marker
    tier: protocol
    severity: high
    threat_model: SECURITY/threat-model-prompt-injection.md
    tests:
      - conformance/src/scenarios/prompt-composed-trust-marker.test.ts
    note: |
      RFC 0027 §E + RFC 0020 §D. When ANY binding contributing to a
      composed PromptTemplate carries `meta.contentTrust: "untrusted"`,
      the emitted `prompt.composed` payload MUST set
      `contentTrust: "untrusted"` AND wrap the untrusted segments
      within `systemPrompt` / `userPrompt` in
      `<UNTRUSTED>...</UNTRUSTED>` markers per
      `SECURITY/threat-model-prompt-injection.md`. The marker
      preservation is what lets downstream LLM-system prompts
      distinguish trusted vs. untrusted segments at dispatch time.
      Reference impl wraps in `promptCompose.ts` `resolveBinding()`;
      aggregation logic at the top of `composePromptTemplate()`
      promotes top-level `contentTrust` to `"untrusted"` if ANY
      binding carries the flag.

  - id: envelope-reasoning-secret-redaction
    tier: protocol
    severity: high
    threat_model: SECURITY/threat-model-secret-leakage.md
    tests:
      - conformance/src/scenarios/envelope-reasoning-secret-redaction.test.ts
    note: |
      RFC 0030 §A + §E. When a host advertises
      `capabilities.envelopes.reasoning.supported: true` AND processes
      an envelope whose `reasoning` field contains a known
      `secret:`-prefixed substring, the substring MUST NOT appear in:
        - The emitted envelope's `reasoning` field as persisted in
          `RunEventDoc.payload`.
        - OTel span attributes (`openwop.envelope.*`).
        - The debug-bundle export.
      The reasoning field is subject to the same SR-1 redaction harness
      applied to other envelope payload fields per `ai-envelope.md`
      §"Redaction (SR-1 carry-forward)". The model can hallucinate
      secret-shaped substrings from in-context examples, tool results,
      or prior turns; if `reasoning` is persisted without scrubbing,
      BYOK keys leak. Gate timing: lands alongside reference-host
      emission per the RFC 0027 §G staging precedent.

  - id: model-capability-substituted-no-credential-disclosure
    tier: protocol
    severity: medium
    threat_model: SECURITY/threat-model-secret-leakage.md
    tests:
      - conformance/src/scenarios/model-capability-substituted.test.ts
    note: |
      RFC 0031 §F. Hosts emitting `model.capability.substituted` MAY
      redact the `fallbackProvider` and `fallbackModel` fields when
      workspace policy treats multi-vendor posture as confidential.
      Redaction MUST be all-or-nothing for the pair (both fields
      redacted as `"[REDACTED]"`) so consumers can detect redaction
      without ambiguity. `nodeId`, `originalProvider`, `originalModel`,
      and `missingCapabilities` MUST NOT be redacted — they carry no
      provider-possession information beyond what the run-creation
      request already disclosed via `RunOptions.configurable.ai.provider`.
      Severity is `medium` (not `high`) because: (a) the `originalProvider`
      is already public via `RunOptions.configurable`; (b) the fact
      that a host has *some* fallback configured is conventionally
      public via `capabilities.modelCapabilities.substitutionSupported:
      true`. The hidden bit is which specific fallback fired for a given
      dispatch — workspace-internal info that some operators prefer to
      keep private. Gate timing: lands alongside reference-host emission.

  - id: self-hosted-endpoint-no-disclosure
    tier: protocol
    severity: medium
    threat_model: SECURITY/threat-model-secret-leakage.md
    tests:
      - conformance/src/scenarios/aiproviders-selfhosted-shape.test.ts
      - conformance/src/scenarios/aiproviders-selfhosted-honesty.test.ts
    note: |
      RFC 0108 §A.3: the network location (scheme, host, port, path, base-URL)
      of an `aiProviders.selfHosted[]` endpoint is operator-private
      infrastructure and MUST NOT appear on any wire surface — the capabilities
      document, any run.* event payload, error envelopes, the debug bundle,
      exports, or replay state. The provider id is an opaque host-chosen label
      and MUST NOT encode the endpoint URL. Disclosing the endpoint leaks
      internal network topology and enables SSRF reconnaissance against the
      operator's network. Distinct from credential-payload-redaction (RFC 0046):
      the endpoint URL is not a credential, but it is private infrastructure.
      The shape scenario statically asserts no `selfHosted[]` id is URL-shaped
      (no `://`, bare `host:port`, or leading `/` path); the Active→Accepted
      honesty scenario asserts the endpoint location appears in no run.* event
      or error payload.

  - id: subscription-credential-user-scope-only
    tier: protocol
    severity: high
    threat_model: SECURITY/threat-model-provider-policy.md
    tests:
      - conformance/src/scenarios/aiproviders-subscription-scope.test.ts
    note: |
      RFC 0121 §B clause 8: a credential resolved under
      `aiProviders.authModes` "subscription" mode MUST be bound to
      host.credentials (RFC 0046) scope:"user" and MUST NOT be resolvable at
      tenant/workspace scope. A host that permits tenant-scope binding of a
      personal-subscription credential both violates the credential owner's
      individual-seat subscription terms and creates an unaudited multi-user
      sharing surface. A binding attempt at tenant/workspace scope MUST be
      rejected with the canonical `credential_scope_forbidden` error code.
      Distinct from credential-payload-redaction (RFC 0046): this invariant is
      about scope binding, not payload disclosure. The shape scenario statically
      asserts the "subscription" enum value is present + a subscription provider
      appears in `byok`; the Active→Accepted behavioral leg (OPENWOP_REQUIRE_BEHAVIOR)
      asserts a tenant-scope binding is rejected with `credential_scope_forbidden`.
      COVERAGE BOUNDARY: "MUST NOT be resolvable at tenant/workspace scope" binds the
      STORAGE/resolve tenant, not just the request `scope` field. The black-box leg
      proves only the request-scope REJECTION; where an accepted `scope:"user"` bind
      is actually stored is host-test territory (a host can pass the wire rail yet
      write the personal credential to a shared-workspace row — see
      docs/KNOWN-LIMITS.md "Behavior tests too coarse"). Enforce BOTH: reject the
      request scope AND bind storage to the caller's own user tenant.

  - id: runner-credential-non-transit
    tier: protocol
    severity: critical
    threat_model: SECURITY/threat-model-secret-leakage.md
    tests:
      - conformance/src/scenarios/self-hosted-runner.test.ts
    note: |
      RFC 0122 §Behavior clause 2: a self-hosted runner's local credential (a
      subscription CLI login per RFC 0121, a private endpoint key per RFC 0108)
      is held on the user's runner and MUST NOT transit the host. It MUST NOT
      appear in any `SelfHostedRunnerDispatchFrame` or `SelfHostedRunnerResultFrame`,
      run.* event payload, run result, debug bundle, export, replay state, or log.
      The host sends `inputs` and receives `output`; it never sees the credential
      (the whole point of execution locality — a hosted control plane using compute
      + credentials that exist only on the user's machine). This is the runner-channel
      analog of the BYOK SR-1 credential-non-transit rule (cross-references
      secret-leakage-eventlog-payload / credential-payload-redaction). The frame
      schemas are `additionalProperties:false`, so a runner cannot smuggle a
      credential field onto a result frame; the behavioral leg (OPENWOP_REQUIRE_BEHAVIOR)
      asserts a dispatch/result round-trip carries no credential material on any
      observable surface.

  - id: runner-output-untrusted-transport
    tier: protocol
    severity: high
    threat_model: SECURITY/threat-model-prompt-injection.md
    tests:
      - conformance/src/scenarios/self-hosted-runner.test.ts
    note: |
      RFC 0122 §Behavior clause 3: a host MUST treat a runner as untrusted
      transport. Runner-returned `output` re-entering an agent loop MUST be fenced
      as untrusted (wrapped `<UNTRUSTED>` in the next LLM turn), consistent with the
      existing tool-output fencing requirement — a runner is a user-controlled
      process whose output is attacker-influenceable, so it carries the same
      prompt-injection exposure as pack output (cross-references
      node-pack-output-untrusted / prompt-injection-* ids). The behavioral leg
      (OPENWOP_REQUIRE_BEHAVIOR) asserts runner output re-entering an agent loop is
      marked untrusted, not trusted host-origin content.

  - id: media-asset-url-tenant-scoped
    tier: protocol
    severity: critical
    threat_model: SECURITY/threat-model-secret-leakage.md
    tests:
      - conformance/src/scenarios/media-url-inline-cap.test.ts
    note: |
      RFC 0055 §C rule 1 + 4. A host that emits `media.{image,audio,file}`
      envelope kinds MUST scope every served asset `url` to the run's tenant
      and MUST NOT make it globally guessable (signed-URL / capability-token
      discipline — reuse the interrupt signed-token recipe). An asset URL
      minted for tenant A's run MUST NOT resolve for, or appear in any
      discovery/event view of, tenant B. Inline base64 above the host's
      `capabilities.aiProviders.maxInlineMediaBytes` cap (default 256 KiB,
      §C rule 2) MUST be replaced by a `url` reference so event-log/replay
      payloads stay bounded and portable. `media-url-inline-cap.test.ts`
      carries the advertisement-shape probe now; the cross-tenant + cap
      behavioral assertions soft-skip until a reference host wires asset
      serving (greenfield — staged per the RFC 0027 §G precedent).

  - id: envelope-refusal-no-prompt-leak
    tier: protocol
    severity: high
    threat_model: SECURITY/threat-model-prompt-injection.md
    tests:
      - conformance/src/scenarios/envelope-refusal-shape.test.ts
    note: |
      RFC 0032 §B.3 + §D + §G. `envelope.refusal.refusalText` MUST be
      passed through the host's BYOK redaction harness AND the
      prompt-content redaction pipeline before emission. Provider
      safety-refusal messages can echo offending prompt substrings;
      emitting them verbatim would create a side channel for
      prompt-injection-attack telemetry exfiltration AND for SR-1
      secret-leak. Hosts SHOULD also exclude `refusalText` from the
      OTel projection by default (operators who want refusal text in
      dashboards plumb through their own pipeline where they own the
      redaction policy). Replay consumers MUST tolerate
      `refusalText: null` even when the original was non-null. Gate
      timing: lands alongside reference-host emission per the RFC 0027
      §G staging precedent.

  - id: envelope-recovery-no-content-leak
    tier: protocol
    severity: high
    threat_model: SECURITY/threat-model-secret-leakage.md
    tests:
      - conformance/src/scenarios/envelope-recovery-applied.test.ts
    note: |
      RFC 0032 §B.6 + §G. `envelope.recovery.applied` payloads MUST NOT
      carry the recovered envelope content or any substring from the
      model's pre-recovery output. Only the recovery path identifier
      (`direct`, `jsonrepair`, `markdown-fence`, `brace-walker`,
      `custom`) and the optional `byteOffset` are emitted. The recovered
      content rides on the subsequent envelope acceptance + downstream
      `RunEventDoc`, NOT on the recovery event itself. The pre-recovery
      output can contain secret-shaped substrings the model emitted
      before lenient parsing fixed the wrapping; including any of that
      text in the event would create a secret-leak side channel that
      bypasses the normal SR-1 redaction harness (which runs on
      envelope payloads, not on parsing-error diagnostics). Gate
      timing: lands alongside reference-host emission.

  - id: artifact-schema-compile-bounded
    tier: protocol
    severity: high
    threat_model: SECURITY/threat-model-node-packs.md
    tests:
      - conformance/src/scenarios/artifact-schema-compile-bounded.test.ts
    note: |
      RFC 0071 §"Bounded schema compilation". Artifact-type packs
      (`kind: "artifact-type"`) ship third-party JSON Schemas that the
      engine compiles (Ajv) at install + validation time. A host MUST
      bound that compilation — rejecting schemas that exceed host limits
      on serialized byte size, `$ref` nesting depth, and total
      keyword/subschema count, and compiling under a wall-clock timeout —
      so a malicious or malformed pack cannot cause denial of service
      (schema bombs: pathological `$ref` recursion, keyword-count
      explosion, oversized payloads, catastrophic-backtracking `pattern`s).
      Rejection returns `pack_validation_failed`. This is the artifact-
      schema analog of the node-pack supply-chain controls. Server-free
      floor: `artifact-schema-compile-bounded.test.ts` asserts the
      normative contract is present in the corpus AND that a reference
      finite bound rejects $ref-depth / keyword-count / size bombs while
      admitting benign schemas. The behavioral end-to-end form (host
      rejects an over-bounds pack at registry `PUT`) is capability-gated
      on `host.artifactTypes.supported` and `host-pending` until a
      reference host lands.

  - id: chat-card-input-trust-boundary
    tier: protocol
    severity: high
    threat_model: SECURITY/threat-model-prompt-injection.md
    tests:
      - conformance/src/scenarios/chat-card-pack-execution.test.ts
    note: |
      RFC 0071 Phase 2 §"Trust boundary". A chat card pack (`kind: "card"`)
      composes a prompt by substituting card inputs into `prompt.template` /
      `systemPrompt`. Card inputs frequently derive from workflow run input or
      prior LLM output, which is untrusted. A host MUST treat any prompt
      segment interpolated from a card input as untrusted content: the composed
      AI envelope MUST carry `meta.contentTrust: "untrusted"` (propagated per
      `ai-envelope.md` §"Trust boundary") unless the host can assert the input
      is host-trusted. This prevents a card input from smuggling instructions
      that exfiltrate or coerce the structured output (the RFC 0071 R2 threat).
      Verified by `chat-card-pack-execution.test.ts`, which asserts trust-tag
      propagation through the documented `POST /v1/host/sample/cardpacks/execute`
      seam; capability-gated on `host.chat.cardPacks.supported` and host-pending
      until a host wires card execution (Phase 2 `Active` gate).

  - id: form-content-pack-string-trust-boundary
    tier: protocol
    severity: high
    threat_model: SECURITY/threat-model-prompt-injection.md
    tests:
      - conformance/src/scenarios/form-content-packs.test.ts
    note: |
      RFC 0137 §F1 "Trust boundary". A form-content pack (`kind: "form-content"`)
      ships PACK-AUTHORED strings — `templates[].label` / `.title` /
      `.description` / `.category` and `fields[].label` / `.description` /
      `.options[]` — that a host renders directly into its own chrome (a picker,
      a gallery card, a form heading, a field label, a dropdown option), and
      whose collected values commonly feed a downstream prompt. Those strings
      originate with a third-party author and arrive inside a signed tarball.
      A signature proves WHO authored the pack; it does NOT make the authored
      bytes trustworthy, and a host MUST NOT treat pack provenance as content
      trust. A host MUST escape or otherwise neutralize every pack-authored
      string for the target surface and MUST NOT interpret it as markup, script,
      or a templating directive; when such a string — or a value collected
      through an instantiated template — is interpolated into a prompt, the
      composed envelope MUST carry `meta.contentTrust: "untrusted"` (propagated
      per `ai-envelope.md` §"Trust boundary"), mirroring
      `chat-card-input-trust-boundary`. This prevents a published template from
      smuggling instructions into a model call — a template titled "Ignore
      previous instructions and …" is a realistic supply-chain vector precisely
      because a form template looks inert. LENGTH BOUNDS ARE NOT A TRUST
      BOUNDARY: the `maxLength` constraints in
      `form-content-pack-manifest.schema.json` are a render-bomb resource guard
      and a host MUST NOT treat bounding a string as having sanitized it.
      The always-on corpus/schema legs of `form-content-packs.test.ts` assert the
      contract server-free; the behavioral trust-tag leg is capability-gated on
      `host.forms.contentPacks` and host-pending until a host wires template
      instantiation (the `Active → Accepted` gate).

  - id: form-content-template-no-submission-routing
    tier: protocol
    severity: high
    threat_model: SECURITY/threat-model-node-packs.md
    tests:
      - conformance/src/scenarios/form-content-packs.test.ts
    note: |
      RFC 0137 §F2 "No submission routing". A form-content template describes a
      form's SHAPE; it MUST NOT describe where the resulting submissions go.
      `form-content-pack-manifest.schema.json#/$defs/FormTemplate` declares no
      destination / binding / webhook / list-id / mailbox / CRM-object property
      and rejects one via `additionalProperties: false`; a host MUST refuse to
      install a pack attempting to carry one and MUST NOT infer a destination
      from any other template field (`category` is a grouping hint, not a
      routing target). Structurally identical to
      `org-position-no-authority-escalation` (RFC 0087): the guarantee is that
      the schema carries no such field AND rejects one, which is assertable
      server-free.
      Why it is not redundant with `additionalProperties: false` alone: the
      invariant binds FUTURE evolution as well as today's shape. Should a later
      RFC introduce a routing surface, routing MUST remain a host-side decision
      made by the operator behind explicit consent at install/instantiation —
      a pack MUST NOT bind a destination unilaterally. Where a tenant's
      submissions are delivered is a decision about the OPERATOR's data,
      frequently personal data carrying legal obligations; a third-party pack
      author does not acquire that authority by shipping a signed manifest, and
      a signature confers authorship, not authority (cf.
      `form-content-pack-string-trust-boundary`).
      Verified always-on + server-free by `form-content-packs.test.ts`.

  - id: tool-result-trust-monotone
    tier: protocol
    severity: high
    threat_model: SECURITY/threat-model-prompt-injection.md
    tests:
      - conformance/src/scenarios/tool-result-trust-monotone.test.ts
    note: |
      RFC 0143 — the general rule the corpus's ~ten point-invariants instance.
      Trust over content is a meet-semilattice (`untrusted ⊏ trusted`). A tool
      result is content entering model context and is `untrusted` unless the host
      has a SPECIFIC, NAMED basis for `trusted` — "a tool ran and returned" is NOT
      a basis (registry silence ⇒ untrusted, fail-closed). The `contentTrust` of
      any composed prompt segment MUST be the MEET of its inputs' trust: one
      untrusted input ⇒ untrusted segment, and no transformation (summarize,
      format, extract, store-then-recall) may raise it. Persisting untrusted
      content and recalling it does not launder it (closes FRMD-F1-1). Satisfiable
      by (a) dynamic coarse-grained propagation OR (b) conservative static reader
      classification; value-granular taint is NOT required. Carve-out: a
      structurally-isolated reader (RFC 0035 sandbox, no egress, no model-context
      path) MAY omit the tag — trust by reader posture. A `missing ⇒ trusted`
      default at a composition site is the violation. `ai-envelope.md` §"Trust
      boundary" (MCP/A2A) and `prompt-composed-trust-marker` (compose boundary) are
      named instances. Always-on server-free legs verify a fencing invariant
      exists for every §4 content-ingress surface (completeness — no unfenced
      ingress), that the meet rule is stated normatively, and that the instances
      cross-reference the general rule; the dynamic-propagation-through-storage
      behavior is host-witnessed (openwop-app memory lane).
  - id: pack-manifest-extension-opaque
    tier: protocol
    severity: high
    threat_model: SECURITY/threat-model-node-packs.md
    tests:
      - conformance/src/scenarios/pack-manifest-extensions.test.ts
    note: |
      RFC 0138. Pack manifests carry an `^(x-|vendor\.)` host-extension escape
      hatch on the manifest root and each kind's entry object, so that
      `host-extensions.md` §"Vendor-prefixed namespaces" — "a client receiving an
      unknown vendor-prefixed field MUST treat it as opaque" — is satisfiable at
      all. Before RFC 0138 `additionalProperties: false` made such a field
      impossible to carry, so the corpus mandated a behavior for a case it
      structurally forbade.
      An extension value is PACK-AUTHORED content and is therefore UNTRUSTED,
      exactly as `form-content-pack-string-trust-boundary` treats pack-authored
      strings: a signature proves authorship, not content safety. A consumer that
      does not recognize an extension property MUST NOT render it, execute it,
      interpret it as markup or a templating directive, use it to select a code
      path, or persist it into a surface where it will later be interpreted.
      Retaining raw bytes for round-trip fidelity is permitted; ACTING on them is
      not. "Ignore" means ignore — the hatch MUST NOT become a rendering or
      execution channel, which would be strictly worse than having no hatch.
      Extension properties are also NOT a capability-negotiation channel: a host
      MUST NOT infer support from their presence, nor make handling of a
      canonical field depend on one.
      Verified always-on + server-free by `pack-manifest-extensions.test.ts`,
      which asserts every manifest admits the hatch, still rejects a misspelled
      canonical field, and that the corpus states the opacity rule normatively.

  - id: secret-leakage-eventlog-variable
    tier: reference-impl
    severity: high
    threat_model: SECURITY/threat-model-secret-leakage.md
    tests:
      - openwop-examples:examples/hosts/postgres/test/byok-roundtrip.test.ts
      - openwop-examples:examples/hosts/postgres/test/reasoning-event-emission.test.ts
    note: |
      Sensitive workflow variables MUST be masked per host's advertised
      compliance.defaultMode. Verified in reference impl; conformance
      implementation-specific coverage is enforced by conformant hosts.

  - id: secret-leakage-otel-exception
    tier: protocol
    severity: critical
    threat_model: SECURITY/threat-model-secret-leakage.md
    tests:
      - conformance/src/scenarios/redaction.test.ts
    note: |
      Error.message and Error.stack sanitized before recordException.
      Host implementations must apply the same redaction contract to their
      telemetry exporters.

  - id: secret-leakage-otel-attribute
    tier: protocol
    severity: high
    threat_model: SECURITY/threat-model-secret-leakage.md
    tests:
      - conformance/src/scenarios/envelope-reasoning-secret-redaction.test.ts
      - conformance/src/scenarios/secret-leakage-otel-attribute.test.ts
      - conformance/src/scenarios/otel-collector-canary-inspection.test.ts
    note: |
      Graduated reference-impl → protocol on 2026-05-21 via RFC 0034 §C:
      conformance gates on capabilities.observability.testSeams.otelScrape;
      advertising hosts MUST serve GET /v1/host/sample/test/otel/spans
      returning span attributes that do not echo the BYOK canary. Three
      complementary conformance probes cover this invariant:
      `envelope-reasoning-secret-redaction.test.ts` (narrow — envelope
