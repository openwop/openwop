  # is non-testable in the public repo until the first reference host
  # executes pack-loaded typeIds in a sandbox. The Postgres reference
  # host's pack-consumer.ts (PACK-1/PACK-2) verifies install-time
  # security (SRI + Ed25519 + version drift + lockfile parse) but
