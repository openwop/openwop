  - id: http-client-ssrf-guard
    tier: protocol
    severity: critical
    threat_model: SECURITY/threat-model-secret-leakage.md
    tests:
      - conformance/src/scenarios/http-client-ssrf.test.ts
    note: |
      Hosts advertising `capabilities.httpClient` MUST declare
      `ssrfGuard: true` AND `maxResponseBodyBytes` (a positive integer).
      Without an SSRF guard, an authenticated tenant can submit a
      workflow whose `core.http.request` node probes deployer-internal
      addresses (AWS metadata service, internal Redis/Postgres, etc.).
      Without a body-size cap, a hostile upstream can OOM the host
      by streaming unbounded responses into per-run variables. Both
      defenses are reference-impl-tested in
      `openwop-examples:examples/hosts/postgres/test/http-client.test.ts`; this
      protocol-tier invariant asserts the advertisement contract so
      independent implementers cannot ship a partial guard silently.

  # ===== Idempotency-Key determinism (1.1.2 safety-fix) =====
    witness: witnessable-unaided
    witnessReview: initial-mechanical-2026-09-02

  - id: idempotency-key-deterministic
    tier: protocol
    severity: high
    threat_model: SECURITY/threat-model-secret-leakage.md
    tests:
      - conformance/src/scenarios/idempotency-key-determinism.test.ts
    note: |
      `core.openwop.http.idempotency-key` MUST be deterministic in
      `(runId, nodeId, payload)` — same logical request → same key, so
      the remote endpoint can dedupe across retries. Verified against
      the canonical SHA-256 formula
      `sha256(runId || \0 || nodeId || \0 || JSON.stringify(payload))`
      with output shape `openwop-<sha256-prefix-16>` per the 1.1.2
      schemas.
      Hardens against the 1.1.0/1.1.1 defect where the default `uuid`
      mode returned `randomUUID()` per call (each retry got a fresh key
      → remote service treated every attempt as a new request, the
      opposite of retry-safety). Removed in 1.1.2 as a safety-fix per
      `COMPATIBILITY.md §3`; calls with `mode: "uuid"` now reject with
      `CONFIG_INVALID`. The cross-impl vector test in the scenario lets
      third-party `core.openwop.http` reimplementations verify wire
      agreement on a fixed set of (runId, nodeId, payload) inputs.
    witness: claims-check
    witnessReview: initial-mechanical-2026-09-02

  - id: idempotency-key-tenant-endpoint-scoped
    tier: protocol
    severity: high
    threat_model: SECURITY/threat-model-secret-leakage.md
    tests:
      - conformance/src/scenarios/idempotency.test.ts
      - conformance/src/scenarios/idempotencyRetry.test.ts
    note: |
      RFC 0150 §A / `spec/v1/idempotency.md` §"Record shape, digest, and
      lease". The Layer-1 record MUST be keyed by
      `(authenticatedTenantId, canonicalEndpointId, callerIdempotencyKey)`
      with the tenant taken from the AUTHENTICATED context, never the body.
      A body-supplied tenant lets a caller address another tenant's
      idempotency records: replaying a victim tenant's cached response, or
      planting a record that suppresses the victim's next request. The
      endpoint component is the ROUTED operation, so two spellings of one
      path cannot be used to escape a record.
      Paired rule, same section: a different `requestDigest` under the same
      scoped key MUST fail `409 idempotency_key_mismatch` and MUST NOT
      return the cached body — answering a question the caller did not ask
      is the read half of the same confusion.
      Registered 2026-08-18 (SP-03). RFC 0150's acceptance box claimed
      three invariants "across §A/§B/§D" while only §B
      (`logical-effect-id-retry-stable`) and §D
      (`multi-region-stale-owner-no-effect`) were registered; §A's was
      named in the RFC and never landed. The §A keyspace-separation rule
      is the SEPARATE invariant below, whose witness is not black-box.
    witness: witnessable-gated
    witnessReview: initial-mechanical-2026-09-02

  - id: idempotency-store-no-host-generated-keys
    tier: reference-impl
    severity: high
    threat_model: SECURITY/threat-model-secret-leakage.md
    tests:
      - conformance/src/scenarios/idempotency.test.ts
    note: |
      RFC 0150 §A / `spec/v1/idempotency.md` §"Keyspace separation". A
      caller-supplied `Idempotency-Key` MUST NOT be able to name, claim, or
      suppress a host-generated lock — internal locks, scheduler fire-once
      slots, or any key the host mints for itself MUST NOT share a keyspace
      with caller keys. Reported by a tier-1 host that kept both in one
      table: because `Idempotency-Key` is caller-controlled and validated
      nowhere, any authenticated tenant could send
      `Idempotency-Key: schedule-fire:<jobId>:<slot>`, win the scheduler's
      row, and make a scheduled job SKIP. That is privilege escalation
      through an unvalidated header.
      **Witness is NOT black-box** — "shares no keyspace" is a storage-layout
      property no wire probe can see. The observable projection is that a
      caller-supplied key MUST NOT affect an operation the caller did not
      initiate, which needs a host-sample seam to exercise. Absent one this
      is reference-impl tier, and RFC 0150 records it as gap G8. Saying so
      is preferable to a scenario that passes without executing
      (RFC 0148 §A). The listed test covers the caller-lane keying only.
    witness: witnessable-gated
    witnessReview: initial-mechanical-2026-09-02

  - id: logical-effect-id-retry-stable
    tier: protocol
    severity: high
    threat_model: SECURITY/threat-model-secret-leakage.md
    tests:
      - conformance/src/coherence/effect-identity-composition.test.ts
    note: |
      RFC 0150 §B. The Layer-2 logical effect identity MUST NOT
      incorporate the retry counter. `spec/v1/idempotency.md` §"Idempotency
      key composition" specified
      `sha256(runId ':' nodeId ':' attempt ':' providerKey)` through v1.1,
      so every retry hashed to a NEW key: the invocation log never hit,
      the injected `Idempotency-Key` differed from the one the provider
      had already seen, and the provider's own dedup was defeated along
      with the engine's. The composition guaranteed a duplicate side
      effect — a duplicate charge, send, or completion — on exactly the
      retry path Layer 2 exists to protect.
      This is the SAME defect as `idempotency-key-deterministic` above,
      one layer down. That one was caught in the `core.openwop.http` node
      pack and fixed at 1.1.2; the protocol's own Layer-2 formula kept it
      for another eight months because both halves of the contradiction
      were prose — the formula, and the §"Composition" paragraph promising
      that a retried call's identity "is identical". Nothing in the corpus
      parsed the formula or cross-read the two.
      Retired as a safety-fix per `COMPATIBILITY.md §3`; v1.2 specifies the
      domain-separated, tenant-bound v2 composition over
      `logicalInvocationOrdinal`, which is assigned once per logical
      activity and MUST NOT change across retries.
      Witness tier is corpus-structural, and deliberately labelled as such:
      the scenario reads the normative composition, it does not observe a
      host. Whether a given engine actually reuses the identity across an
      internal retry is not black-box visible — the injected header is seen
      by the provider, not by the caller — so a wire probe claiming to
      prove it would be the vacuous-witness pattern RFC 0148 §A exists to
      close. Recorded as gap G9.
    witness: claims-check
    witnessReview: initial-mechanical-2026-09-02

  - id: layer2-invocation-claim-atomic
    tier: protocol
    severity: high
    threat_model: SECURITY/threat-model-compensation.md
    tests:
      - conformance/src/scenarios/idempotency-concurrent-claim.test.ts
    note: |
      RFC 0150 §B / `spec/v1/idempotency.md` §"Concurrent duplicates
      (Layer 2)" (v1.7). The persist that guards a side effect MUST be an
      **atomic claim** — a compare-and-set / insert-if-absent that at most
      one executor can win — not a read-then-write. The clause is
      unconditional and explicitly reaches a single-instance deployment:
      the orphan sweeper re-dispatching a run whose owner is stalled but
      still alive races the original without a second host.
      Reported 2026-09-01 by a tier-1 host that had exactly the named
      shape: read the invocation log, deliver, then
      `INSERT OR REPLACE INTO invocation_log`. `INSERT OR REPLACE` is the
      precise inverse of an atomic claim — it always wins and never
      reports a conflict, so the "and the other observes the hit" half of
      the rule cannot happen and both executors fire. Their outcome was
      protected at the time, but by a lease longer than the maximum run
      rather than by the mechanism this rule names, so the defect was
      latent behind an unrelated constant.
      **Witness is NOT black-box, and nothing else covered it.** Driving
      it requires two executors of ONE run concurrently reaching the same
      effect seam, which the suite cannot cause without a host seam — a
      wire probe asserting it would be the vacuous-witness pattern
      RFC 0148 §A exists to close. The row that WOULD cover it,
      RFC 0158 §Conformance `durability/duplicate-delivery` ("fires each
      effect exactly once, asserted per effect identity"), is (a) not
      implemented in `conformance/src/scenarios/` and (b) not named in any
      rung's required evidence — `durable-single-instance` requires only
      `kill-after-accept` and `kill-during-execution`. So a host can hold
      that rung honestly while violating this MUST, which is what
      happened. Five of RFC 0158's six conformance rows have no scenario
      at all; only `poison-exhaustion` does.
      **Gap G17 — witness landed 2026-09-03.** `host-sample-test-seams.md`
      §25 specifies a concurrent duplicate-delivery driver and
      `idempotency-concurrent-claim.test.ts` drives it, so this moves
      reference-impl -> protocol tier. The scenario asserts TWO things and
      the second is why it is not decoration: every executor must mint the
      SAME `logicalInvocationId`, checked BEFORE the delivery count. A host
      passes `delivered === 1` trivially by minting different identities
      and never colliding — one effect because nothing raced — which is a
      vacuous pass wearing a green check.
      Deliberately NOT profile-gated, so it cannot be opted out: the
      obligation is unconditional, so no host may declare it inapplicable,
      and flipping an unwitnessed MUST to pass-by-opt-out is what the
      opt-out list must never be used for. A host that does not mount the
      seam records `blocked` — applies, unwitnessed, NOT certifiable —
      which is the honest disposition and keeps the reference-host soak
      green without anyone claiming the requirement was met.
      The race was thought unreproducible in-process on the reporting host
      because its emitter noted that the shared ordinal counter hands a
      second emit a different identity. True of two SEQUENTIAL emits, and
      it stood as a reason not to try: identity minting runs synchronously
      before the first await, so two UN-AWAITED calls mint the same
      ordinal — which is what a real re-dispatch does, each executor
      re-executing the node from the start. Measured there: 2 effects
      without the claim, 1 with it.
    witness: seam-gated
    witnessReview: initial-mechanical-2026-09-03

  - id: multi-region-stale-owner-no-effect
    tier: protocol
    severity: high
    threat_model: SECURITY/threat-model-secret-leakage.md
    tests:
      - conformance/src/coherence/multi-region-effect-vocabulary.test.ts
    note: |
      RFC 0150 §D. Run-record reconciliation MUST NOT be treated as
      authorizing an external effect. Lexicographic run-ID reconciliation
      MAY select a surviving record; it says nothing about how many times
      a charge was posted or a message sent while the partition was open,
      and cancelling the losing run does not un-send anything.
      A host claiming multi-region effect safety MUST obtain a
      monotonically increasing fencing token from a linearizable ownership
      service before issuing an effect, and the adapter MUST either reject
      a stale token or issue to a provider guaranteeing duplicate
      suppression under the stable `logicalInvocationId`. Absent either,
      the host MUST NOT claim `fenced-effects` and MUST classify the
      effect `at-least-once-risk` — required rather than optional because
      an effect KNOWN to be at-least-once can be made safe downstream,
      while one BELIEVED exactly-once cannot, since nobody writes the
      compensating control.
      Two vocabulary defects removed as safety-fixes in the same pass.
      (1) `crossRegion: "strict"` promised only that read-visibility was
      bounded by `multiRegion.replicationLagBoundMs` — a LATENCY claim
      occupying the top slot of a ladder implementers read as effect
      safety. A host replicating at 0 ms can still issue duplicate effects
      from two regions. Removed rather than renamed to `fenced-effects`,
      because a rename would have promoted every existing `strict`
      advertisement into a claim no host substantiated; the latency
      content is not lost, `replicationLagBoundMs` already carries it.
      (2) `partitionRecoveryStrategy` offered `last-writer-wins` and
      `first-writer-wins`, both time-ordered. Under a partition there is
      no shared clock, so each region believes it wrote last, which cannot
      satisfy the annex MUST that "re-running the same conflict input MUST
      produce the same survivor" — and both select a different survivor
      than the lex-min(runId) rule the same document requires. The schema
      was advertising strategies that violate two MUSTs already in force.
      RFC 0150 §D names only `last-writer-wins`; removing that alone would
      have left the identical defect under a different label, so both went
      and `lexicographic-min-run-id` was added to name the required rule.
      Witness tier is corpus-structural, labelled as such: the scenario
      reads the schema and the prose, not a host. Whether an engine
      actually fences before issuing an effect needs a partition
      simulator plus an observable effect sink; the existing
      `POST /v1/host/sample/test/multi-region/simulate-partition` seam
      covers record convergence only. Recorded as an open row in RFC
      0150's gap register.
    witness: claims-check
    witnessReview: initial-mechanical-2026-09-02

  - id: discovery-canonical-family-no-shadow
    tier: protocol
    severity: high
    threat_model: SECURITY/threat-model-secret-leakage.md
    tests:
      - conformance/src/coherence/discovery-canonical-family-no-shadow.test.ts
    note: |
      RFC 0149 §E. A vendor extension MUST NOT shadow a canonical
      capability family. RFC 0073 puts canonical families at the document
      root and `host-extensions.md` §"Canonical prefixes" puts vendor
      surface under `x-host-<vendor>-*`, `vendor.<org>.*`, or
      `private.<host>.*`; together those make discovery negotiable,
      because a consumer reads the root for what the protocol defines and
      treats a namespaced key as opaque.
      Nothing forbade a canonical family name appearing INSIDE the
      namespaced region — `vendor.acme.auth`, or an `x-host-acme-*` object
      carrying its own `interrupts`. A consumer that merges vendor surface
      over the root before negotiating then reads a vendor's `auth` block
      as THE auth contract. `host-extensions.md` already tells clients to
      treat extension surface as opaque, but that binds the CONSUMER; it
      does not stop a host from publishing the collision, and the consumer
      that gets the merge order wrong is exactly the one the rule exists
      to protect.
      Second clause, separate and unconditional: no discovery example may
      carry credentials or tenant data. Discovery is served credential-free
      to anonymous callers (RFC 0100 requires `agentCardUrl` to GET-resolve
      without credentials), so a real-shaped secret in an example sits in
      the most-copied, least-guarded artifact in the corpus.
      Structural and server-free — it reads the schema and the fenced
      examples, never a host. The family list is READ from
      `capabilities.schema.json` rather than hand-listed, so a new family
      is covered the day it lands.
      The corpus was already clean when this landed, which makes it a
      guardrail rather than a repair — and therefore one that MUST be
      shown able to fail. Sabotage-verified: injecting
      `"vendor.acme.suite": { "auth": ... }` reds the shadow leg with its
      file:line and the colliding key, and injecting credential material
      reds the credential leg with the truncated match and the axis that
      caught it.
      LIMITATION, stated because the first version of this gate had it and
      the label did not cover it: credential detection runs on THREE axes
      with different failure modes, and NONE of them closes the claim.
      (1) known issuer prefixes — blind to every format not listed;
      (2) the property NAME claiming to hold a credential, with placeholder
      exclusion — blind to unconventional names; (3) dense high-entropy
      material with no word structure — blind to low-entropy secrets and to
      anything carrying separators. Axis 1 alone is a negative existence
      claim established by grepping the vocabulary its author chose, which
      reports clean on the formats nobody thought of in the confident tone
      of a real check — the vacuous-witness pattern wearing a different hat.
      The three fail differently; that is the most that can be said, and it
      is said here rather than implied by a green run. Each axis is
      independently sabotage-verified.
    witness: claims-check
    witnessReview: initial-mechanical-2026-09-02

  - id: a2a-version-no-silent-downgrade
    tier: protocol
    severity: high
    threat_model: SECURITY/threat-model-secret-leakage.md
    tests:
      - conformance/src/scenarios/a2a-version-negotiation.test.ts
    note: |
      RFC 0152 §B. A host MUST NOT silently downgrade an authenticated
      request. The danger is that a silent downgrade SUCCEEDS: the caller
      believes it negotiated 1.0, the peer answered 0.3, and nothing in
      the response says otherwise. A failure would at least be visible.
      The scenario permits either honest outcome — refuse, or downgrade
      explicitly — and forbids only the dishonest one: a host that
      proceeds MUST report the version it actually negotiated, and the
      wire `A2A-Version` header MUST match what it reported.
      Witnessed against `A2AFakePeer`, which had to be extended to record
      request headers at all: it captured method, path, rpcMethod, and
      body, and §B lives entirely in the headers.
    witness: seam-gated
    witnessReview: reviewed-2026-09-02

  - id: mcp-version-no-silent-downgrade
    tier: protocol
    severity: high
    threat_model: SECURITY/threat-model-secret-leakage.md
    tests:
      - conformance/src/scenarios/mcp-version-negotiation.test.ts
    note: |
      RFC 0153 §A/§B, the MCP half of the above. Additionally: the
      revision on the wire MUST be MCP's date form, because `latest` or
      `2026-7-28` is unmatchable against a pinned peer and the failure
      then surfaces at the peer rather than at the handshake meant to
      prevent it. And the negotiated revision MUST appear in
      `protocolVersions` — a host negotiating a revision it never
      advertised has made its own discovery document unreliable, which is
      worse than advertising nothing, because a consumer read it and
      decided on a fact that was not true.
      `McpFakeServer` had the identical header-capture gap as its A2A
      counterpart; both recorded the call body and discarded the headers.
    witness: seam-gated
    witnessReview: reviewed-2026-09-02

  - id: replay-fanout-no-refire
    tier: protocol
    severity: high
    threat_model: SECURITY/threat-model-replay.md
    tests:
      - conformance/src/scenarios/replay-fanout-suppression.test.ts
    note: |
      `replay.md` §"Host-initiated fan-out is an external effect". A host that
      projects its event log outward — webhook delivery, outbound streams,
      analytics or audit sinks — MUST NOT emit those deliveries for events a
      `mode: "replay"` fork re-emits as fixed history. Replay-ness MUST be read
      from the RUN, never from the event type.
      Subscriber-side defences cannot cover this: a re-emitted event legitimately
      carries a fresh envelope `eventId`, and webhook dedup keys on
      `(subscriptionId, eventId)` — so a CORRECT re-emission defeats dedup by
      construction, and the delivery is authentic in every respect a receiver can
      check. The false claim is carried by the act of delivering, not by the body.
      Capability-gated on `webhooks.supported` and OUTSIDE every profile floor: a
      host whose SSRF guard refuses the suite's loopback receiver records
      `blocked`, which means UNOBSERVABLE, not unmet.
    witness: witnessable-gated
    witnessReview: initial-mechanical-2026-09-02
  - id: compensation-replay-no-refire
    tier: protocol
    severity: high
    threat_model: SECURITY/threat-model-compensation.md
    tests:
