    note: |
      RFC 0151 §F. Replay defaults MUST use recorded compensation
      outcomes and MUST NOT re-fire inverse effects. A replay that
      re-executes them turns a recovery into a second outage — the
      operator is running replay precisely because something already went
      wrong, and re-firing compounds it.
      Capability-gated on `compensation.supported`; resolves to `blocked`
      per RFC 0148 §A until a host advertises and wires the unwind seam.
