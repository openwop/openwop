  # ===== RFC 0059 host.workspace cross-tenant·workspace isolation =====

  - id: workspace-cross-tenant-isolation
    tier: protocol
    severity: critical
    threat_model: SECURITY/threat-model-secret-leakage.md
    tests:
      - conformance/src/scenarios/workspace-cross-tenant-isolation.test.ts
      - conformance/src/scenarios/workspace-cross-tenant-isolation-blackbox.test.ts
    note: |
      RFC 0059 §E WCT-1: hosts advertising `capabilities.workspace.supported`
      MUST scope every file to a single `{tenant, workspace}` (RFC 0048). No
      `get` or `list` against a workspace owned by `{T, W}` MAY return a file
      owned by `{T′, W′} ≠ {T, W}`, regardless of the caller's permissions
      elsewhere. The owner binding MUST come from the authenticated identity,
      not caller-supplied scope hints (fail-closed); errors MUST NOT leak the
      existence of another owner's file (`404` over `403`). Mirrors
      `agent-memory-cti-1` / `kv-cross-tenant-isolation`. Two tests back this:
      the single-credential `workspace-cross-tenant-isolation.test.ts` (the
      `/v1/host/sample/workspace/op` seam) AND `-blackbox.test.ts` (2026-05-31)
      which drives the NORMATIVE §C `PUT`/`GET /v1/host/workspace/files`
      endpoints with TWO operator credentials (`OPENWOP_TEST_TENANT_B_API_KEY`)
      — the production-path proof that graduates this surface into the
      `openwop-core-standard` floor (RFC 0088 §D Lever-2), no seam.

  # ===== RFC 0063 core.subWorkflow output-merge approval fail-closed =====

  - id: subrun-merge-approval-fail-closed
    tier: protocol
    severity: critical
    threat_model: SECURITY/threat-model-prompt-injection.md
    tests:
      - conformance/src/scenarios/subrun-approval-fail-closed.test.ts
    note: |
      RFC 0063 §C: when a `core.subWorkflow` declares `outputAttestation.
      requireApproval: true`, the host MUST suspend via an RFC 0051 `approval`
      interrupt BEFORE `outputMapping` and merge the child's outputs into the
      parent ONLY on an explicit `accept` / `edit-accept`. A `reject`, an
      absent response, or an expired approval MUST fail closed — the child
      outputs MUST NOT be merged and the parent's variables MUST remain at
      their pre-merge state. Reuses RFC 0051's `approval` kind + RFC 0049
      scopes; no new interrupt kind or error code. Verified against any host
      advertising `capabilities.agents.subRunAttestation`; skips cleanly
      otherwise.

  # ===== RFC 0018 host.sql parametric-only =====

  - id: sql-parametric-only
    tier: protocol
    severity: critical
    threat_model: SECURITY/threat-model-secret-leakage.md
    tests:
      - conformance/src/scenarios/sql-injection-rejection.test.ts
    note: |
      RFC 0018 §C: hosts advertising `capabilities.sql.supported` MUST reject
      non-parametric SQL queries that inline user input. The `ctx.db.sql.query`
      surface MUST treat the `sql` string as a parametric template; bound
      values flow through `params[]`, never via string interpolation.

  # ===== RFC 0020 host-side MCP untrusted-args invariant =====

  - id: mcp-server-untrusted-args
    tier: protocol
    severity: high
    threat_model: SECURITY/threat-model-prompt-injection.md
    tests:
      - conformance/src/scenarios/mcp-server-untrusted-args.test.ts
    note: |
      RFC 0020 §D: hosts advertising `capabilities.mcp.serverMount.supported`
      MUST validate inbound `tools/call.arguments` against the tool's declared
      `inputSchema` BEFORE starting the workflow run. Malformed or
      missing-required-field arguments MUST be rejected before any node
      executes — either as a JSON-RPC envelope error (`-32602 invalid params`,
      per JSON-RPC 2.0 spec for argument validation at the envelope layer)
      OR as a `CallToolResult { isError: true, content: [...] }` (per
      modelcontextprotocol.io for tool-execution-time errors). Both shapes
      are spec-conformant; either prevents prompt-injection-driven
      argument-forgery from leaking through. The reference workflow-engine
      sample uses `-32602` (envelope-correct for pre-workflow validation).

  # ===== RFC 0026 provider.usage credential-leak invariant =====

  - id: provider-usage-no-credential-leak
    tier: protocol
    severity: high
    threat_model: SECURITY/threat-model-secret-leakage.md
    tests:
      - conformance/src/scenarios/provider-usage.test.ts
    note: |
      RFC 0026 §D: hosts advertising `capabilities.providerUsage.supported`
      MUST NOT include credentialRef strings, hashed credential
      identifiers, or prompt/response substrings in the `provider.usage`
