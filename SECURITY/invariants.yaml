  # ===== RFC 0059 host.workspace cross-tenant·workspace isolation =====

  - id: workspace-cross-tenant-isolation
    tier: protocol
    severity: critical
    threat_model: SECURITY/threat-model-secret-leakage.md
    tests:
      - conformance/src/scenarios/workspace-cross-tenant-isolation.test.ts
      - conformance/src/scenarios/workspace-cross-tenant-isolation-blackbox.test.ts
    note: |
      RFC 0059 §E WCT-1: hosts advertising `capabilities.workspace.supported`
      MUST scope every file to a single `{tenant, workspace}` (RFC 0048). No
      `get` or `list` against a workspace owned by `{T, W}` MAY return a file
      owned by `{T′, W′} ≠ {T, W}`, regardless of the caller's permissions
      elsewhere. The owner binding MUST come from the authenticated identity,
      not caller-supplied scope hints (fail-closed); errors MUST NOT leak the
      existence of another owner's file (`404` over `403`). Mirrors
      `agent-memory-cti-1` / `kv-cross-tenant-isolation`. Two tests back this:
      the single-credential `workspace-cross-tenant-isolation.test.ts` (the
      `/v1/host/sample/workspace/op` seam) AND `-blackbox.test.ts` (2026-05-31)
      which drives the NORMATIVE §C `PUT`/`GET /v1/host/workspace/files`
      endpoints with TWO operator credentials (`OPENWOP_TEST_TENANT_B_API_KEY`)
      — the production-path proof that graduates this surface into the
      `openwop-core-standard` floor (RFC 0088 §D Lever-2), no seam.

  # ===== RFC 0116 prompt-prefix cache cross-tenant isolation =====

  - id: prompt-prefix-cache-cross-tenant-isolation
    tier: protocol
    severity: high
    threat_model: SECURITY/threat-model-provider-policy.md
    tests:
      - conformance/src/scenarios/prompt-prefix-cache.test.ts
    note: |
      RFC 0116: a host advertising `aiProviders.promptPrefixCache` MUST key its
      provider context cache by the pair `(resolved tenant, cachePrefixId)` —
      `cachePrefixId` is tenant-namespaced, never global. The owning tenant MUST
      come from the authenticated identity, not from any caller-supplied scope
      hint (fail-closed). Two distinct tenants supplying the SAME `cachePrefixId`
      MUST NOT share a provider cache entry; tenant B's FIRST use of a
      `cachePrefixId` that tenant A primed MUST be a cache miss
      (`provider.usage.cacheReadTokens == 0`). Cross-tenant cache sharing is
      prompt/context leakage — the central hazard. Mirrors
      `kv-cross-tenant-isolation` / `queue-cross-tenant-isolation` /
      `workspace-cross-tenant-isolation`. The cost-only
      `provider.usage.cacheReadTokens`/`cacheWriteTokens` fields make the
      non-share observable on the wire while the recorded envelope +
      `inputTokens`/`outputTokens` stay replay-invariant (cost-hint-only). The
      public test is the cross-tenant leg of `prompt-prefix-cache.test.ts`.

  # ===== RFC 0063 core.subWorkflow output-merge approval fail-closed =====

  - id: subrun-merge-approval-fail-closed
    tier: protocol
    severity: critical
    threat_model: SECURITY/threat-model-prompt-injection.md
    tests:
      - conformance/src/scenarios/subrun-approval-fail-closed.test.ts
    note: |
      RFC 0063 §C: when a `core.subWorkflow` declares `outputAttestation.
      requireApproval: true`, the host MUST suspend via an RFC 0051 `approval`
      interrupt BEFORE `outputMapping` and merge the child's outputs into the
      parent ONLY on an explicit `accept` / `edit-accept`. A `reject`, an
      absent response, or an expired approval MUST fail closed — the child
      outputs MUST NOT be merged and the parent's variables MUST remain at
      their pre-merge state. Reuses RFC 0051's `approval` kind + RFC 0049
      scopes; no new interrupt kind or error code. Verified against any host
      advertising `capabilities.agents.subRunAttestation`; skips cleanly
      otherwise.

  # ===== RFC 0018 host.sql parametric-only =====

  - id: sql-parametric-only
    tier: protocol
    severity: critical
    threat_model: SECURITY/threat-model-secret-leakage.md
    tests:
      - conformance/src/scenarios/sql-injection-rejection.test.ts
    note: |
      RFC 0018 §C: hosts advertising `capabilities.sql.supported` MUST reject
      non-parametric SQL queries that inline user input. The `ctx.db.sql.query`
      surface MUST treat the `sql` string as a parametric template; bound
      values flow through `params[]`, never via string interpolation.

  # ===== RFC 0020 host-side MCP untrusted-args invariant =====

  - id: mcp-server-untrusted-args
    tier: protocol
    severity: high
    threat_model: SECURITY/threat-model-prompt-injection.md
    tests:
      - conformance/src/scenarios/mcp-server-untrusted-args.test.ts
    note: |
      RFC 0020 §D: hosts advertising `capabilities.mcp.serverMount.supported`
      MUST validate inbound `tools/call.arguments` against the tool's declared
      `inputSchema` BEFORE starting the workflow run. Malformed or
      missing-required-field arguments MUST be rejected before any node
      executes — either as a JSON-RPC envelope error (`-32602 invalid params`,
      per JSON-RPC 2.0 spec for argument validation at the envelope layer)
      OR as a `CallToolResult { isError: true, content: [...] }` (per
      modelcontextprotocol.io for tool-execution-time errors). Both shapes
      are spec-conformant; either prevents prompt-injection-driven
      argument-forgery from leaking through. The reference workflow-engine
      sample uses `-32602` (envelope-correct for pre-workflow validation).

  # ===== RFC 0026 provider.usage credential-leak invariant =====

  - id: provider-usage-no-credential-leak
    tier: protocol
    severity: high
    threat_model: SECURITY/threat-model-secret-leakage.md
    tests:
      - conformance/src/scenarios/provider-usage.test.ts
    note: |
      RFC 0026 §D: hosts advertising `capabilities.providerUsage.supported`
      MUST NOT include credentialRef strings, hashed credential
      identifiers, or prompt/response substrings in the `provider.usage`
      event payload. The payload schema's `additionalProperties: false`
      enforces shape; this invariant adds the semantic constraint that
      the documented optional fields MUST be sanitized of credential
      content. Same redaction posture as the OTel `openwop.cost.*`
      attributes per `observability.md §"Cost attribution attributes"`.

  # ===== G6 / O4 cost-attribute allowlist redaction =====

  - id: cost-attribution-allowlist-redaction
    tier: protocol
    severity: high
    threat_model: SECURITY/threat-model-secret-leakage.md
    tests:
      - conformance/src/scenarios/cost-attribution.test.ts
    note: |
      `observability.md §"Cost attribution attributes"` (allowlist
      enforcement clause): hosts emitting `openwop.cost.*` attributes
      onto OTel spans MUST route them through an allowlist sanitizer
      that drops any attribute name outside the canonical seven
      (`openwop.cost.tokens.input`, `openwop.cost.tokens.output`,
      `openwop.cost.tokens.total`, `openwop.cost.usd`,
      `openwop.cost.currency`, `openwop.cost.estimated`,
      `openwop.cost.provider`) AND that drops non-primitive values
      (objects, arrays, null, undefined). Defense-in-depth against a
      buggy upstream smuggling a credential-shaped value under an
      unfamiliar key name. Verified end-to-end against the in-suite
      OTel collector by `cost-attribution.test.ts` when
      `OPENWOP_OTEL_COLLECTOR=true`; sanitizer-level redaction is
      additionally unit-tested at the reference host.

  # ===== RFC 0014 host.fs sandbox =====

  - id: fs-path-traversal
    tier: protocol
    severity: critical
    threat_model: SECURITY/threat-model-secret-leakage.md
    tests:
      - conformance/src/scenarios/fs-path-traversal.test.ts
    note: |
      RFC 0014 §B + §C: hosts advertising `capabilities.fs.supported`
      MUST resolve every input path relative to `sandboxRoot` and
      reject any path that escapes via `..` segments OR via symlinks
      pointing outside the sandbox root. The same MUST-NOT applies to
      `core.openwop.files.{read,write,delete,stat,list}` and to the
      transport sub-surfaces (ftp/sftp/ssh) when those are advertised.
      Path-escape attempts MUST return `path_outside_sandbox` rather
      than silently following the link or partially fulfilling. Tested
      against any host advertising `capabilities.fs.supported`; skips
      cleanly otherwise.

  # ===== RFC 0046 host.credentials redaction =====

  - id: credential-payload-redaction
    tier: protocol
    severity: critical
    threat_model: SECURITY/threat-model-secret-leakage.md
    tests:
      - conformance/src/scenarios/credential-payload-redaction.test.ts
    note: |
      RFC 0046 §C.1: hosts advertising `capabilities.credentials.supported`
      MUST resolve a credential reference (`{ ref, scope }`) into the node
      sandbox ONLY. Resolved credential material MUST NOT appear in run
      `inputs`, persisted `variables`, `channels`, any `run.*` event
      payload, the debug bundle, or replay state. The reference is the
      only credential artifact permitted on the wire (see
      `credential-reference.schema.json`). The same MUST-NOT holds for
      tokens stored via the RFC 0047 `host.oauth` flow and for both old
      and new material during a `two-key-overlap` rotation window. Tested
      against any host advertising `capabilities.credentials.supported`;
      skips cleanly otherwise.

  # ===== RFC 0049 RBAC fail-closed =====

  - id: authorization-fail-closed
    tier: protocol
    severity: critical
    threat_model: SECURITY/threat-model-secret-leakage.md
    tests:
      - conformance/src/scenarios/authorization-fail-closed.test.ts
      - conformance/src/scenarios/tool-hooks-authorization-fail-closed.test.ts
    note: |
      RFC 0049 §C: hosts advertising `capabilities.authorization.supported`
      MUST deny when a principal's role is absent, unseeded, or unresolvable
      (a cache miss / resolver error ⇒ deny). The decision MUST NOT
      default-allow under any error condition; `capabilities.authorization.
      failClosed` is `const: true`. A deny SHOULD emit an `authorization.
      decided { allowed: false }` event. Tested against any host advertising
      `capabilities.authorization.supported`; skips cleanly otherwise.

  # ===== RFC 0028 Tier-2 prompt workspace-membership (read + write) =====

  - id: prompt-mutation-workspace-membership-enforced
    tier: protocol
    severity: high
    threat_model: SECURITY/threat-model-secret-leakage.md
    tests:
      - conformance/src/scenarios/prompt-mutation-workspace-membership-enforced.test.ts
    note: |
      `prompts.md` §"Discovery & distribution" §"REST endpoints" §"Workspace
      membership on workspace-scoped reads and writes": hosts advertising
      `capabilities.prompts.mutableLibrary: true` MUST verify that the
      authenticated principal is a member of the target workspace before
      honoring any `POST` / `PUT` / `DELETE` to a workspace-scoped
      `/v1/prompts*` resource. A `workspaceId` carried in the request body,
      URL, or query string MUST NOT be trusted as authorization on its own
      — the host MUST resolve membership from the authenticated identity
      (per RFC 0048 §D and `auth.md` §"Identity claims"), independent of
      the caller-supplied workspace identifier. Non-members MUST be
      rejected fail-closed (typically `403`) before any write proceeds.
      Canonical envelope on 403: `error: "workspace_membership_required"`
      per `rest-endpoints.md` §"Common error codes" (T1 canonicalization,
      2026-05-25). Other refusal codes (401, 404, 5xx) are acceptable but
      the envelope shape is NOT constrained for those.

      This invariant was filed post-RFC-0028 promotion (2026-05-25) following
      a self-disclosed adopter vulnerability in which a host's mutating
      handlers wrote via the database vendor's admin SDK (bypassing the
      vendor's row-level security rules) while accepting `workspaceId` from
      the request body. The pattern (admin-SDK writes bypass DB-tier auth)
      is common across Firebase / Supabase / RLS-style stacks; the spec MUST
      requires the application-tier check independently. The conformance
      scenario soft-skips when `mutableLibrary` is unadvertised; when present,
      it drives a POST with a workspaceId the conformance principal cannot
      possibly be a member of and asserts the host refuses (NOT a 2xx; any
      4xx/5xx refusal is acceptable — silent success is the failure mode).
      On a 403 specifically, the canonical error envelope is pinned.

  - id: prompt-read-workspace-membership-enforced
    tier: protocol
    severity: high
    threat_model: SECURITY/threat-model-secret-leakage.md
    tests:
      - conformance/src/scenarios/prompt-read-workspace-membership-enforced.test.ts
    note: |
      `prompts.md` §"Discovery & distribution" §"REST endpoints" §"Workspace
      membership on workspace-scoped reads and writes": hosts advertising
      `capabilities.prompts.supported: true` MUST verify the authenticated
      principal's workspace membership BEFORE returning any workspace-scoped
      content via `GET /v1/prompts?workspaceId=`, `GET /v1/prompts/{templateId}`
      (when the host derives a workspace from the templateId), or
      `POST /v1/prompts:render` (when `workspaceId` is in the request body).
      A 200 response containing another workspace's templates is a
      cross-tenant data leak with the same blast radius as a cross-tenant
      write — sensitive prompt text, model hints, and variable schemas can
      carry intellectual property, customer data, or operational secrets.
      The read-side invariant is symmetric to the write-side. Same canonical
      refusal envelope (`error: "workspace_membership_required"` on 403).

      Filed as a sister invariant to `prompt-mutation-workspace-membership-
      enforced` in the same 2026-05-25 RFC 0028 Tier-2 post-promotion
      strengthening pass, per MyndHyve's relay green-light noting that
      read-only hosts that expose `?workspaceId=` are NOT exempt from the
      symmetric authz invariant just because they don't write. The
      conformance scenario gates on `prompts.supported: true` (broader than
      `mutableLibrary` to catch read-only hosts) and self-skips hosts that
      don't recognize `?workspaceId=` via response-shape detection (the
      scenario interprets a 200 without the documented `templates[]` field
      as "no workspace-scoped read surface, out of scope"). On 200 WITH
      `templates: []` it PASSes (correct null result for a random nonexistent
      workspace); on 200 WITH non-empty `templates[]` it FAILs (the random
      workspaceId can't legitimately contain authorized content — any
      content returned is a cross-tenant leak).

  # ===== RFC 0016 host.tableStorage cross-tenant isolation =====

  - id: table-cross-tenant-isolation
    tier: protocol
    severity: critical
    threat_model: SECURITY/threat-model-secret-leakage.md
    tests:
      - conformance/src/scenarios/table-cross-tenant-isolation.test.ts
    note: |
      RFC 0016 §B point 1: hosts advertising `capabilities.tableStorage.supported`
      MUST partition rows by tenant. A `query` or direct `get` by rowId for
      tenant A MUST NOT return rows written by tenant B, even within the same
      table name. Mirrors `kv-cross-tenant-isolation`. Applies to all six
      surface methods (`createTable`, `insert`, `get`, `query`, `update`,
      `delete`).

  # ===== RFC 0019 host.blobStorage cross-tenant isolation =====

  - id: blob-cross-tenant-isolation
    tier: protocol
    severity: critical
    threat_model: SECURITY/threat-model-secret-leakage.md
    tests:
      - conformance/src/scenarios/blob-cross-tenant-isolation.test.ts
    note: |
      RFC 0019 §B point 1: hosts advertising `capabilities.blobStorage.supported`
      MUST partition blobs by tenant. A `get` for tenant A MUST NOT return
      blobs written by tenant B, even with identical `bucket`/`key`. Same
      applies to `list` enumeration and presigned-URL resolution — a presigned
      URL minted for tenant A MUST NOT resolve under tenant B's namespace.

  # ===== RFC 0019 host.cache cross-tenant isolation =====

  - id: cache-cross-tenant-isolation
    tier: protocol
    severity: critical
    threat_model: SECURITY/threat-model-secret-leakage.md
    tests:
      - conformance/src/scenarios/cache-cross-tenant-isolation.test.ts
    note: |
      RFC 0019 §B point 2: hosts advertising `capabilities.cache.supported`
      MUST partition cache entries by tenant. A `get` for tenant A MUST NOT
      return values written by tenant B, even with identical keys. Mirrors
      `kv-cross-tenant-isolation` — `host.cache` is the short-TTL memoization
      sibling and inherits the same isolation requirement.

  # ===== Phase I auth-rotation token redaction =====

  - id: auth-key-rotation-no-canary-echo
    tier: protocol
    severity: high
    threat_model: SECURITY/threat-model-secret-leakage.md
    tests:
      - conformance/src/scenarios/auth-api-key-rotation.test.ts
    note: |
      auth-profiles.md §"openwop-auth-api-key-rotation" §"Canary
      redaction": when a host rejects a bearer token, the 401
      response envelope MUST NOT echo the rejected token (or any
      portion of it) in `message` / `details`. Reference-impl probe:
      `openwop-examples:examples/hosts/postgres/test/auth-rotation-scoped.test.ts` §6
      asserts the rejected-token canary doesn't appear in the
      response body.

  # ===== RFC 0041 Phase 4 — replay-determinism portability =====

  - id: replay-llm-cache-key-portable
    tier: protocol
    severity: high
    threat_model: SECURITY/threat-model-secret-leakage.md
    tests:
      - conformance/src/scenarios/replay-llm-cache-key.test.ts
      - conformance/src/scenarios/replay-llm-cache-key-portable.test.ts
    note: |
      RFC 0041 §A + §E. The LLM cache-key recipe per
      `replay.md` §"LLM cache-key recipe" §A + §B + §C MUST be
      byte-deterministic across independent hosts that follow the
      recipe — two hosts (or two test runs against one host) MUST
      produce the same SHA-256-over-JCS key for the same canonical
      input. Portability is the load-bearing property: it lets the
      cross-host replay contract survive host migration + multi-region
      deployment + Phase 4 advertisement (`replayDeterminism
      .llmCacheKeyRecipe: "spec-rfc-0041"`). Non-portable cache keys
      hide tenant-scoped state behind the cache boundary, defeating
      the SR-1 secret-redaction invariant on cached responses.

  - id: annotation-cross-tenant-isolation
    tier: protocol
    severity: high
    threat_model: SECURITY/threat-model-secret-leakage.md
    tests:
      - conformance/src/scenarios/feedback-cross-tenant-isolation.test.ts
    note: |
      RFC 0056 §E. An annotation is visible only within its run's tenant; a
      GET /v1/runs/{runId}/annotations MUST NOT return annotations from a run
      owned by a different tenant, and a run's annotation list MUST contain
      only that run's annotations. Mirrors CTI-1.

  - id: annotation-content-redaction
    tier: protocol
    severity: high
    threat_model: SECURITY/threat-model-secret-leakage.md
    tests:
      - conformance/src/scenarios/feedback-correction-redaction.test.ts
    note: |
      RFC 0056 §E. Annotation signal.correction and note are untrusted user
      content; secret-shaped material MUST be redacted under SR-1 before
      persistence, listing, and debug-bundle export.

  - id: memory-attribution-no-content
    tier: protocol
    severity: high
    threat_model: SECURITY/threat-model-secret-leakage.md
    tests:
      - conformance/src/scenarios/memory-attribution-no-content.test.ts
    note: |
      RFC 0057 §C. A memory.written event payload MUST NOT carry the memory
      entry content or any BYOK-resolved secret material — identifiers
      (memoryRef, memoryId, nodeId, agentId) and non-secret tags only. The
      entry content is served by the read-side (MemoryAdapter.get), already
      SR-1-redacted; the event MUST NOT duplicate it onto the event log.

  - id: memory-attribution-tenant-scoped
    tier: protocol
    severity: high
    threat_model: SECURITY/threat-model-secret-leakage.md
    tests:
      - conformance/src/scenarios/memory-attribution-tenant-scoped.test.ts
    note: |
      RFC 0057 §C. memory.written events appear only on the run event stream
      of the tenant that owns the run; no memoryRef/memoryId for one tenant's
      run is disclosed on another tenant's stream. Mirrors CTI-1.

  - id: eval-summary-no-content-leak
    tier: protocol
    severity: high
    threat_model: SECURITY/threat-model-secret-leakage.md
    tests:
      - conformance/src/scenarios/agent-eval-suite-shape.test.ts
    note: |
      RFC 0081 §F. An EvalSummary (eval-summary.schema.json) and the
      eval.started/eval.scored/eval.completed events MUST NOT carry task
      output bodies, rubric prose, model completions, prompts, pricing
      breakdowns / rate cards, or credential material (SR-1) — scores,
      scalars, ids, counts, and redaction-safe {kind, severity} safety
      descriptors only. The result body is served by the run's normal
      projection. The summary schema is additionalProperties:false at every
      level; the always-on agent-eval-suite-shape.test.ts content-free
      negatives (a task entry with a taskOutput body; a safetyFinding with an
      excerpt) are the public test.

  - id: verifier-no-content-leak
    tier: protocol
    severity: high
    threat_model: SECURITY/threat-model-secret-leakage.md
    tests:
      - conformance/src/scenarios/agent-verifier-shape.test.ts
    note: |
      RFC 0090 §A/§SECURITY. The `agent.verified` event
      (run-event-payloads.schema.json#/$defs/agentVerified) MUST NOT carry the
      verified content — the result text, the tool output, prompts, model
      completions, or credential material (SR-1). It carries only the opaque
      `target`, the closed-enum `verdict` (pass|fail|revise), the optional
      criteria KEYS, and an optional verifier `confidence`. The verified result
      body is served by the run's normal projection. The payload schema is
      additionalProperties:false; the always-on agent-verifier-shape.test.ts
      negative (an agent.verified carrying a `result` body) is the public test.

  - id: egress-decision-no-secret-leak
    tier: protocol
    severity: high
    threat_model: SECURITY/threat-model-secret-leakage.md
    tests:
      - conformance/src/scenarios/egress-provenance-shape.test.ts
    note: |
      RFC 0079 §A/§F. The CredentialProvenance descriptor
      (credential-provenance.schema.json) and the egress.decided event
      (run-event-payloads.schema.json#egressDecided) MUST NOT carry the
      credential secret value (SR-1) — identifiers (credentialId / issuer /
      auditCorrelationId), the destination HOST/AUTHORITY ONLY (no path/query —
      those can carry secrets), the decision enum, the audiences list, and a
      CLOSED-enum reason code only (a free-form reason would let a host spill a
      blocked URL/host/header into it — a structural-pass-but-leak hole); never
      the token / API key / Authorization header value, and never a
      request/response body. credential-provenance.schema.json is
      additionalProperties:false (no secret-value field exists); the always-on
      egress-provenance-shape.test.ts asserts the descriptor + event shapes and
      the decision-enum / audiences-minItems negatives. The redactionPolicy
      field governs at-most an SR-1-redacted hash.

  - id: egress-credential-audience-bound
    tier: protocol
    severity: critical
    threat_model: SECURITY/threat-model-secret-leakage.md
    tests:
      - conformance/src/scenarios/egress-audience-binding.test.ts
    note: |
      RFC 0079 §C/§F (the confused-deputy guard — RFC 0076 §B's parked
      question). A host-issued credential MUST NOT be attached to an egress
      whose destination is not in the credential's provenance `audiences`; such
      an egress is denied (reason: out-of-audience) or downgraded (proceeds
      anonymously). The host MUST fail closed — provenance-unevaluable ⇒ denied,
      never allowed-by-default; an expired credential ⇒ denied. This is a
      BEHAVIORAL guarantee requiring a live credentialed egress, so it lands at
      reference-impl tier at Draft → Active (the gated egress-audience-binding.test.ts
      soft-skips until a host wires egressPolicy over safeFetch). It GRADUATED to
      protocol tier at RFC 0079's Active → Accepted (2026-06-01) — MyndHyve wired
      egressPolicy over safeFetch and passed the gated egress-audience-binding.test.ts
      non-vacuously under OPENWOP_REQUIRE_BEHAVIOR=true (out-of-audience → denied +
      credentialAttached:false; provenance-unevaluable → denied fail-closed) — the
      RFC 0035 sandbox-invariant precedent.

  # ===== Anonymous-actor authorization (RFC 0132) =====
  # All five are BEHAVIORAL guarantees requiring a live tool-enabled public
  # surface. They landed at reference-impl tier at Draft → Active and GRADUATED
  # to protocol tier at RFC 0132's Active → Accepted (2026-07-22) once the
  # openwop-app tier-1 reference host (PR openwop-app#2403, rev 03d06d1f2) wired
  # the surface and the five gated scenarios passed NON-VACUOUSLY under
  # OPENWOP_REQUIRE_BEHAVIOR=true — steward-verified 2026-07-22 by booting the
  # in-memory host (anonymousActor advert both tiers + hitl control; seam served
  # 200, not a soft-skip) and running @openwop/openwop-conformance anon-actor
  # scenarios: 10/10 assertions green. The RFC 0079 `egress-credential-audience-
  # bound` precedent above. The always-on anonymous-actor-shape.test.ts proves
  # the wire contract server-free.

  - id: anon-actor-no-default-baseline
    tier: protocol
    severity: critical
    threat_model: SECURITY/threat-model-prompt-injection.md
    tests:
      - conformance/src/scenarios/anonymous-actor-default-deny.test.ts
    note: |
      RFC 0132 §C.1. An anonymous actor (owner.principalKind:"anonymous") MUST be
      granted ONLY the tools explicitly listed in the resolved public-surface
      allowlist — never a default-on / default-granted tool baseline, never a tool
      granted to authenticated agents by default, never a tool absent from the
      surface's explicit grant. The effective granted set is witnessed through the
      RFC 0078 tool-catalog read scoped to the anon principal, which fails EMPTY
      when the surface grants nothing (never a baseline); a call to a non-granted
      tool MUST resolve to authorization.decided{allowed:false,reason:
      "anon-not-granted"} with no dispatch. GRADUATED reference-impl → protocol at
      RFC 0132 Active→Accepted (2026-07-22): anonymous-actor-default-deny.test.ts
      passed non-vacuously against openwop-app rev 03d06d1f2.

  - id: anon-actor-no-secret-reach
    tier: protocol
    severity: critical
    threat_model: SECURITY/threat-model-secret-leakage.md
    tests:
      - conformance/src/scenarios/anonymous-actor-no-secret-reach.test.ts
    note: |
      RFC 0132 §C.2/§C.3. An anonymous-actor tool call (either tier) MUST NOT
      resolve, return, or otherwise reach any secret / BYOK credential material,
      and MUST NOT reach cross-tenant data (SR-1 + CTI-1 parity). A read-tier tool
      is tenant-scoped to the surface's tenant; a cross-tenant attempt fails closed
      — the host either denies it OR neutralizes it by ignoring the caller-supplied
      tenant (RFC 0132 §A.2: the caller MUST NOT influence the tenant), never
      resolving to or returning the caller's tenant. GRADUATED reference-impl →
      protocol at RFC 0132 Active→Accepted (2026-07-22): anonymous-actor-no-secret-
      reach.test.ts passed non-vacuously against openwop-app rev 03d06d1f2 (planted
      BYOK canary never surfaced; the caller-supplied tenant was ignored).

  - id: anon-actor-egress-ssrf-guarded
    tier: protocol
    severity: critical
    threat_model: SECURITY/threat-model-secret-leakage.md
    tests:
      - conformance/src/scenarios/anonymous-actor-egress-guarded.test.ts
    note: |
      RFC 0132 §C.3 (composes RFC 0079 egress-credential-audience-bound + RFC 0076
      §B safeFetch). An anon-initiated egress MUST ride the host's SSRF-guarded,
      audience-bound egress path; a host-issued or tenant BYOK credential MUST NOT
      attach to an anon egress whose destination is not in the credential's
      provenance audiences — the egress is denied (reason: out-of-audience) or
      downgraded (proceeds anonymously). The default posture is downgraded/denied;
      an anon actor never becomes a confused deputy for a tenant credential.
      GRADUATED reference-impl → protocol at RFC 0132 Active→Accepted (2026-07-22):
      anonymous-actor-egress-guarded.test.ts passed non-vacuously against openwop-
      app rev 03d06d1f2 (out-of-audience → anon-egress-denied, credentialAttached:false).

  - id: anon-actor-write-egress-gated
    tier: protocol
    severity: critical
    threat_model: SECURITY/threat-model-prompt-injection.md
    tests:
      - conformance/src/scenarios/anonymous-actor-write-gated.test.ts
    note: |
      RFC 0132 §C.3. An anon bounded-write/egress tool (one that mutates durable
      state or performs outbound egress) MUST be behind a mandatory control: a
      per-action HITL/approval gate (RFC 0051 — the action suspends pending a human
      decision) OR a hard rate-limit AND a per-session action cap. A host MUST
      advertise which control(s) it uses (capabilities.anonymousActor
      .writeEgressControls) and MUST NOT permit an ungated anon write/egress; an
      anon write/egress with no resolvable control MUST be denied (reason:
      "anon-write-ungated"). GRADUATED reference-impl → protocol at RFC 0132
      Active→Accepted (2026-07-22): anonymous-actor-write-gated.test.ts passed non-
      vacuously against openwop-app rev 03d06d1f2 (hitl control → approval interrupt
      before the durable write; uncontrolled surface → anon-write-ungated).

  - id: anon-actor-audit-opaque
    tier: protocol
    severity: high
    threat_model: SECURITY/threat-model-secret-leakage.md
    tests:
      - conformance/src/scenarios/anonymous-actor-audit-opaque.test.ts
    note: |
      RFC 0132 §A/§D (RFC 0048 identifier-opacity + SR-1). The anon-session
      principal MUST be opaque, origin-bound, ephemeral, non-cross-linkable, and
      non-PII (no IP address, email, device fingerprint, or third-party identity),
      and MUST NOT be resolvable to an authenticated principal, a workspace, or
      another anon session. Every anon tool call emits the RFC 0049
      authorization.decided record (no new event minted) carrying the opaque anon
      id and NO PII / credential material. GRADUATED reference-impl → protocol at
      RFC 0132 Active→Accepted (2026-07-22): anonymous-actor-audit-opaque.test.ts
      passed non-vacuously against openwop-app rev 03d06d1f2 (opaque anon: id, no
      PII in the decision record; owner.principalKind:"anonymous" projected).

  - id: sub-chain-expansion-bounded
    tier: protocol
    severity: high
    threat_model: SECURITY/threat-model-node-packs.md
    tests:
      - conformance/src/scenarios/chain-subchain-cycle-rejected.test.ts
    note: |
      RFC 0133 §"Sub-chain composition" — bounded recursion. A workflow-chain
      pack MAY declare `subChains[]` a host co-expands into co-registered child
      workflows at `POST …/workflows/from-chain`. A host MUST bound that
      co-expansion so a malicious or malformed pack cannot cause denial of
      service via unbounded recursion: a chain that transitively composes itself
      MUST be rejected with `sub_chain_cycle`, AND nesting depth MUST be capped by
      a host `maxSubChainDepth` (advertised as
      `capabilities.workflowChainPacks.subChains.maxDepth`, RECOMMENDED default 8)
      — a breach fails closed with the DISTINCT code `sub_chain_max_depth_exceeded`
      (so an operator sees which bound fired; a depth breach is not a cycle). This is the
      workflow-chain analog of `artifact-schema-compile-bounded` (RFC 0071). Server-
      free floor: `chain-subchain-cycle-rejected.test.ts` drives the reference
      library (`expandChainTree`) and asserts BOTH a self-referential chain and a
      depth-bound breach reject non-vacuously while an acyclic tree within the
      bound expands cleanly — the public test. The behavioral end-to-end form (a
      reference host rejects an over-bounds `from-chain` at instantiate time) is
      capability-gated on `capabilities.workflowChainPacks.subChains.supported`
      and host-pending until a reference host wires runtime child dispatch.

  - id: sub-chain-child-tenant-scoped
    tier: protocol
    severity: critical
    threat_model: SECURITY/threat-model-secret-leakage.md
    tests:
      - conformance/src/scenarios/chain-subchain-sibling.test.ts
      - conformance/src/scenarios/chain-subchain-fanout.test.ts
    note: |
      RFC 0133 §1.3 step 2 (CTI-1 parity). When a host co-registers a child chain
      during parent instantiation, the child workflow MUST be owned by — and
      reachable only from — the SAME tenant as the parent (`recordOwnership` for
      the parent's tenant). CRITICAL id-derivation corollary: `registerWorkflow` is
      a GLOBAL by-id registry, so the deterministic child id MUST be TENANT-SCOPED —
      derived from `(tenantId, childChainId, version)`, NOT from a tenant-less
      `(parentExpansionId, childChainId)`. A tenant-less id lets two tenants
      instantiating the same parent→child collide on ONE global workflow id
      (cross-tenant overwrite/leak). A co-registered child MUST NOT be registered
      under, or become reachable from, any other tenant, and two tenants
      instantiating the same pack MUST NEVER converge on a shared child workflow
      (no cross-tenant workflow aliasing). This applies the existing cross-tenant-
      isolation guarantee to the new co-registration path.
      Reference-impl-tier OVERALL (the ownership + reachability half is a property of
      the host's `from-chain` co-registration + workflow store): the capability-gated
      `chain-subchain-fanout.test.ts` is its behavioral home and soft-skips until a
      reference host advertises `capabilities.workflowChainPacks.subChains.supported`.
      The ID-SCOPING half is witnessed server-free by `chain-subchain-sibling.test.ts`
      (asserts `mintChildWorkflowId` yields DISTINCT ids for distinct tenants, no
      collision, converges in-tenant); the ownership/reachability half is witnessed on
      the host. GRADUATED reference-impl → protocol at RFC 0133 Active→Accepted
      (2026-07-23): openwop-app tier-1 reference host rev `e199bd96c` (PR openwop-app#2429)
      passed `chain-subchain-fanout` §B non-vacuously under `OPENWOP_REQUIRE_BEHAVIOR=true`
      (advertised `subChains {supported:true,maxDepth:8}`, co-registered children with a
      deterministic tenant-scoped id, refuse-not-flatten in the negative posture) — RFC
      0079 / RFC 0132 graduation precedent.

  - id: budget-no-pricing-leak
    tier: protocol
    severity: high
    threat_model: SECURITY/threat-model-secret-leakage.md
    tests:
      - conformance/src/scenarios/budget-policy-shape.test.ts
    note: |
      RFC 0084 §F. The budget.{reserved,consumed,threshold.crossed,exhausted}
      events and cap.breached{kind:"budget-*"} MUST NOT carry the host's PRICING
      MODEL — rate cards, per-token/per-unit prices, cost breakdowns, provider
      credentials, or model prose. The AGGREGATE cost total (the cost dimension's
      consumed/limit + the user-set maxCostUsd) IS permitted — it is the user's
      own budget reflected back, already derivable from the accepted RFC 0026
      provider.usage.costEstimateUsd surface, and a single aggregate cannot
      reconstruct a rate card. The four budget.* payload $defs are
      additionalProperties:FALSE (so a rate-card extra field is rejected at the
      INSTANCE level, not just absent from declared properties); the always-on
      budget-policy-shape.test.ts asserts both the declared-property check and the
      instance-level rejection of a ratePerToken-bearing payload — the public test.
      The host's pricing model (how it computes costEstimateUsd) stays a host
      choice (RFC 0026); only the policy shape + events + enforcement seam are pinned.

  - id: deployment-event-no-content-leak
    tier: protocol
    severity: high
    threat_model: SECURITY/threat-model-secret-leakage.md
    tests:
      - conformance/src/scenarios/agent-deployment-shape.test.ts
    note: |
      RFC 0082 §D. The four deployment.{promoted,rolled-back,canary.adjusted,
      state.changed} event payloads MUST carry ids, lifecycle states, scalars
      (percent / version strings), and content-free references (evalRunId,
      approvalGateId, rollbackPointer) ONLY — never a manifest body, prompt,
      system-prompt, or credential material (SR-1). Each payload $def is
      additionalProperties:false; the always-on agent-deployment-shape.test.ts
      content-free negatives (a deployment.promoted carrying a manifestBody; a
      deployment.state.changed carrying a prompt) are the public test.

  - id: roster-attribution-no-content
    tier: protocol
    severity: high
    threat_model: SECURITY/threat-model-secret-leakage.md
    tests:
      - conformance/src/scenarios/agent-roster-shape.test.ts
    note: |
      RFC 0086 §C. The roster.run.initiated attribution event MUST carry the
      standing agent's ids + persona + the trigger source ONLY (rosterId,
      persona, agentId, workflowId, triggerSource, optional
      triggerSubscriptionId) — never the inbound work-item body (a Kanban
      card's description/payload), the resolved prompt, or credential material
      (SR-1). The payload $def is additionalProperties:false; the always-on
      agent-roster-shape.test.ts content-free negatives (a roster.run.initiated
      carrying a `body`; one carrying a `prompt`) are the public test.

  - id: org-position-no-authority-escalation
    tier: protocol
    severity: high
    threat_model: SECURITY/threat-model-prompt-injection.md
    tests:
      - conformance/src/scenarios/agent-org-chart-shape.test.ts
    note: |
      RFC 0087 §B. An agent's position in an org-chart — its department, its
      role, or any reportsTo edge into or out of it — MUST NOT grant, widen, or
      imply any authority. Being a "manager" MUST NOT add a report's tools to
      the manager's effective toolAllowlist (RFC 0002 §A14); org position MUST
      NOT be consulted as an RFC 0049 authorization input (same scopes => same
      decision with or without the edge); and being "senior" MUST NOT
      auto-satisfy, bypass, or override an RFC 0051 approval gate. The
      agent-org-chart.schema.json carries NO permissions/scopes/canDispatch/
      authority field and every object is additionalProperties:false, so a
      conformant host cannot express position-as-authority through it; the
      invariant additionally forbids deriving authority from position
      out-of-band. The always-on agent-org-chart-shape.test.ts structural
      assertions (the schema rejects an authority-bearing field; a member
      object's key set is exactly {rosterId, departmentId, roleId, reportsTo})
      are the protocol-tier public test; the behavioral live-dispatch refusal
      is gated on agents.orgChart.supported and lands at Active -> Accepted.
      Threat-model mapping: filed under the prompt-injection model with the
      other authority-escalation / approval-bypass invariants
      (prompt-injection-no-llm-approval, subrun-merge-approval-fail-closed);
      the normative section documenting the invariant is RFC 0087 §B.

  - id: deployment-promotion-fail-closed
    tier: protocol
    severity: high
    threat_model: SECURITY/threat-model-secret-leakage.md
    tests:
      - conformance/src/scenarios/agent-deployment-lifecycle.test.ts
    note: |
      RFC 0082 §E. A deployment state transition (promote / rollback / pause)
      MUST authorize fail-closed against the RFC 0049 deploy:* scope (absent /
      unseeded role denies) and MUST NOT bypass a configured RFC 0051
      approvalGate or RFC 0081 requiredEval before emitting deployment.promoted.
      Behavioral guarantee — verified by a reference host's CI until the
      behavioral agent-deployment-lifecycle.test.ts lands; at that point this
      invariant GRADUATES reference-impl -> protocol tier (the RFC 0035
      sandbox-invariant precedent). At Active the structural fail-closed is
      already covered by the protocol-tier authorization-fail-closed (RFC 0049)
      applied to deploy:* scopes. Threat-model mapping: filed under the
      secret-leakage model alongside its structural cousin
      authorization-fail-closed (RFC 0049 RBAC fail-closed); the normative
      section documenting the invariant is RFC 0082 §E.

  # ===== RFC 0093 webhook delivery hardening =====

  - id: webhook-cross-tenant-isolation
    tier: protocol
    severity: critical
    threat_model: SECURITY/threat-model-secret-leakage.md
    tests:
      - conformance/src/scenarios/webhook-tenant-isolation.test.ts
    note: |
      RFC 0093 §A: a webhook subscription MUST receive only events from
      runs within the subscription's tenant scope — the tenant established
      at registration by the membership gate in `webhooks.md` §Endpoints.
      Cross-tenant delivery is a protocol violation regardless of
      subscription filter breadth (`events` / `tags`). Mirrors
      `agent-memory-cti-1` / `kv-cross-tenant-isolation` /
      `queue-cross-tenant-isolation` for the delivery direction: every
      other tenant-scoped surface already carried an explicit
      cross-tenant-isolation invariant; webhook delivery was the omission.

  - id: webhook-delivery-egress-revalidation
    tier: reference-impl
    severity: critical
    threat_model: SECURITY/threat-model-secret-leakage.md
    tests: []
    # enforcement pending — tracked gap: black-box conformance cannot
    # observe a host's resolver behavior. Enforcement lands in the
    # reference host's webhook delivery client
    # (openwop-app:backend/typescript/src/host/webhookDeliveryWorker.ts)
    # per RFC 0093's open reference-host acceptance criterion; that repo's
    # CI carries the verifying tests once wired.
    note: |
      RFC 0093 §A: hosts MUST re-resolve a webhook delivery URL's hostname
      at delivery time and validate EVERY resolved address against the
      same denied ranges as registration (`webhooks.md` §"SSRF protection"
      plus any host-configured denylist). The connection MUST be made to
      the validated address (pinned resolution); the dispatcher MUST NOT
      re-resolve between validation and connect; and delivery MUST NOT
      follow redirects — a `3xx` is a delivery failure retried per the
      existing policy. Closes the DNS-rebinding / redirect-following
      TOCTOU left open by registration-time-only validation (a registered
      public hostname later re-pointed at `169.254.169.254`, or a `302`
      to a metadata endpoint).

  - id: connection-pack-no-credential-material
    tier: protocol
    severity: critical
    threat_model: SECURITY/threat-model-secret-leakage.md
    tests:
      - conformance/src/scenarios/connection-pack-no-credential-material.test.ts
    note: |
      RFC 0095 / connection-packs.md §Manifest clause 2. A connection-pack
      manifest (kind: "connection") is PUBLIC provider metadata and MUST NOT
      contain credential material in any field — no client secret, no
      access/refresh token, no API key, no password. A host MUST reject a
      manifest carrying a property whose name matches the normative minimum
      blocklist (clientSecret, client_secret, apiKey, api_key, token,
      accessToken, refreshToken, password, privateKey, secret — matched
      case-insensitively at any depth) with
      connection_pack_credential_material; the single exemption is the
      property named `token` at exactly provider.auth.endpoints.token (the
      OAuth token-endpoint URL). The scan runs BEFORE generic schema
      validation so the specific code wins over a generic shape error. The
      OAuth client credential is a host concern (RFC 0047), supplied out of
      band by the operator — never shipped in the pack. Public test: the
      always-on schema probe (additionalProperties:false rejects every
      blocklisted name at the schema layer) + the capability-gated
      behavioral leg asserting the specific error code on a live host.

  - id: connection-pack-api-host-shape
    tier: protocol
    severity: critical
    threat_model: SECURITY/threat-model-secret-leakage.md
    tests:
      - conformance/src/scenarios/connection-pack-apihosts.test.ts
    note: |
      RFC 0120 / connection-packs.md §Manifest items 11 + 13. A connection-pack
      `provider.apiHosts` entry governs WHERE a resolved credential may be sent
      for connector egress (RFC 0045), so its shape MUST be tight: each entry is
      a bare, lowercase, registrable hostname of two-or-more dot-separated labels
      whose final (TLD) label begins with an ASCII letter, and MUST NOT carry a
      scheme, userinfo, port, path, query, fragment, wildcard (`*`), or IP literal
      (v4 or v6). A host MUST reject a non-conforming entry with
      connection_pack_invalid_api_host. The TLD-must-be-alphabetic rule is what
      makes the schema `pattern` reject IPv4 literals such as 127.0.0.1 — JSON
      Schema `format:"hostname"` is advisory and admits all-numeric hosts, so the
      allow-list MUST NOT rely on it for IP rejection. Conditional MUST: when
      `provider.reach` is `openapi` (a credentialed REST/OpenAPI egress surface)
      `apiHosts` is REQUIRED (the provider-level `allOf`); an `mcp`/metadata
      provider MAY omit it. Public test: the always-on, server-free schema legs of
      connection-pack-apihosts.test.ts (positive apiHosts fixture; openapi-without-
      apiHosts rejected; IP/wildcard/port/single-label/uppercase entries rejected;
      mcp-omission valid).

  - id: connection-pack-egress-host-bound
    tier: protocol
    severity: critical
    threat_model: SECURITY/threat-model-secret-leakage.md
    tests:
      - conformance/src/scenarios/connection-pack-apihosts.test.ts
    note: |
      RFC 0120 / connection-packs.md §Manifest items 10 + 15. A host performing
      credential-bearing connector egress (an RFC 0045 action / brokered fetch)
      for a pack-delivered provider MUST restrict the destination to a host that
      MATCHES an `apiHosts` entry and MUST fail closed (no credential sent)
      otherwise — the confused-deputy guard for pack providers. Matching is
      dot-anchored suffix containment: a request host matches an entry IFF it
      equals the entry OR ends with `"." + entry` — never a bare substring, so
      `notexample.com` / `evil.com` / `example.com.evil.com` MUST NOT match
      `example.com`. eTLD+1 is the floor (an entry admits its subdomains); a pack
      MAY declare a tighter exact host to narrow egress. `apiHosts` is
      AND-composed with — and never widens past — the RFC 0079
      `egress-credential-audience-bound` guard (item 15): where both apply an
      egress MUST satisfy both, and an `apiHosts` match MUST NOT be treated as an
      escape hatch that bypasses RFC 0079. Public test: the always-on, server-free
      matching-rule legs of connection-pack-apihosts.test.ts (dot-anchored
      containment + no-substring/suffix/prefix escape + tighter-exact-host) plus
      the capability-gated behavioral egress-allow-list leg (permit an apiHosts
      match; fail closed otherwise) driven through the
      POST /v1/host/sample/connection-packs/egress-check seam.

  - id: proposal-inert-until-applied
    tier: protocol
    severity: critical
    threat_model: SECURITY/threat-model-prompt-injection.md
    tests:
      - conformance/src/scenarios/proposal-reviewable-learning.test.ts
    note: |
      RFC 0096 / agent-memory.md §"Reviewable learning" clause 1. A Proposal
      in any state other than `applied` MUST NOT influence the resolution,
      planning, or execution of any run (the inertness invariant). A host
      advertising `agents.proposals` MUST keep a synthesized draft/revised
      proposal inert: a workflow-chain-pack proposal in `draft` does not alter
      a run that would match it; only after an authorized `apply` does the
      behavior appear. This is the safety guarantee that an agent cannot
      silently mutate its own production behavior — a synthesized reusable
      behavior is reviewable-first. Public test: the always-on schema leg
      (the `state` enum + open-`artifact` shape) + the capability-gated
      behavioral leg asserting a draft proposal leaves a matching run
      unchanged until applied.

  - id: proposal-no-resynthesis
    tier: protocol
    severity: high
    threat_model: SECURITY/threat-model-prompt-injection.md
    tests:
      - conformance/src/scenarios/proposal-reviewable-learning.test.ts
    note: |
      RFC 0096 / agent-memory.md §"Reviewable learning" clause 3. On `apply`,
      the installed artifact MUST be the exact `artifact` payload last
      persisted on the proposal — no silent re-synthesis at activation. A
      host MUST NOT regenerate or mutate the artifact between the last human
      revision and installation; the byte image a reviewer approved is the
      byte image installed. Closes the "the agent changed what I approved at
      the moment I approved it" trust gap. Public test: the capability-gated
      behavioral leg asserting the installed artifact byte-matches the
      last-persisted `artifact`.

  - id: goal-continuation-bounded
    tier: protocol
    severity: critical
    threat_model: SECURITY/threat-model-prompt-injection.md
    tests:
      - conformance/src/scenarios/goal-standing-continuation.test.ts
    note: |
      RFC 0097 / agent-runtime.md §"Standing goals" clause 2. A standing
      goal's continuation MUST be bounded: when `agents.goals.requiresBounds`
      is advertised, an `active` goal without RFC 0058 `bounds` is invalid
      (`POST /goals` ⇒ 422). The host MUST stop continuation and set
      `state: bound-exceeded` (emitting `goal.closed`) when any declared
      bound is crossed — iteration count, accumulated cost (RFC 0084), or
      wall-clock deadline. This is the termination guarantee an operator
      running unattended goals depends on: the loop cannot run forever.
      Public test: the always-on schema leg (bounds object) + the
      capability-gated behavioral leg asserting a never-satisfied goal halts
      exactly at `maxLoopIterations` with no further runs.

  - id: goal-completion-judge-only
    tier: protocol
    severity: high
    threat_model: SECURITY/threat-model-prompt-injection.md
    tests:
      - conformance/src/scenarios/goal-standing-continuation.test.ts
    note: |
      RFC 0097 / agent-runtime.md §"Standing goals" clause 1. A goal's
      completion MUST be determined by the judge declared in
      `completion.check` (an RFC 0090 verifier verdict or the host
      evaluator). A client MUST NOT be able to set `state: satisfied`
      directly — a write attempting it is rejected. Closes the "mark my own
      homework" gap where a caller declares a goal done without the judge
      agreeing. Public test: the capability-gated behavioral leg asserting a
      client-supplied `state: satisfied` is refused and only a judge verdict
      transitions the goal to satisfied.

  - id: export-bundle-no-credential-material
    tier: protocol
    severity: critical
    threat_model: SECURITY/threat-model-secret-leakage.md
    tests:
      - conformance/src/scenarios/export-bundle-portability.test.ts
    note: |
      RFC 0098 / portability.md §Invariants clause 1. An export bundle MUST
      NOT contain credential VALUES. `connection-ref` items carry only
      refs/provider ids (RFC 0046/0079); the importer MUST report unbound
      refs in `secretsToRebind` and MUST NOT invent or transfer secret
      material. A host MUST reject an imported bundle whose `connection-ref`
      payload carries a literal credential value (client secret, access/
      refresh token, API key, password, private key — matched
      case-insensitively at any depth) with a secret-value rejection (422).
      Mirrors `connection-pack-no-credential-material`: credentials are
      host-side and re-bound at the destination, never carried on the wire.
      Public test: the always-on schema leg (no credential fields in the
      bundle shape) + the capability-gated behavioral leg asserting a bundle
      with an embedded literal key is rejected and export emits refs only.

  # ===== RFC 0099 external-event trigger ingestion =====

  - id: trigger-ingestion-ssrf
    tier: protocol
    severity: critical
    threat_model: SECURITY/threat-model-secret-leakage.md
    tests:
      - conformance/src/scenarios/trigger-ingestion.test.ts
    note: |
      RFC 0099 §F.4 / trigger-bridge.md §F.4. ANY host-side fetch the
      external-event ingestion path performs (webhook verification callback,
      email-attachment resolution, form file-upload retrieval) MUST go through
      the RFC 0076 §B SSRF guard (`assertPublicUrl` / `httpClient.safeFetch`):
      no fetch to a private/link-local/loopback address, with the
      `maxResponseBodyBytes` cap. The host MUST NOT hand the run an external
      URL to fetch itself — `TriggerEvent.AttachmentRef.ref` is a host-internal
      opaque handle, never a raw external URL. An attachment whose resolution
      would hit a private address (e.g. `http://169.254.169.254/...`) MUST be
      refused (the attachment dropped, the run still starting on the rest of
      the event). Public test: the always-on schema leg asserts `AttachmentRef`
      requires `ref` and rejects a raw `url` field (the schema structurally
      forbids handing the run a fetchable URL); the capability-gated behavioral
      leg (`triggerBridge.ingestion`) asserts an ingestion-path fetch to a
      private address is refused, reusing the `http-client-ssrf-guard` posture.

  - id: trigger-ingestion-content-redaction
    tier: protocol
    severity: critical
    threat_model: SECURITY/threat-model-secret-leakage.md
    tests:
      - conformance/src/scenarios/trigger-ingestion.test.ts
    note: |
      RFC 0099 §F.4 / trigger-bridge.md §F.4. The inbound external-event body,
      headers, email content, and form fields MUST NOT appear on any `run.*` /
      `trigger.*` durable event payload (RFC 0083 §C content-freeness,
      generalized to external sources). The content lives ONLY in
      `ctx.triggerData` (the in-run `TriggerEvent`, never event-logged) and the
      run's own variables (SR-1 redaction applies). `webhook.headers` MUST be a
      host-curated allowlist — the host MUST NOT pass through `Authorization`,
      `Cookie`, or `Proxy-Authorization`; `dedupKey` MUST be host-opaque.
      Public test: the always-on schema leg asserts the in-run `TriggerEvent`
      is the ONLY carrier of inbound content (the per-source one-of rule holds;
      `AttachmentRef` requires a host-internal `ref` and rejects a raw `url`;
      `contentTrust` is the const `"untrusted"`) and that the durable
      `trigger.delivery.attempted` payload schema carries only the content-free
      `{subscriptionId,dedupKey,attempt,outcome,runId?}` fields (RFC 0083 §C —
      the inbound body never appears on it); the capability-gated behavioral leg
      (`triggerBridge.ingestion`) asserts a delivered event's
      `trigger.delivery.attempted` carries no inbound body/header content and
      that `webhook.headers` is a host-curated allowlist (no `Authorization`).

  # ===== RFC 0100 async / durable A2A tasks =====

  - id: a2a-push-egress-ssrf
    tier: protocol
    severity: critical
    threat_model: SECURITY/threat-model-secret-leakage.md
    tests:
      - conformance/src/scenarios/a2a-task-roundtrip.test.ts
    note: |
      RFC 0100 §4 / a2a-integration.md §"Async / durable Tasks". A
      caller-registered A2A push-notification `pushConfig.url` MUST be validated
      through the RFC 0093 webhook-egress SSRF guard before any push (no
      private/loopback/link-local target) — a caller-supplied push URL is an
      SSRF surface identical to a webhook. A push MUST NOT carry run-internal
      content beyond the projected `A2ATaskState` + A2A artifact references;
      `pushConfig.tokenFingerprint` MUST be a truncated/salted digest
      (`maxLength: 32`), never the raw push-auth token (SR-1, mirroring RFC
      0083's `secretFingerprint`). Public test: the always-on schema leg in
      `a2a-task-roundtrip.test.ts` asserts `PushConfig` requires `url`, that the
      `tokenFingerprint` ceiling structurally rejects a full-length raw token,
      and that an `A2ATaskState` carrying run inputs/artifacts inline fails
      `additionalProperties:false`; the capability-gated behavioral leg
      (`a2a.pushNotifications`) asserts a `pushConfig.url` at a private address
      is refused, reusing the RFC 0093 webhook-egress-guard fixture posture.

  # ===== RFC 0102 — A2UI agent-authored interface surfaces =====

  - id: a2ui-action-confinement
    tier: protocol
    severity: critical
    threat_model: SECURITY/threat-model-prompt-injection.md
    tests:
      - conformance/src/scenarios/a2ui-surface-shape.test.ts
    note: |
      RFC 0102 §A.2 / ai-envelope.md §"A2UI surfaces" rule 2. A `ui.a2ui-surface`
      action MUST resolve to exactly one host-allowlisted target — a run interrupt
      resume (interrupt.md) or a conversation exchange (RFC 0005) — and MUST NOT
      invoke any other host endpoint, side effect, or RPC. The closed
      `ui.a2ui-surface.schema.json` enforces this structurally: `action.button.action`
      is `{ target: enum["resume","exchange"] }` with `additionalProperties:false`,
      so a surface that targets an arbitrary URL/endpoint fails per-kind schema
      validation. Public test: the server-free Ajv2020 leg in `a2ui-surface-shape.test.ts`
      asserts a valid resume/exchange action validates and an out-of-enum / extra-prop
      action target is rejected.

  - id: a2ui-untrusted-blocks-approval
    tier: protocol
    severity: critical
    threat_model: SECURITY/threat-model-prompt-injection.md
    tests:
      - conformance/src/scenarios/a2ui-untrusted-blocks-approval.test.ts
    note: |
      RFC 0102 §A.5. A `ui.a2ui-surface` emitted by a node that consumed untrusted
      MCP/A2A content MUST carry `meta.contentTrust: 'untrusted'`, and the existing
      `untrusted_content_blocks_approval` rule then blocks that surface from advancing
      an `approval` interrupt — a prompt-injected surface cannot drive an approval gate.
      Composition of the existing untrusted-content rule for this kind; public test
      `a2ui-untrusted-blocks-approval.test.ts` asserts an untrusted-marked surface bound
      to an approval interrupt is refused.

  - id: a2ui-surface-no-secret-rendering
    tier: protocol
    severity: high
    threat_model: SECURITY/threat-model-secret-leakage.md
    tests:
      - conformance/src/scenarios/redaction.test.ts
    note: |
      RFC 0102 §A.5 (SR-1 carry-forward). A `ui.a2ui-surface` payload is walked by the
      same SR-1 redaction harness as every envelope payload (ai-envelope.md §"Redaction"),
      so no secret material renders in a surface. This is a specialization of
      `secret-leakage-eventlog-payload`, which `redaction.test.ts` verifies applies to
      ALL envelope payloads; the a2ui payload carries only text/label/binding fields
      (closed schema) and no opaque blob field, so there is no secret-bearing channel to
      bypass redaction.

  - id: a2ui-surface-no-code-exec
    tier: reference-impl
    severity: critical
    threat_model: SECURITY/threat-model-prompt-injection.md
    tests:
      - openwop-app:frontend/react/src/chat/a2ui/__tests__/no-code-exec.test.ts
    note: |
      RFC 0102 §A.1 / ai-envelope.md §"A2UI surfaces" rule 1. A consumer rendering a
      `ui.a2ui-surface` MUST render only components in the host's advertised catalog and
      MUST NOT execute or evaluate any agent-supplied code, script, expression, or markup;
      an out-of-catalog/malformed surface renders fail-closed (fallback notice). This is a
      render-side guarantee the server-oriented conformance suite cannot observe — it ships
      as a suite-version requirement with a reference-app client probe (openwop-app, ADR
      0051). The closed `anyOf` `surface` schema (verified server-free in
      `a2ui-surface-shape.test.ts`) is the enabling precondition: a surface that smuggles a
      script-bearing field fails schema validation before it can reach a renderer.

  - id: a2ui-surface-no-network-egress
    tier: reference-impl
    severity: high
    threat_model: SECURITY/threat-model-prompt-injection.md
    tests:
      - openwop-app:frontend/react/src/chat/a2ui/__tests__/no-egress.test.ts
    note: |
      RFC 0102 §A.2. A rendered `ui.a2ui-surface` MUST NOT initiate any network egress
      (fetch/beacon/img-to-attacker-URL) — data-exfil via an injected action is the threat.
      Render-side guarantee, reference-app client probe (suite-version requirement). The
      schema's confined `action.target` enum (no arbitrary URL) is the structural
      precondition verified server-free in `a2ui-surface-shape.test.ts`.

  - id: content-published-cache-no-draft
    tier: protocol
    severity: critical
    threat_model: SECURITY/threat-model-secret-leakage.md
    tests:
      - conformance/src/scenarios/localized-content-delivery.test.ts
    note: |
      RFC 0103 §F (`localized-content.md`). The public, cacheable content
      delivery path (`GET /v1/content/pages/{slug}`) MUST serve
      `status: "published"` sections/pages only. A draft section or page MUST
      NOT appear in any public response and MUST NOT be written into any
      shared/public cache entry; the cache key MUST be scoped so a draft can
      never be served from a cached published response. Unpublished authored
      content is pre-release material — leaking it via the `public,
      max-age=300` cache is the threat.

  - id: content-response-tenant-scoped
    tier: protocol
    severity: critical
    threat_model: SECURITY/threat-model-secret-leakage.md
    tests:
      - conformance/src/scenarios/localized-content-delivery.test.ts
    note: |
      RFC 0103 §F (`localized-content.md`). Every content read and write MUST
      be scoped to the resolved tenant (credential-derived per RFC 0048 when
      authenticated; host-defined mapping when anonymous, §F / register G11).
      A page/section belonging to another tenant MUST be unreachable. Mirrors
      `webhook-cross-tenant-isolation` / `kv-cross-tenant-isolation` for the
      content-delivery surface.

  - id: content-no-cross-tenant-enumeration
    tier: protocol
    severity: high
    threat_model: SECURITY/threat-model-secret-leakage.md
    tests:
      - conformance/src/scenarios/localized-content-delivery.test.ts
    note: |
      RFC 0103 §F (`localized-content.md`). A request for a
      `slug`/`pageId`/`sectionId` that exists under a DIFFERENT tenant MUST
      return the same `404` as a wholly nonexistent id — the response MUST NOT
      distinguish "exists for another tenant" from "does not exist" (no
      existence oracle). The no-enumeration guarantee holds relative to the
      host-resolved tenant.

  - id: voice-transcript-untrusted
    tier: protocol
    severity: critical
    threat_model: SECURITY/threat-model-prompt-injection.md
    tests:
      - conformance/src/scenarios/voice-event-payloads-shape.test.ts
    note: |
      RFC 0106 §F INV-2. Every live-transcript emission (interim AND final) —
      `voice.transcript` and `voice.turn_commit.finalText` — is UNTRUSTED ingress
      (a live mic is an always-open, low-friction channel; anyone in acoustic
      range is an unauthenticated writer). It MUST carry the `contentTrust:
      "untrusted"` marker and MUST NOT be promoted to system/developer authority
      (OWASP LLM01:2025; the OpenAI Model Spec trust hierarchy), inheriting the
      RFC 0091 §C / RFC 0105 §D untrusted-media boundary. The wire half is
      schema-enforced and verified server-free: the `voice.transcript` payload
      REQUIRES `contentTrust: "untrusted"` (`run-event-payloads.schema.json`
      `$defs.voiceTranscript`). The behavioral "not promoted to authority" half
      is exercised by the gated reference-host leg at `Active → Accepted`.

  - id: voice-interim-not-durable
    tier: reference-impl
    severity: critical
    threat_model: SECURITY/threat-model-prompt-injection.md
    tests:
      - conformance/src/scenarios/voice-interim-not-durable.test.ts
    note: |
      RFC 0106 §F INV-1. Non-final transcript (`voice.transcript` with
      `isFinal: false`) MUST NOT be persisted to durable memory, the
      replay/event log, or RAG, and MUST NOT drive a side-effecting tool call,
      until it finalizes. Interim ASR is provider-documented as revisable (AWS
      `Stable:false`, Deepgram/Google `is_final:false`); acting on it commits to
      a string the speaker never finally said (interim→final poisoning). Detect:
      feed a scripted stream whose interim ("transfer 500") differs from its
      final ("transfer information"); assert the durable log and any
      side-effecting tool invocation contain only finalized text, and no
      side-effecting tool fired before `turn_commit` / `isFinal:true`.
      STAYS reference-impl: the openwop-app live host transcribes via finalized
      media assets (no divergent-interim emission to observe), so a non-vacuous
      interim-vs-final divergence is not yet proven; the gated leg
      `voice-interim-not-durable.test.ts` soft-skips until a host with a
      scripted-interim test-seam arm proves it, then graduates to protocol.

  - id: voice-bargein-no-partial-leak
    tier: protocol
    severity: high
    threat_model: SECURITY/threat-model-prompt-injection.md
    tests:
      - conformance/src/scenarios/voice-bargein-no-partial-leak.test.ts
    note: |
      RFC 0106 §F INV-3. A barge-in / stream cancellation (`voice.cancelled`)
      MUST NOT emit partial tool outputs or partial un-guardrailed model output,
      and MUST roll back or fully complete (never half-apply) an in-flight tool
      side effect; retained state MUST pass the end-of-turn redaction/guardrail
      pass the cancellation would otherwise skip. Detect: drive the barge-in seam
      and assert `voice.barge_in` → `voice.cancelled` with NO `voice.synthesis_chunk`
      (partial output) emitted AFTER the cancel. Graduated reference-impl → protocol
      2026-06-23 on the openwop-app live host (rev `00293-89w`, steward-curl-verified:
      the `/v1/host/sample/voice/barge-in` seam emits chunks, then barge_in→cancelled,
      none after) — the behavioral leg `voice-bargein-no-partial-leak.test.ts`.

  - id: voice-streamref-tenant-bound
    tier: reference-impl
    severity: critical
    threat_model: SECURITY/threat-model-prompt-injection.md
    tests:
      - conformance/src/scenarios/voice-streamref-tenant-bound.test.ts
    note: |
      RFC 0106 §F INV-4. A `streamRef` MUST be bound to exactly one tenant +
      session for its lifetime; no buffered audio or interim transcript may be
      readable via another handle; and the session MUST enforce a max-duration /
      max-uncommitted-audio budget so a never-finalizing stream is bounded
      (TDoS-analog). Detect: (a) two concurrent streams under different tenants —
      tenant B presenting A's `streamRef` is rejected; (b) a stream that never
      finalizes is terminated at the configured budget. Reuses the
      `media-asset-url-tenant-scoped` (RFC 0055) tenant-scoping precedent.
      STAYS reference-impl: live `streamRef` transport is host-internal per §E and
      unsupported on the stateless openwop-app host (honest `transcription_unsupported`
      for a live `streamRef`), so there is no live conduit to exhibit cross-tenant
      binding; the gated leg `voice-streamref-tenant-bound.test.ts` soft-skips until
      a host with live `streamRef` transport proves it, then graduates to protocol.

  # ===== RFC 0117 front-end plugin packs (sandboxed UI extensions) =====

  - id: frontend-plugin-isolation
    tier: protocol
    severity: critical
    threat_model: SECURITY/threat-model-prompt-injection.md
    tests:
      - conformance/src/scenarios/frontend-plugin-packs.test.ts
    note: |
      `frontend-plugin-packs.md` §Isolation (amended by RFC 0119): a host
      advertising `capabilities.uiPlugins.supported: true` MUST execute every
      plugin `entry` in an ORIGIN/EXECUTION-ISOLATED sandbox — the plugin has no
      access to the host's execution context, host DOM, host-origin storage, or
      host credentials. A cross-origin sandboxed iframe (distinct origin + an HTML
      `sandbox` attribute withholding same-origin privileges) is the canonical
      browser mechanism; an equivalent WASM/process/container/VM sandbox enforcing
      the SAME property is equally conformant (the advertised
      `capabilities.uiPlugins.isolation` value names the mechanism). In-process
      loading, same-origin iframes, and module federation (the federated remote
      executing with the host's full privileges) are a protocol-tier MUST NOT —
      REGARDLESS of the advertised mechanism — because registry-distributed
      third-party code must never run with host authority. For `isolation:"wasm"`
      this MUST NOT additionally means the host binds NO host import to the plugin
      module beyond the single `ui-plugin/1` RPC entrypoint (no ambient host
      functions — an extra import is a silent side channel), mirroring the closed
      `openwop` import namespace RFC 0008 §C mandates for backend WASM packs (RFC
      0119 §Host-RPC). The always-on shape leg
      of `frontend-plugin-packs.test.ts` asserts `uiPlugins.isolation` is a member
      of the conformant model set (RFC 0119 enum / `x-host-*`); the gated
      behavioral leg drives a host advertising `uiPlugins.supported` and asserts
      the plugin runs out of the host's execution context. Graduates reference-impl
      → protocol when the openwop-app reference host (ADR 0153) serves the live
      sandboxed frame.

  - id: frontend-plugin-egress
    tier: protocol
    severity: high
    threat_model: SECURITY/threat-model-prompt-injection.md
    tests:
      - conformance/src/scenarios/frontend-plugin-packs.test.ts
    note: |
      `frontend-plugin-packs.md` §Security: absent declared `connectSrc`
      exceptions in the manifest, the host MUST serve the plugin under a
      DENY-EGRESS Content-Security-Policy — no network egress beyond the
      `ui-plugin/1` host-RPC channel. This confines a malicious or compromised
      plugin bundle to the host-mediated, authz-checked RPC seam and prevents
      exfiltration of any data the surface renders. Any `connectSrc` exception is
      part of the registry front-end-review checkpoint (`registry-operations.md`)
      and a host MAY refuse a pack whose exceptions it will not grant. The gated
      leg asserts the served CSP denies egress for a plugin with no declared
      `connectSrc`.

  - id: frontend-plugin-rpc-allowlist
    tier: protocol
    severity: critical
    threat_model: SECURITY/threat-model-prompt-injection.md
    tests:
      - conformance/src/scenarios/frontend-plugin-packs.test.ts
    note: |
      `frontend-plugin-packs.md` §Host-RPC: the host MUST reject any `ui-plugin/1`
      `request` whose `method` is not in BOTH the plugin's declared manifest
      `hostApi` allowlist AND the host's advertised `capabilities.uiPlugins.hostApi`
      set — returning a `response` `{ ok:false, error:{ code:"method_not_allowed" } }`,
      NEVER silently executing it. The plugin holds no credentials; every method
      is host-mediated and authz-checked, so an undeclared/unknown method is the
      privilege-escalation surface this invariant closes. The always-on shape leg
      validates the `ui-plugin-message.schema.json` allowlist `enum` + the
      `method_not_allowed` error code; the gated leg drives an undeclared-method
      `request` against a live host and asserts the `method_not_allowed` refusal.

  - id: frontend-plugin-no-byok
    tier: protocol
    severity: critical
    threat_model: SECURITY/threat-model-secret-leakage.md
    tests:
      - conformance/src/scenarios/frontend-plugin-packs.test.ts
    note: |
      `frontend-plugin-packs.md` §Security: no BYOK credential material EVER
      crosses the `ui-plugin/1` boundary into the sandbox. A plugin operates
      purely through host-mediated, authz-checked RPC and holds no credentials;
      the `ui-plugin-message.schema.json` envelope carries no credential field,
      and the `error.message` field MUST NOT carry secret material. Reuses the
      SR-1 secret-redaction precedent (the sandbox is an untrusted boundary like
      RFC 0091 untrusted media). The always-on shape leg asserts the message
      schema exposes no credential-bearing field and that `additionalProperties`
      is closed on the envelope; the gated leg asserts an `artifact.read` result
      crossing the boundary carries no resolved BYOK plaintext.
