      `OPENWOP_OTEL_COLLECTOR=true`; sanitizer-level redaction is
      additionally unit-tested at the reference host.

  # ===== RFC 0014 host.fs sandbox =====

  - id: fs-path-traversal
    tier: protocol
    severity: critical
    threat_model: SECURITY/threat-model-secret-leakage.md
    tests:
      - conformance/src/scenarios/fs-path-traversal.test.ts
    note: |
      RFC 0014 §B + §C: hosts advertising `capabilities.fs.supported`
      MUST resolve every input path relative to `sandboxRoot` and
      reject any path that escapes via `..` segments OR via symlinks
      pointing outside the sandbox root. The same MUST-NOT applies to
      `core.openwop.files.{read,write,delete,stat,list}` and to the
      transport sub-surfaces (ftp/sftp/ssh) when those are advertised.
      Path-escape attempts MUST return `path_outside_sandbox` rather
      than silently following the link or partially fulfilling. Tested
      against any host advertising `capabilities.fs.supported`; skips
      cleanly otherwise.

  # ===== RFC 0046 host.credentials redaction =====

  - id: credential-payload-redaction
    tier: protocol
    severity: critical
    threat_model: SECURITY/threat-model-secret-leakage.md
    tests:
      - conformance/src/scenarios/credential-payload-redaction.test.ts
    note: |
      RFC 0046 §C.1: hosts advertising `capabilities.credentials.supported`
      MUST resolve a credential reference (`{ ref, scope }`) into the node
      sandbox ONLY. Resolved credential material MUST NOT appear in run
      `inputs`, persisted `variables`, `channels`, any `run.*` event
      payload, the debug bundle, or replay state. The reference is the
      only credential artifact permitted on the wire (see
      `credential-reference.schema.json`). The same MUST-NOT holds for
      tokens stored via the RFC 0047 `host.oauth` flow and for both old
      and new material during a `two-key-overlap` rotation window. Tested
      against any host advertising `capabilities.credentials.supported`;
      skips cleanly otherwise.

