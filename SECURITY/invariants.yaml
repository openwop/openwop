    tier: protocol
    severity: critical
    threat_model: SECURITY/threat-model-compensation.md
    tests:
      - conformance/src/scenarios/compensation-recovery.test.ts
    note: |
      RFC 0151 §C. An inverse action's identity is the tuple
      (tenantId, runId, forwardLogicalInvocationId, compensationOrdinal,
      profileVersion) — `attempt` is OUTSIDE it (RFC 0150 §B parity) — and a
      retry MUST re-present that identity as the downstream idempotency key.
      Two keys for one obligation is two refunds (threat model A1). Witnessed
      through the §21 recovery extension: `unwind` with
