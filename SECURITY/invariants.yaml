  # ===== MCP client (Phase H.2) =====

  - id: mcp-toolcall-payload-redaction
    tier: protocol
    severity: high
    threat_model: SECURITY/threat-model-prompt-injection.md
    tests:
      - conformance/src/scenarios/mcp-toolcall-redaction.test.ts
    note: |
      Hosts advertising `mcpClient` MUST declare `trustBoundary:
      "untrusted"` so downstream LLM consumers treat tool content as
      user data, not as instructions. Tool arguments + result content
      MUST NOT appear on emitted node-event payloads — only a sanitized
      summary (toolName, argumentsSha256, resultSha256, resultLength,
      isError) reaches the public event stream. Full content is
      persisted to per-run variables (authenticated surface) where the
      workflow can consume it under the UNTRUSTED trust boundary.

  # ===== HTTP client (Phase H.3) =====

  - id: http-client-ssrf-guard
    tier: protocol
    severity: critical
    threat_model: SECURITY/threat-model-secret-leakage.md
    tests:
      - conformance/src/scenarios/http-client-ssrf.test.ts
    note: |
      Hosts advertising `capabilities.httpClient` MUST declare
      `ssrfGuard: true` AND `maxResponseBodyBytes` (a positive integer).
      Without an SSRF guard, an authenticated tenant can submit a
      workflow whose `core.http.request` node probes deployer-internal
      addresses (AWS metadata service, internal Redis/Postgres, etc.).
      Without a body-size cap, a hostile upstream can OOM the host
      by streaming unbounded responses into per-run variables. Both
      defenses are reference-impl-tested in
      `examples/hosts/postgres/test/http-client.test.ts`; this
      protocol-tier invariant asserts the advertisement contract so
      independent implementers cannot ship a partial guard silently.

  # ===== Idempotency-Key determinism (1.1.2 safety-fix) =====

  - id: idempotency-key-deterministic
    tier: protocol
    severity: high
    threat_model: SECURITY/threat-model-secret-leakage.md
    tests:
      - conformance/src/scenarios/idempotency-key-determinism.test.ts
    note: |
      `core.openwop.http.idempotency-key` MUST be deterministic in
      `(runId, nodeId, payload)` — same logical request → same key, so
      the remote endpoint can dedupe across retries. Verified against
      the canonical SHA-256 formula
      `sha256(runId || \0 || nodeId || \0 || JSON.stringify(payload))`
      with output shape `openwop-<sha256-prefix-16>` per the 1.1.2
      schemas.
      Hardens against the 1.1.0/1.1.1 defect where the default `uuid`
      mode returned `randomUUID()` per call (each retry got a fresh key
      → remote service treated every attempt as a new request, the
      opposite of retry-safety). Removed in 1.1.2 as a safety-fix per
      `COMPATIBILITY.md §3`; calls with `mode: "uuid"` now reject with
      `CONFIG_INVALID`. The cross-impl vector test in the scenario lets
      third-party `core.openwop.http` reimplementations verify wire
      agreement on a fixed set of (runId, nodeId, payload) inputs.

  # ===== Agent memory (Phase I.1) =====

  - id: agent-memory-cti-1
    tier: protocol
    severity: critical
    threat_model: SECURITY/threat-model-secret-leakage.md
    tests:
      - conformance/src/scenarios/agentMemoryCrossTenantIsolation.test.ts
    note: |
      RFC 0004 CTI-1: a host implementing `MemoryAdapter` MUST scope
      every list/get query by authenticated principal → tenant_id.
      Tenant A's `mem://shared-ref` entries MUST NOT surface from
      tenant B's calls against the same `memoryRef`. Reference-impl
      verification: `examples/hosts/postgres/test/memory-adapter.test.ts`
      §8 (CTI-1 cross-tenant probe).

  - id: agent-memory-sr-1-redaction
    tier: protocol
    severity: critical
    threat_model: SECURITY/threat-model-secret-leakage.md
    tests:
      - conformance/src/scenarios/agentMemoryRedactionContract.test.ts
    note: |
      RFC 0004 SR-1: hosts MUST substitute `[REDACTED:<id>]` placeholders
      for any BYOK credential material in `MemoryEntry.content` BEFORE
      persistence. The raw cleartext MUST NEVER appear in `memory_entries`
      rows, on `agentMemory.put` event payloads, on debug bundles, or on
      webhook envelopes carrying memory events. Caller is responsible
      for the placeholder substitution at write time; the host MUST
      reject content over `maxEntrySizeBytes` to bound exposure.

  - id: memory-compaction-sr-1-carry-forward
    tier: protocol
    severity: critical
    threat_model: SECURITY/threat-model-secret-leakage.md
    tests:
      - conformance/src/scenarios/memory-compaction-sr1-carry-forward.test.ts
    note: |
      RFC 0012 §D (Active 2026-05-13). SR-1 applies transitively
      through compaction: when a host advertising
      `capabilities.memory.compaction.supported: true` produces a
      compacted MemoryEntry whose content is derived from one or more
      source entries, the host MUST route the derived content through
      the same BYOK redaction harness it would apply to a fresh
      `put`. The fact that source entries were SR-1-compliant at
      original `put` time is NOT evidence to skip redaction on
      derived content — summarization models can introduce secret-
      shaped substrings (hallucinated tokens, format-leaks from
      in-context examples) not present in any source. The redaction
      harness is the only protocol-level defense at the compaction
      boundary.

  - id: envelope-redaction-sr-1-carry-forward
    tier: protocol
    severity: critical
    threat_model: SECURITY/threat-model-secret-leakage.md
    tests:
      - conformance/src/scenarios/aiEnvelope.redaction.test.ts
    note: |
      `spec/v1/ai-envelope.md` §"Redaction (SR-1 carry-forward)"
      (FINAL v1.1 since 2026-05-18 via RFC 0021; first cut 2026-05-17).
      SR-1 applies transitively through
      LLM emission: when a host accepts an AI Envelope from a node,
      the engine MUST route the envelope's payload through the same
      BYOK redaction harness applied to a fresh `MemoryEntry.put`
      per `agent-memory.md` §"SR-1 secret-redaction invariant".
      The fact that the LLM was instructed not to emit secrets is
      NOT evidence to skip redaction — the model can hallucinate
      secret-shaped substrings from prompt context, in-context
      examples, or tool results. Redacted material MUST NOT appear
      in resulting `RunEventDoc`s, OTel span attributes
      (`openwop.envelope_*`), debug-bundle exports, or error
      envelopes returned to the client on validation refusal. The
      redaction pass runs AFTER schema validation and BEFORE
      dedup/handler routing per the spec's production-flow
      ordering. Behavioral assertions in the test file ship as
      `it.todo()` until a reference host wires the envelope
      accept path.

