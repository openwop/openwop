  - id: agent-skill-profile-stateless
    tier: protocol
    severity: medium
    threat_model: SECURITY/threat-model-node-packs.md
    tests:
      - conformance/src/scenarios/agent-manifest-role-profile.test.ts
    note: |
      RFC 0131 §B. A `role: "skill"` `AgentManifest` MUST declare `handoff`
      and MUST NOT declare `memoryShape.conversation`/`memoryShape.longTerm`
      as `true` (scratchpad-only). The enforcing gate is the schema-encoded
      `if role==="skill"` conditional in `agent-manifest.schema.json`: a
      violating skill manifest FAILS validation at publish/install
      (`pack_validation_failed`) — a malformed manifest (RFC 0003 §C author
      error), NOT an RFC 0072 §C `degraded[]` runtime tier (whose "the host
      lacks a capability a well-formed agent wants" meaning is deliberately
      NOT overloaded). Keeps a composable, task-scoped skill stateless and
      replay-clean (RFC 0041); persistent + multi-turn memory belong to the
      composing assistant/roster agent (RFC 0039). `role` is EXPLICIT, never
      inferred — an absent `role` (or `role: "assistant"`) is unconstrained,
      so no pre-existing manifest changes validity. The always-on test is the
      public witness (validate skill/assistant/no-role cases; reject the
      stateful skill + the handoff-less skill + a bad enum value).
    witness: claims-check
    witnessReview: initial-mechanical-2026-09-02

  - id: agent-pack-handoff-schema-enforcement
    tier: protocol
    severity: high
    threat_model: SECURITY/threat-model-prompt-injection.md
    tests:
      - conformance/src/scenarios/agentPackHandoffSchemaValidation.test.ts
    note: |
      When an `AgentManifest` carries `handoff.taskSchemaRef` and/or
      `handoff.returnSchemaRef` (RFC 0003 §D), the host MUST validate
      inbound dispatch payloads against `taskSchemaRef` BEFORE invoking
      the agent, AND validate outbound return payloads against
      `returnSchemaRef` BEFORE persistence. Invalid payloads in either
      direction MUST be rejected with a structured error envelope; the
      agent MUST NOT see a malformed task, and the persistence store
      MUST NOT contain an off-schema result. Pairs with the prompt-
      injection threat model: typed handoffs are a load-bearing defense
      against an attacker who controls the inputs into an agent dispatch
      from a less-trusted surface (chat, webhook, conversation channel)
      and tries to widen the agent's input contract beyond what the
      manifest author declared. Closes HV-1.
    witness: witnessable-gated
    witnessReview: initial-mechanical-2026-09-02

  - id: agents-run-no-raw-handler
    tier: protocol
    severity: high
    threat_model: SECURITY/threat-model-prompt-injection.md
    tests:
      - conformance/src/scenarios/agents-run-tool-allowlist.test.ts
    note: |
      `core.openwop.agents.run` MUST refuse `inputs.tools[]` entries with
      a function-typed `handler` property. Tools MUST be structured
      declarations (`{ kind, name, ref?, argumentsSchema? }`) the host
      resolves through its connector registry — never executable JS
      supplied by the workflow author.
      Closes `OPENWOP-AUDIT-2026-003`: the 1.0.0 pack invoked
      `tool.handler(call.arguments, ctx)` directly in its fallback loop,
      executing arbitrary workflow-supplied code against the pack's full
      `ctx` (including `ctx.callAI`, `ctx.storage`, secrets views). 1.0.1
      refuses function handlers at the validateTools boundary with
      `INVALID_TOOL_DECLARATION`, BEFORE any LLM call. Tool-driven runs
      additionally require `ctx.agentRuntime` (host-resolved dispatch).
      This protocol-tier invariant pairs with the reference-impl-tier
      `prompt-injection-tool-allowlist`: defense-in-depth across both
      layers.
    witness: claims-check
    witnessReview: initial-mechanical-2026-09-02

