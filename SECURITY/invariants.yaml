    note: |
      RFC 0102 §A.2 / ai-envelope.md §"A2UI surfaces" rule 2. A `ui.a2ui-surface`
      action MUST resolve to exactly one host-allowlisted target — a run interrupt
      resume (interrupt.md) or a conversation exchange (RFC 0005) — and MUST NOT
      invoke any other host endpoint, side effect, or RPC. The closed
      `ui.a2ui-surface.schema.json` enforces this structurally: `action.button.action`
      is `{ target: enum["resume","exchange"] }` with `additionalProperties:false`,
      so a surface that targets an arbitrary URL/endpoint fails per-kind schema
      validation. Public test: the server-free Ajv2020 leg in `a2ui-surface-shape.test.ts`
      asserts a valid resume/exchange action validates and an out-of-enum / extra-prop
      action target is rejected.
    witness: claims-check
    witnessReview: reviewed-2026-09-02

  - id: a2ui-untrusted-blocks-approval
    tier: protocol
    severity: critical
    threat_model: SECURITY/threat-model-prompt-injection.md
    tests:
      - conformance/src/scenarios/a2ui-untrusted-blocks-approval.test.ts
    note: |
      RFC 0102 §A.5. A `ui.a2ui-surface` emitted by a node that consumed untrusted
      MCP/A2A content MUST carry `meta.contentTrust: 'untrusted'`, and the existing
      `untrusted_content_blocks_approval` rule then blocks that surface from advancing
      an `approval` interrupt — a prompt-injected surface cannot drive an approval gate.
      Composition of the existing untrusted-content rule for this kind; public test
      `a2ui-untrusted-blocks-approval.test.ts` asserts an untrusted-marked surface bound
      to an approval interrupt is refused.
    witness: seam-gated
    witnessReview: reviewed-2026-09-02

