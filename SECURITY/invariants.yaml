    tier: protocol
    severity: high
    threat_model: SECURITY/threat-model-secret-leakage.md
    tests:
      - conformance/src/scenarios/redaction.test.ts
    note: |
      RFC 0102 §A.5 (SR-1 carry-forward). A `ui.a2ui-surface` payload is walked by the
      same SR-1 redaction harness as every envelope payload (ai-envelope.md §"Redaction"),
      so no secret material renders in a surface. This is a specialization of
      `secret-leakage-eventlog-payload`, which `redaction.test.ts` verifies applies to
      ALL envelope payloads; the a2ui payload carries only text/label/binding fields
