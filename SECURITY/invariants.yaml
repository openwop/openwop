  - id: prompt-injection-mcp-marker
    tier: reference-impl
    severity: medium
    threat_model: SECURITY/threat-model-prompt-injection.md
    tests:
      - apps/workflow-engine/backend/typescript/test/untrusted-marker.test.ts
    note: |
      MCP tool responses wrapped in untrusted markers in next LLM turn.
      The in-tree test exercises the `core.openwop.mcp.invoke-tool`
      delegate's new `markedContent` field: wraps result in
      `<UNTRUSTED tool="<name>">...</UNTRUSTED>` whenever the host's
      MCP client flags untrustedContent OR the run is operating under
      `ctx.trustBoundary === 'untrusted'` (RFC 0020 §D).

  - id: prompt-injection-mcp-no-approval
