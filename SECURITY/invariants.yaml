      - examples/hosts/postgres/test/reasoning-event-emission.test.ts
    note: |
      Sensitive workflow variables MUST be masked per host's advertised
      compliance.defaultMode. Verified in reference impl; conformance
      implementation-specific coverage is enforced by conformant hosts.

