  - id: secret-leakage-debug-bundle
    tier: protocol
    severity: high
    threat_model: SECURITY/threat-model-secret-leakage.md
    tests:
      - conformance/src/scenarios/debugBundle.test.ts
    note: |
      Debug bundles inherit redaction per spec/v1/debug-bundle.md
      §"Redaction guarantees". The v1.0 conformance baseline plants a
      BYOK-shaped canary in workflow inputs and asserts it does not
      appear verbatim in the bundle response.

  - id: secret-leakage-debug-bundle-otel
    tier: protocol
    severity: high
    threat_model: SECURITY/threat-model-secret-leakage.md
    tests:
      - conformance/src/scenarios/envelope-reasoning-secret-redaction.test.ts
    note: |
      Graduated reference-impl → protocol on 2026-05-21 via RFC 0034 §C:
      conformance gates on capabilities.observability.testSeams.debugBundleExport;
      advertising hosts MUST serve POST /v1/host/sample/test/debug-bundle/export
