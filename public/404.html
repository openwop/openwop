<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>404 — Not Found · OpenWOP</title>
<meta name="description" content="That OpenWOP page does not exist." />
<meta name="robots" content="noindex, follow" />
<link rel="canonical" href="https://openwop.dev/" />
<link rel="icon" href="/assets/OpenWOP.svg" type="image/svg+xml" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@300;400;500;600&family=Geist+Mono:wght@400;500&display=swap" />
<meta name="theme-color" content="#f4f1ea" media="(prefers-color-scheme: light)" />
<meta name="theme-color" content="#1a1a17" media="(prefers-color-scheme: dark)" />
<style>
  :root {
    --paper: #f4f1ea;
    --ink: #1a1a17;
    --ink-2: #4a4842;
    --ink-3: #837f72;
    --rule: #d9d4c5;
    --clay: oklch(58% 0.13 40);
    --serif: "Instrument Serif", "Times New Roman", serif;
    --sans:  "Geist", ui-sans-serif, system-ui, sans-serif;
    --mono:  "Geist Mono", ui-monospace, "SF Mono", Menlo, monospace;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--paper);
    color: var(--ink);
    font-family: var(--sans);
    font-size: 16px;
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
    min-height: 100svh;
    display: grid;
    place-items: center;
    padding: 32px;
  }
  .card {
    max-width: 640px;
    text-align: center;
  }
  .marker {
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--ink-3);
  }
  .marker .dot {
    display: inline-block;
    width: 5px;
    height: 5px;
    border-radius: 50%;
    background: var(--clay);
    margin-right: 10px;
    transform: translateY(-2px);
  }
  h1 {
    font-family: var(--serif);
    font-size: clamp(48px, 8vw, 96px);
    font-weight: 400;
    line-height: 1.05;
    margin: 24px 0 16px;
    letter-spacing: -0.01em;
  }
  h1 em { font-style: italic; color: var(--clay); }
  p {
    color: var(--ink-2);
    max-width: 48ch;
    margin: 0 auto 28px;
    font-size: 17px;
  }
  .actions { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
  .btn {
    font-family: var(--sans);
    font-size: 14px;
    font-weight: 500;
    padding: 10px 18px;
    border-radius: 8px;
    border: 1px solid var(--ink);
    color: var(--ink);
    text-decoration: none;
    transition: background 120ms ease, color 120ms ease;
  }
  .btn-primary { background: var(--ink); color: var(--paper); }
  .btn-primary:hover { background: var(--clay); border-color: var(--clay); }
  .btn-ghost:hover { background: var(--ink); color: var(--paper); }
  .code {
    font-family: var(--mono);
    font-size: 12px;
    color: var(--ink-3);
    margin-top: 32px;
    padding-top: 16px;
    border-top: 1px solid var(--rule);
  }
</style>
</head>
<body>
  <main class="card">
    <div class="marker"><span class="dot"></span>404 · NOT FOUND</div>
    <h1>This page is <em>unreachable</em>.</h1>
    <p>The URL you followed doesn't match any document on this site. The spec, conformance leaderboard, and profile catalog are linked below.</p>
    <div class="actions">
      <a class="btn btn-primary" href="/">Back to openwop.dev</a>
      <a class="btn btn-ghost" href="/spec/v1/">Browse the spec</a>
      <a class="btn btn-ghost" href="/conformance/">Conformance leaderboard</a>
    </div>
    <div class="code">GET <span id="path"></span> → 404</div>
  </main>
  <script>document.getElementById('path').textContent = location.pathname;</script>
</body>
</html>
